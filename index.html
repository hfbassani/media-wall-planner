            const vw = vh * (0.45 + rand() * 0.2);
            ctx.fillStyle = rand() < 0.5 ? '#e9e3d8' : '#3b3633';
            ctx.beginPath();
            ctx.ellipse(vx, ly - vh / 2, vw / 2, vh / 2, 0, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        if (ly < iy + ih - 0.5) {
          ctx.fillStyle = U.shade(c, 0.12);
          ctx.fillRect(ix, ly - thick, iw, thick);
          g = ctx.createLinearGradient(0, ly, 0, ly + 4 * s);
          g.addColorStop(0, 'rgba(0,0,0,0.25)');
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g;
          ctx.fillRect(ix, ly, iw, 4 * s);
        }
        prev = ly;
      }
    },

    fireplace(ctx, el, w, h, s, time) {
      const c = el.color;
      const rand = seeded(el, 'fire');
      ctx.fillStyle = c;
      ctx.fillRect(0, 0, w, h);
      const inset = Math.max(2, 3 * s);
      const ix = inset, iy = inset, iw = Math.max(0, w - inset * 2), ih = Math.max(0, h - inset * 2);
      ctx.fillStyle = '#060504';
      ctx.fillRect(ix, iy, iw, ih);
      ctx.save();
      ctx.beginPath();
      ctx.rect(ix, iy, iw, ih);
      ctx.clip();
      // ember bed
      const bedH = Math.max(2, ih * 0.16);
      let g = ctx.createLinearGradient(0, iy + ih - bedH, 0, iy + ih);
      g.addColorStop(0, 'rgba(255,120,40,0.0)');
      g.addColorStop(0.5, 'rgba(255,110,30,0.65)');
      g.addColorStop(1, 'rgba(120,30,10,0.9)');
      ctx.fillStyle = g;
      ctx.fillRect(ix, iy + ih - bedH, iw, bedH);
      // flames
      ctx.globalCompositeOperation = 'lighter';
      const n = Math.max(4, Math.round(iw / (9 * s)));
      const t = (time || 0) / 1000;
      for (let i = 0; i < n; i++) {
        const phase = rand() * Math.PI * 2;
        const speed = 2 + rand() * 2.5;
        const fx = ix + (iw / n) * (i + 0.5) + Math.sin(t * 1.3 + phase) * (iw / n) * 0.15;
        const fh = ih * (0.45 + 0.35 * (0.5 + 0.5 * Math.sin(t * speed + phase)) + rand() * 0.1);
        const fw = (iw / n) * (0.9 + rand() * 0.6);
        const base = iy + ih - bedH * 0.4;
        const fg = ctx.createLinearGradient(0, base, 0, base - fh);
        fg.addColorStop(0, 'rgba(255,170,60,0.85)');
        fg.addColorStop(0.45, 'rgba(255,110,30,0.55)');
        fg.addColorStop(1, 'rgba(255,60,10,0)');
        ctx.fillStyle = fg;
        ctx.beginPath();
        ctx.moveTo(fx - fw / 2, base);
        ctx.quadraticCurveTo(fx - fw * 0.45, base - fh * 0.55, fx + Math.sin(t * 3 + phase) * fw * 0.15, base - fh);
        ctx.quadraticCurveTo(fx + fw * 0.45, base - fh * 0.55, fx + fw / 2, base);
        ctx.closePath();
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
      // glass reflection
      g = ctx.createLinearGradient(ix, iy, ix + iw * 0.6, iy + ih);
      g.addColorStop(0, 'rgba(255,255,255,0.08)');
      g.addColorStop(0.4, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.fillRect(ix, iy, iw, ih);
      ctx.restore();
    },
  };

  function paint(ctx, el, w, h, s, time) {
    (painters[el.texture] || painters.matte)(ctx, el, w, h, s, time);
  }

  const textures = {
    list() {
      return Object.entries(A.vocab.textures).map(([id, t]) => ({ id, label: t.label }));
    },
    animated(el) {
      return el.texture === 'fireplace';
    },
    /** Draw el's texture into rect (CSS px). opts: { pxPerCm, time } */
    draw(ctx, el, rect, opts = {}) {
      const s = opts.pxPerCm || 1;
      const w = rect.w, h = rect.h;
      if (w < 1 || h < 1) return;
      ctx.save();
      ctx.globalAlpha *= el.opacity == null ? 1 : el.opacity;
      if (textures.animated(el)) {
        ctx.beginPath();
        ctx.rect(rect.x, rect.y, w, h);
        ctx.clip();
        ctx.translate(rect.x, rect.y);
        paint(ctx, el, w, h, s, opts.time || 0);
        ctx.restore();
        return;
      }
      const m = ctx.getTransform();
      const scale = Math.max(1, Math.hypot(m.a, m.b));
      const key = [el.id, el.texture, el.color, Math.round(w), Math.round(h), s.toFixed(3), scale.toFixed(2)].join('|');
      let tile = cache.get(key);
      if (tile) {
        cache.delete(key);
        cache.set(key, tile);
      } else {
        tile = document.createElement('canvas');
        tile.width = Math.max(1, Math.ceil(w * scale));
        tile.height = Math.max(1, Math.ceil(h * scale));
        const tctx = tile.getContext('2d');
        tctx.scale(scale, scale);
        paint(tctx, el, w, h, s, 0);
        cache.set(key, tile);
        if (cache.size > CACHE_MAX) cache.delete(cache.keys().next().value);
      }
      ctx.drawImage(tile, rect.x, rect.y, w, h);
      ctx.restore();
    },
    clearCache() {
      cache.clear();
    },
  };

  A.textures = textures;
})();
</script>
<script>
/* === src/render.js === */
/* Arch2D — WS3: scene renderer shared by the interactive canvas and the PNG exporter
   (project.md §3.3, §3.7). Draws in CSS pixels; callers handle devicePixelRatio. */
(function () {
  'use strict';
  const A = window.Arch2D;
  const U = A.util;
  const V = A.vocab;

  const SEL = 'hsl(190, 85%, 60%)';
  const wallPatternCache = new Map();

  function makeTransform(s, ox, oy) {
    return {
      s,
      x: (cm) => ox + cm * s,
      y: (cm) => oy - cm * s,
      cmX: (px) => (px - ox) / s,
      cmY: (px) => (oy - px) / s,
      rect: (el) => ({ x: ox + el.x * s, y: oy - (el.y + el.height) * s, w: el.width * s, h: el.height * s }),
    };
  }

  function handleRects(r, size = 9) {
    const hs = size / 2;
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2, x2 = r.x + r.w, y2 = r.y + r.h;
    return [
      { key: 'nw', x: r.x - hs, y: r.y - hs },
      { key: 'n', x: cx - hs, y: r.y - hs },
      { key: 'ne', x: x2 - hs, y: r.y - hs },
      { key: 'e', x: x2 - hs, y: cy - hs },
      { key: 'se', x: x2 - hs, y: y2 - hs },
      { key: 's', x: cx - hs, y: y2 - hs },
      { key: 'sw', x: r.x - hs, y: y2 - hs },
      { key: 'w', x: r.x - hs, y: cy - hs },
    ].map((h) => Object.assign(h, { w: size, h: size }));
  }

  /* ---------- wall surface ---------- */
  function wallPattern(ctx, mood, s) {
    const m = V.moods[mood] || V.moods.japandi;
    const key = mood + '|' + s.toFixed(2);
    if (wallPatternCache.has(key)) return wallPatternCache.get(key);
    const tile = document.createElement('canvas');
    let pat;
    if (m.wallPattern === 'brick') {
      const bw = Math.max(8, 21.5 * s), bh = Math.max(3, 6.5 * s), mortar = Math.max(1, 1 * s);
      tile.width = Math.ceil(bw * 2);
      tile.height = Math.ceil((bh + mortar) * 2);
      const t = tile.getContext('2d');
      t.fillStyle = U.shade(m.wall, 0.35);
      t.fillRect(0, 0, tile.width, tile.height);
      const rand = U.rng(7);
      for (let row = 0; row < 2; row++) {
        for (let col = -1; col < 3; col++) {
          const x = col * (bw + mortar) + (row % 2 ? bw / 2 : 0);
          t.fillStyle = U.shade(m.wall, (rand() - 0.5) * 0.22);
          t.fillRect(x, row * (bh + mortar), bw, bh);
        }
      }
      pat = ctx.createPattern(tile, 'repeat');
    } else {
      tile.width = tile.height = 96;
      const t = tile.getContext('2d');
      const rand = U.rng(U.hashString(mood));
      for (let i = 0; i < 900; i++) {
        t.fillStyle = rand() < 0.5 ? 'rgba(0,0,0,0.025)' : 'rgba(255,255,255,0.03)';
        t.fillRect(rand() * 96, rand() * 96, 1 + rand() * 2, 1 + rand() * 2);
      }
      pat = ctx.createPattern(tile, 'repeat');
    }
    wallPatternCache.set(key, pat);
    if (wallPatternCache.size > 24) wallPatternCache.delete(wallPatternCache.keys().next().value);
    return pat;
  }

  /** Ready photo image for this render pass, or null (no photo, hidden, excluded, or decoding). */
  function photoFor(state, o) {
    const p = state.wallPhoto;
    if (o.photo === false || !p || !A.photo) return null;
    if (o.photo === true) return A.photo.image(p.id);
    if (o.theme === 'export' ? !p.showOnExport : !p.visible) return null;
    return A.photo.image(p.id);
  }

  function drawWall(ctx, state, T, o) {
    if (o.wall === false) return;
    const m = V.moods[state.mood] || V.moods.japandi;
    const x = T.x(0), y = T.y(state.wallHeight), w = state.wallWidth * T.s, h = state.wallHeight * T.s;
    const photo = photoFor(state, o);
    if (photo) {
      const b = (state.wallPhoto && state.wallPhoto.bounds) || (A.photo && A.photo.bounds(state.wallPhoto.id));
      let px, py, dw, dh;

      if (b && b.wCm && b.hCm) {
        // Calibrated image with full room bounds: wall quad is aligned 1:1, surrounding room is visible!
        px = T.x(b.xCm);
        py = T.y(b.yCm + b.hCm); // screen Y of top edge
        dw = b.wCm * T.s;
        dh = b.hCm * T.s;
      } else {
        // Uncalibrated raw image: anchor to floor (Y=0), scale to wall height
        const pw = photo.naturalWidth || photo.width || 1;
        const ph = photo.naturalHeight || photo.height || 1;
        const ar = pw / ph;
        const cmH = state.wallHeight;
        const cmW = cmH * ar;
        const cmX = (state.wallWidth - cmW) / 2;
        const cmY = 0;
        px = T.x(cmX);
        py = T.y(cmY + cmH);
        dw = cmW * T.s;
        dh = cmH * T.s;
      }

      // Draw room photo cropped with elegant rounded corners
      const cornerR = Math.max(8, Math.min(28, Math.round(14 * (o.uiScale || 1))));

      if (o.theme === 'screen') {
        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
        ctx.shadowBlur = 32 * o.dpr;
        ctx.shadowOffsetY = 10 * o.dpr;
        ctx.fillStyle = '#141820';
        roundRect(ctx, px, py, dw, dh, cornerR);
        ctx.fill();
        ctx.restore();
      }

      ctx.save();
      roundRect(ctx, px, py, dw, dh, cornerR);
      ctx.clip();
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(photo, px, py, dw, dh);
      ctx.restore();

      // Soft architectural border around the rounded photo frame
      ctx.save();
      roundRect(ctx, px, py, dw, dh, cornerR);
      ctx.strokeStyle = o.theme === 'export' ? 'rgba(0, 0, 0, 0.16)' : 'rgba(255, 255, 255, 0.22)';
      ctx.lineWidth = Math.max(1, 1.5 * (o.uiScale || 1));
      ctx.stroke();
      ctx.restore();

      // Subtle dashed border for the media wall boundary over the room photo
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
      ctx.restore();
      return; // real photo carries its own texture and lighting
    }

    ctx.save();
    if (o.theme === 'screen') {
      ctx.shadowColor = 'rgba(0,0,0,0.45)';
      ctx.shadowBlur = 30 * o.dpr;
      ctx.shadowOffsetY = 8 * o.dpr;
    }
    ctx.fillStyle = m.wall;
    ctx.fillRect(x, y, w, h);
    ctx.restore();
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = wallPattern(ctx, state.mood, T.s);
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
    // ceiling shadow
    const g = ctx.createLinearGradient(0, y, 0, y + Math.min(h, 40 * T.s));
    g.addColorStop(0, 'rgba(0,0,0,0.12)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, Math.min(h, 40 * T.s));
  }

  function inkFor(state, o) {
    const m = V.moods[state.mood] || V.moods.japandi;
    const lum = o && photoFor(state, o) ? A.photo.luminance(state.wallPhoto.id) : U.luminance(m.wall);
    return lum > 0.5 ? '0,0,0' : '255,255,255';
  }

  function drawGrid(ctx, state, T, o) {
    const ink = inkFor(state, o);
    const x0 = T.x(0), x1 = T.x(state.wallWidth), y0 = T.y(0), y1 = T.y(state.wallHeight);
    const levels = [
      { step: 5, alpha: 0.07, dash: [2, 3], min: 6 },
      { step: 10, alpha: 0.13, dash: [], min: 5 },
      { step: 50, alpha: 0.2, dash: [], min: 4 },
      { step: 100, alpha: 0.28, dash: [], min: 3 },
    ];
    ctx.save();
    for (const lv of levels) {
      if (lv.step * T.s < lv.min) continue;
      ctx.strokeStyle = `rgba(${ink},${lv.alpha})`;
      ctx.lineWidth = lv.step >= 50 ? 1 : 0.75;
      ctx.setLineDash(lv.dash);
      ctx.beginPath();
      for (let cm = lv.step; cm < state.wallWidth; cm += lv.step) {
        if (lv.step < 100 && cm % (lv.step * 2) === 0 && lv.step >= 10 && lv.step * 2 * T.s >= lv.min) continue;
        const px = Math.round(T.x(cm)) + 0.5;
        ctx.moveTo(px, y1);
        ctx.lineTo(px, y0);
      }
      for (let cm = lv.step; cm < state.wallHeight; cm += lv.step) {
        const py = Math.round(T.y(cm)) + 0.5;
        ctx.moveTo(x0, py);
        ctx.lineTo(x1, py);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawFloor(ctx, state, T, o) {
    if (o.floor === false) return;
    const k = o.uiScale;
    const y = T.y(0);
    const x0 = T.x(0) - 20 * k, x1 = T.x(state.wallWidth) + 20 * k;
    const depth = 14 * k;
    const ink = o.theme === 'export' ? '40,40,40' : '200,205,215';
    ctx.save();
    ctx.fillStyle = o.theme === 'export' ? 'rgba(0,0,0,0.04)' : 'rgba(255,255,255,0.03)';
    ctx.fillRect(x0, y, x1 - x0, depth);
    ctx.beginPath();
    ctx.rect(x0, y, x1 - x0, depth);
    ctx.clip();
    ctx.strokeStyle = `rgba(${ink},0.35)`;
    ctx.lineWidth = 1 * k;
    ctx.beginPath();
    for (let x = x0 - depth; x < x1; x += 8 * k) {
      ctx.moveTo(x, y + depth);
      ctx.lineTo(x + depth, y);
    }
    ctx.stroke();
    ctx.restore();
    ctx.strokeStyle = `rgba(${ink},0.9)`;
    ctx.lineWidth = 2 * k;
    ctx.beginPath();
    ctx.moveTo(x0, y);
    ctx.lineTo(x1, y);
    ctx.stroke();
    ctx.fillStyle = `rgba(${ink},0.85)`;
    ctx.font = `600 ${10 * k}px Inter, sans-serif`;
    ctx.textBaseline = 'bottom';
    ctx.textAlign = 'right';
    ctx.fillText('FFL ±0', T.x(0) - 6 * k, y - 3 * k);
  }

  function drawRulers(ctx, state, T, o) {
    const k = o.uiScale;
    const ink = o.theme === 'export' ? '40,40,40' : '160,166,178';
    const step = pickStep(T.s / k);
    ctx.save();
    ctx.fillStyle = `rgba(${ink},0.9)`;
    ctx.strokeStyle = `rgba(${ink},0.55)`;
    ctx.lineWidth = 1 * k;
    ctx.font = `500 ${9.5 * k}px 'JetBrains Mono', monospace`;
    // bottom ruler (below floor hatch)
    const by = T.y(0) + 22 * k;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.beginPath();
    for (let cm = 0; cm <= state.wallWidth + 0.001; cm += step) {
      const x = T.x(cm);
      ctx.moveTo(x, by);
      ctx.lineTo(x, by + 5 * k);
      ctx.fillText(String(Math.round(cm)), x, by + 7 * k);
    }
    ctx.moveTo(T.x(0), by);
    ctx.lineTo(T.x(state.wallWidth), by);
    ctx.stroke();
    // left ruler
    const lx = T.x(0) - 12 * k;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.beginPath();
    for (let cm = 0; cm <= state.wallHeight + 0.001; cm += step) {
      const y = T.y(cm);
      ctx.moveTo(lx, y);
      ctx.lineTo(lx - 5 * k, y);
      if (cm > 0) ctx.fillText(String(Math.round(cm)), lx - 7 * k, y);
    }
    ctx.moveTo(lx, T.y(0));
    ctx.lineTo(lx, T.y(state.wallHeight));
    ctx.stroke();
    ctx.restore();
    // overall dimensions
    dimLine(ctx, T.x(0), T.y(0) + 46 * k, T.x(state.wallWidth), T.y(0) + 46 * k, `${fmt(state.wallWidth)} cm`, o, ink);
    dimLine(ctx, T.x(state.wallWidth) + 22 * k, T.y(0), T.x(state.wallWidth) + 22 * k, T.y(state.wallHeight), `${fmt(state.wallHeight)} cm`, o, ink);
  }
  function pickStep(pxPerCm) {
    for (const st of [10, 20, 25, 50, 100, 200, 500]) if (st * pxPerCm >= 34) return st;
    return 1000;
  }
  const fmt = (v) => (Math.round(v * 10) / 10).toString();

  /** Architectural dimension line with ticks and a centred label. */
  /** Architectural dimension line with ticks and a centred high-contrast label. */
  function dimLine(ctx, x1, y1, x2, y2, label, o, inkOverride) {
    const k = o.uiScale;
    const horiz = Math.abs(y2 - y1) < Math.abs(x2 - x1);
    const isExport = o.theme === 'export';

    // High contrast color scheme
    const lineStroke = isExport ? 'rgba(30, 41, 59, 0.85)' : 'rgba(56, 189, 248, 0.85)'; // crisp architectural cyan on screen
    const tickStroke = isExport ? 'rgba(30, 41, 59, 0.95)' : 'rgba(56, 189, 248, 0.95)';
    const pillBg = isExport ? '#ffffff' : 'rgba(11, 15, 23, 0.94)';
    const pillBorder = isExport ? 'rgba(30, 41, 59, 0.65)' : 'rgba(56, 189, 248, 0.7)';
    const textColor = isExport ? '#0f172a' : '#ffffff'; // Always crisp pure white on screen

    ctx.save();
    ctx.strokeStyle = lineStroke;
    ctx.lineWidth = 1.2 * k;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    // 45° architectural ticks
    ctx.strokeStyle = tickStroke;
    ctx.lineWidth = 1.5 * k;
    ctx.beginPath();
    const t = 4 * k;
    ctx.moveTo(x1 - t, y1 + t);
    ctx.lineTo(x1 + t, y1 - t);
    ctx.moveTo(x2 - t, y2 + t);
    ctx.lineTo(x2 + t, y2 - t);
    ctx.stroke();

    ctx.font = `700 ${10 * k}px 'JetBrains Mono', monospace`;
    const tw = ctx.measureText(label).width;
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    ctx.translate(mx, my);
    if (!horiz) ctx.rotate(-Math.PI / 2);

    // Pill background with rounded edges & crisp border
    ctx.fillStyle = pillBg;
    roundRect(ctx, -tw / 2 - 5 * k, -8 * k, tw + 10 * k, 16 * k, 4 * k);
    ctx.fill();

    ctx.strokeStyle = pillBorder;
    ctx.lineWidth = 1 * k;
    ctx.stroke();

    // Label text in maximum contrast
    ctx.fillStyle = textColor;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, 0, 0.5 * k);
    ctx.restore();
  }

  /* ---------- LED effects ---------- */
  function drawHalo(ctx, el, r, T, o) {
    const temp = V.ledTemps[el.ledTemp] || V.ledTemps[3000];
    ctx.save();
    ctx.shadowColor = U.rgba(temp.color, 0.95);
    ctx.shadowBlur = U.clamp(28 * T.s, 10, 140) * o.dpr;
    ctx.fillStyle = U.rgba(temp.color, 0.9);
    const pad = Math.min(4 * T.s, r.w * 0.05);
    for (let i = 0; i < 2; i++) ctx.fillRect(r.x + pad, r.y + pad, r.w - pad * 2, r.h - pad * 2);
    ctx.restore();
  }
  function drawUnderglow(ctx, el, r, T) {
    const temp = V.ledTemps[el.ledTemp] || V.ledTemps[3000];
    const depth = Math.min(55 * T.s, T.y(0) - (r.y + r.h));
    if (depth <= 1) return;
    const top = r.y + r.h;
    ctx.save();
    const g = ctx.createLinearGradient(0, top, 0, top + depth);
    g.addColorStop(0, U.rgba(temp.color, 0.6));
    g.addColorStop(1, U.rgba(temp.color, 0));
    ctx.fillStyle = g;
    const spread = Math.min(18 * T.s, r.w * 0.15);
    ctx.beginPath();
    ctx.moveTo(r.x + spread * 0.3, top);
    ctx.lineTo(r.x + r.w - spread * 0.3, top);
    ctx.lineTo(r.x + r.w + spread, top + depth);
    ctx.lineTo(r.x - spread, top + depth);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = U.rgba('#fff4e0', 0.9);
    ctx.fillRect(r.x + spread * 0.3, top - 0.5, r.w - spread * 0.6, Math.max(1, 0.4 * T.s));
    ctx.restore();
  }

  /* ---------- element labels & annotations ---------- */
  function drawLabel(ctx, el, r, o) {
    const k = o.uiScale;
    if (r.w < 54 * k || r.h < 16 * k) return;
    const text = el.label;
    ctx.save();
    ctx.font = `600 ${10.5 * k}px Inter, sans-serif`;
    let t = text;
    while (ctx.measureText(t).width > r.w - 14 * k && t.length > 3) t = t.slice(0, -2);
    if (t !== text) t = t.slice(0, -1) + '…';
    const tw = ctx.measureText(t).width;
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
    ctx.fillStyle = 'rgba(10,12,16,0.82)';
    roundRect(ctx, cx - tw / 2 - 6 * k, cy - 8 * k, tw + 12 * k, 16 * k, 8 * k);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(t, cx, cy + 0.5 * k);
    ctx.restore();
  }

  function drawAnnotations(ctx, state, T, o) {
    const k = o.uiScale;
    const isExport = o.theme === 'export';
    const markerBg = isExport ? '#ffffff' : 'rgba(11, 15, 23, 0.94)';
    const markerBorder = isExport ? 'rgba(30, 41, 59, 0.65)' : 'rgba(56, 189, 248, 0.7)';
    const markerText = isExport ? '#0f172a' : '#ffffff';

    for (const el of state.elements) {
      const r = T.rect(el);
      // Width dimension line (above element)
      if (r.w > 26 * k) {
        dimLine(ctx, r.x, r.y - 10 * k, r.x + r.w, r.y - 10 * k, `${fmt(el.width)} cm`, o);
      }
      // Height dimension line (to right of element)
      if (r.h > 26 * k) {
        dimLine(ctx, r.x + r.w + 10 * k, r.y + r.h, r.x + r.w + 10 * k, r.y, `${fmt(el.height)} cm`, o);
      }

      // AFF elevation marker at bottom-left
      ctx.save();
      const affText = `+${fmt(el.y)} cm AFF`;
      ctx.font = `700 ${9 * k}px 'JetBrains Mono', monospace`;
      const atw = ctx.measureText(affText).width;
      const tri = 4 * k;
      const bx = r.x;
      const by = r.y + r.h;

      // Small high-contrast pill for AFF marker
      ctx.fillStyle = markerBg;
      roundRect(ctx, bx - 2 * k, by + 3 * k, atw + 16 * k, 16 * k, 4 * k);
      ctx.fill();
      ctx.strokeStyle = markerBorder;
      ctx.lineWidth = 1 * k;
      ctx.stroke();

      // Elevation triangle indicator
      ctx.fillStyle = isExport ? '#0f172a' : '#38bdf8';
      ctx.beginPath();
      ctx.moveTo(bx + 3 * k, by + 6 * k);
      ctx.lineTo(bx + 3 * k + tri, by + 6 * k + tri * 1.2);
      ctx.lineTo(bx + 3 * k, by + 6 * k + tri * 1.2);
      ctx.closePath();
      ctx.fill();

      // AFF Text in pure high-contrast white (or dark on export)
      ctx.fillStyle = markerText;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(affText, bx + 5 * k + tri, by + 11 * k);
      ctx.restore();
    }
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* ---------- selection, HUD, guides, marquee ---------- */
  function drawSelection(ctx, state, T, o) {
    const sel = state.elements.filter((e) => o.selection.includes(e.id));
    if (!sel.length) return;
    ctx.save();
    ctx.strokeStyle = SEL;
    ctx.lineWidth = 1.5;
    for (const el of sel) {
      const r = T.rect(el);
      ctx.strokeRect(r.x - 0.75, r.y - 0.75, r.w + 1.5, r.h + 1.5);
    }
    let hudText, anchor;
    if (sel.length === 1) {
      const el = sel[0];
      const r = T.rect(el);
      for (const hnd of handleRects(r)) {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(hnd.x, hnd.y, hnd.w, hnd.h);
        ctx.strokeStyle = SEL;
        ctx.lineWidth = 1.5;
        ctx.strokeRect(hnd.x + 0.5, hnd.y + 0.5, hnd.w - 1, hnd.h - 1);
      }
      hudText = `${el.label}  ·  ${fmt(el.width)} × ${fmt(el.height)} cm  ·  X ${fmt(el.x)}  ·  Y ${fmt(el.y)} AFF`;
      anchor = r;
    } else {
      const minX = Math.min(...sel.map((e) => e.x)), minY = Math.min(...sel.map((e) => e.y));
      const maxX = Math.max(...sel.map((e) => e.x + e.width)), maxY = Math.max(...sel.map((e) => e.y + e.height));
      const r = { x: T.x(minX), y: T.y(maxY), w: (maxX - minX) * T.s, h: (maxY - minY) * T.s };
      ctx.setLineDash([5, 4]);
      ctx.strokeRect(r.x - 4, r.y - 4, r.w + 8, r.h + 8);
      ctx.setLineDash([]);
      hudText = `${sel.length} selected  ·  ${fmt(maxX - minX)} × ${fmt(maxY - minY)} cm  ·  X ${fmt(minX)}  ·  Y ${fmt(minY)} AFF`;
      anchor = r;
    }
    if (o.hud) {
      ctx.font = "600 11px Inter, sans-serif";
      const tw = ctx.measureText(hudText).width;
      let hx = anchor.x + anchor.w / 2 - tw / 2 - 10;
      let hy = anchor.y - 34;
      if (hy < 6) hy = anchor.y + anchor.h + 12;
      hx = U.clamp(hx, 6, o.width - tw - 26);
      ctx.fillStyle = 'rgba(12,15,20,0.92)';
      roundRect(ctx, hx, hy, tw + 20, 22, 11);
      ctx.fill();
      ctx.strokeStyle = 'rgba(80,200,230,0.5)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = '#e8f8fc';
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'left';
      ctx.fillText(hudText, hx + 10, hy + 11.5);
    }
    ctx.restore();
  }

  function drawGuides(ctx, state, T, o) {
    if (!o.guides || !o.guides.length) return;
    ctx.save();
    ctx.strokeStyle = 'rgba(255, 90, 160, 0.9)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    for (const g of o.guides) {
      if (g.axis === 'x') {
        const x = Math.round(T.x(g.value)) + 0.5;
        ctx.moveTo(x, T.y(state.wallHeight) - 12);
        ctx.lineTo(x, T.y(0) + 12);
      } else {
        const y = Math.round(T.y(g.value)) + 0.5;
        ctx.moveTo(T.x(0) - 12, y);
        ctx.lineTo(T.x(state.wallWidth) + 12, y);
      }
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawMarquee(ctx, m) {
    if (!m) return;
    ctx.save();
    ctx.fillStyle = 'rgba(80,200,230,0.08)';
    ctx.strokeStyle = SEL;
    ctx.setLineDash([4, 3]);
    ctx.lineWidth = 1;
    ctx.fillRect(m.x, m.y, m.w, m.h);
    ctx.strokeRect(m.x + 0.5, m.y + 0.5, m.w, m.h);
    ctx.restore();
  }

  /* ---------- Eye Level & Ergonomic TV Center Guide ---------- */
  function drawEyeLevelGuide(ctx, state, T, o) {
    const eyeCm = o.eyeLevelCm !== undefined ? o.eyeLevelCm : V.config.defaultEyeLevelCm;
    const bandCm = V.config.eyeComfortBandCm;
    const k = o.uiScale;

    const x0 = T.x(0) - 15 * k;
    const x1 = T.x(state.wallWidth) + 15 * k;
    const eyeY = T.y(eyeCm);
    const bandTopY = T.y(eyeCm + bandCm);
    const bandBottomY = T.y(eyeCm - bandCm);

    ctx.save();

    // 1. Ergonomic comfort band wash (±10cm)
    ctx.fillStyle = o.theme === 'export' ? 'rgba(234, 179, 8, 0.08)' : 'rgba(234, 179, 8, 0.07)';
    ctx.fillRect(T.x(0), bandTopY, state.wallWidth * T.s, bandBottomY - bandTopY);

    // Band boundary dashed lines
    ctx.strokeStyle = o.theme === 'export' ? 'rgba(200, 150, 20, 0.35)' : 'rgba(234, 179, 8, 0.25)';
    ctx.lineWidth = 1 * k;
    ctx.setLineDash([3 * k, 3 * k]);
    ctx.beginPath();
    ctx.moveTo(T.x(0), bandTopY);
    ctx.lineTo(T.x(state.wallWidth), bandTopY);
    ctx.moveTo(T.x(0), bandBottomY);
    ctx.lineTo(T.x(state.wallWidth), bandBottomY);
    ctx.stroke();

    // 2. Main eye-level datum line
    ctx.strokeStyle = o.theme === 'export' ? 'rgba(180, 120, 10, 0.9)' : 'rgba(234, 179, 8, 0.85)';
    ctx.lineWidth = 1.5 * k;
    ctx.setLineDash([10 * k, 3 * k, 2 * k, 3 * k]); // Architectural centerline / datum dash
    ctx.beginPath();
    ctx.moveTo(x0, eyeY);
    ctx.lineTo(x1, eyeY);
    ctx.stroke();

    // 3. Eye Level Badge Callout on Left
    ctx.setLineDash([]);
    const badgeText = `👁 Seated Eye Level · ${eyeCm} cm AFF (Ideal TV Center)`;
    ctx.font = `600 ${10 * k}px Inter, sans-serif`;
    const tw = ctx.measureText(badgeText).width;
    const bx = T.x(0) + 12 * k;
    const by = eyeY - 11 * k;

    ctx.fillStyle = o.theme === 'export' ? 'rgba(245, 245, 240, 0.95)' : 'rgba(18, 16, 12, 0.92)';
    roundRect(ctx, bx - 6 * k, by - 8 * k, tw + 12 * k, 18 * k, 9 * k);
    ctx.fill();

    ctx.strokeStyle = o.theme === 'export' ? 'rgba(200, 150, 20, 0.8)' : 'rgba(234, 179, 8, 0.7)';
    ctx.lineWidth = 1 * k;
    ctx.stroke();

    ctx.fillStyle = o.theme === 'export' ? '#854d0e' : '#fef08a';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(badgeText, bx, by + 1 * k);

    // 4. TV Center Alignment Markers & Delta Brackets
    const tvs = state.elements.filter((e) => e.type === 'tv' || e.label.toLowerCase().includes('tv'));
    for (const tv of tvs) {
      const tvCenterCm = tv.y + tv.height / 2;
      const tvCenterY = T.y(tvCenterCm);
      const tvX1 = T.x(tv.x);
      const tvX2 = T.x(tv.x + tv.width);
      const tvMidX = (tvX1 + tvX2) / 2;
      const deltaCm = tvCenterCm - eyeCm;

      // Draw dashed horizontal TV midpoint line through the screen
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.lineWidth = 1 * k;
      ctx.setLineDash([4 * k, 3 * k]);
      ctx.beginPath();
      ctx.moveTo(tvX1, tvCenterY);
      ctx.lineTo(tvX2, tvCenterY);
      ctx.stroke();

      // Draw vertical alignment connector between TV center and eye level
      ctx.setLineDash([]);
      if (Math.abs(deltaCm) > 0.5) {
        ctx.strokeStyle = deltaCm > 0 ? 'rgba(234, 179, 8, 0.85)' : 'rgba(56, 189, 248, 0.85)';
        ctx.lineWidth = 1.2 * k;
        ctx.beginPath();
        ctx.moveTo(tvMidX, eyeY);
        ctx.lineTo(tvMidX, tvCenterY);
        ctx.stroke();
      }

      // Delta Pill Tag
      let statusText, statusBg, statusColor;
      if (Math.abs(deltaCm) <= 1.5) {
        statusText = `✓ TV Center Aligned (${fmt(tvCenterCm)} cm AFF)`;
        statusBg = 'rgba(20, 83, 45, 0.92)';
        statusColor = '#86efac';
      } else if (deltaCm > 0) {
        statusText = `TV Center ${fmt(tvCenterCm)} cm (+${fmt(deltaCm)} cm above eye level)`;
        statusBg = deltaCm > 25 ? 'rgba(120, 53, 15, 0.92)' : 'rgba(30, 27, 22, 0.92)';
        statusColor = '#fde047';
      } else {
        statusText = `TV Center ${fmt(tvCenterCm)} cm (${fmt(deltaCm)} cm below eye level)`;
        statusBg = 'rgba(12, 74, 110, 0.92)';
        statusColor = '#7dd3fc';
      }

      ctx.font = `600 ${9.5 * k}px Inter, sans-serif`;
      const sw = ctx.measureText(statusText).width;
      const tagY = tvCenterY < eyeY ? (tvCenterY + eyeY) / 2 : (tvCenterY + eyeY) / 2;
      const tagBoxY = tagY - 8 * k;

      ctx.fillStyle = statusBg;
      roundRect(ctx, tvMidX - sw / 2 - 6 * k, tagBoxY, sw + 12 * k, 17 * k, 8.5 * k);
      ctx.fill();

      ctx.strokeStyle = statusColor;
      ctx.lineWidth = 1 * k;
      ctx.stroke();

      ctx.fillStyle = statusColor;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(statusText, tvMidX, tagBoxY + 8.5 * k);
    }

    ctx.restore();
  }

  /* ---------- public ---------- */
  function drawScene(ctx, state, opts) {
    const o = Object.assign(
      { time: 0, grid: true, annotations: false, eyeLevel: false, eyeLevelCm: V.config.defaultEyeLevelCm, labels: true, rulers: true, selection: [], hud: true, guides: [], marquee: null, theme: 'screen', uiScale: 1, dpr: 1, background: null, photo: true, ghost: false },
      opts
    );
    const T = makeTransform(o.pxPerCm, o.originX, o.originY);
    if (o.background && o.background !== 'transparent') {
      ctx.fillStyle = o.background;
      ctx.fillRect(0, 0, o.width, o.height);
    }
    drawWall(ctx, state, T, o);
    if (o.grid) drawGrid(ctx, state, T, o);
    drawFloor(ctx, state, T, o);
    if (o.rulers) drawRulers(ctx, state, T, o);

    const textureOpts = { pxPerCm: T.s, time: o.time, mood: state.mood };
    // Ghost mode: see outlets/switches in the photo behind the millwork. Textures multiply globalAlpha.
    ctx.save();
    if (o.ghost) ctx.globalAlpha = 0.4;
    for (const el of state.elements) {
      const r = T.rect(el);
      if (el.ledHalo) drawHalo(ctx, el, r, T, o);
      A.textures.draw(ctx, el, r, textureOpts);
      ctx.save();
      ctx.strokeStyle = U.rgba(U.shade(el.color, -0.6), 0.55);
      ctx.lineWidth = 1;
      ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
      ctx.restore();
      if (el.ledUnderglow) drawUnderglow(ctx, el, r, T);
    }
    ctx.restore();
    if (o.ghost) {
      // Keep footprints readable while translucent.
      ctx.save();
      ctx.setLineDash([5, 4]);
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.9)';
      ctx.lineWidth = 1.25;
      for (const el of state.elements) {
        const r = T.rect(el);
        ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
      }
      ctx.restore();
    }
    if (o.labels) for (const el of state.elements) drawLabel(ctx, el, T.rect(el), o);
    if (o.annotations) drawAnnotations(ctx, state, T, o);
    if (o.eyeLevel) drawEyeLevelGuide(ctx, state, T, o);
    drawGuides(ctx, state, T, o);
    if (o.selection.length) drawSelection(ctx, state, T, o);
    drawMarquee(ctx, o.marquee);
  }

  A.render = {
    makeTransform,
    handleRects,
    drawScene,
    dimLine,
    roundRect,
    needsAnimation: (state) => state.elements.some((e) => A.textures.animated(e)),
  };
})();
</script>
<script>
/* === src/export.js === */
/* Arch2D — WS3: PNG exporter & comparison sheet generator (project.md §3.1, §4.4, §6).
   Renders offscreen onto pure Canvas 2D (no SVG, no external images) so toDataURL()
   is guaranteed safe against CORS taint. */
(function () {
  'use strict';
  const A = window.Arch2D;
  const U = A.util;

  function renderCanvas(opts = {}) {
    const state = A.store.getState();
    const widthPx = Math.max(600, opts.widthPx || 2400);

    // Measurements master toggle & individual overrides
    const hasMeasurements = opts.measurements !== undefined ? !!opts.measurements : (opts.annotations !== false);
    const hasAnnotations = opts.annotations !== undefined ? !!opts.annotations : hasMeasurements;
    const hasRulers = opts.rulers !== undefined ? !!opts.rulers : hasMeasurements;
    const hasLabels = opts.labels !== undefined ? !!opts.labels : hasMeasurements;

    // Background type: 'white' | 'transparent' | 'dark'
    let bg = opts.background;
    if (opts.bgType === 'transparent' || bg === 'transparent' || bg === null) {
      bg = null;
    } else if (opts.bgType === 'dark') {
      bg = '#0b0d11';
    } else if (opts.bgType === 'white') {
      bg = '#ffffff';
    } else if (bg === undefined) {
      bg = '#ffffff';
    }

    // Photo toggle
    const hasPhoto = opts.photo !== undefined ? !!opts.photo : (state.wallPhoto ? state.wallPhoto.showOnExport : false);

    // Allocate padding for rulers, annotations, and floor baseline
    const padTop = Math.round(widthPx * 0.05);
    const padBottom = (hasRulers || (opts.floor !== false)) ? Math.round(widthPx * 0.09) : Math.round(widthPx * 0.05);
    const padLeft = hasRulers ? Math.round(widthPx * 0.07) : Math.round(widthPx * 0.04);
    const padRight = hasRulers ? Math.round(widthPx * 0.07) : Math.round(widthPx * 0.04);

    let minCmX = 0, maxCmX = state.wallWidth;
    let minCmY = 0, maxCmY = state.wallHeight;

    if (hasPhoto && state.wallPhoto && A.photo) {
      const b = (state.wallPhoto && state.wallPhoto.bounds) || A.photo.bounds(state.wallPhoto.id);
      if (b && b.wCm && b.hCm) {
        minCmX = Math.min(0, b.xCm);
        maxCmX = Math.max(state.wallWidth, b.xCm + b.wCm);
        minCmY = Math.min(0, b.yCm);
        maxCmY = Math.max(state.wallHeight, b.yCm + b.hCm);
      }
    }

    const totalCmW = Math.max(10, maxCmX - minCmX);
    const totalCmH = Math.max(10, maxCmY - minCmY);

    const wallDrawWidth = widthPx - padLeft - padRight;
    const pxPerCm = wallDrawWidth / totalCmW;
    const wallDrawHeight = totalCmH * pxPerCm;
    const heightPx = Math.round(padTop + wallDrawHeight + padBottom);

    const canvas = document.createElement('canvas');
    canvas.width = widthPx;
    canvas.height = heightPx;
    const ctx = canvas.getContext('2d');

    // UI scale relative to standard 800px viewport
    const uiScale = Math.max(1, widthPx / 1000);
    const originX = padLeft - minCmX * pxPerCm;
    const originY = padTop + maxCmY * pxPerCm;

    A.render.drawScene(ctx, state, {
      pxPerCm,
      originX,
      originY,
      width: widthPx,
      height: heightPx,
      grid: !!opts.grid,
      annotations: hasAnnotations,
      eyeLevel: opts.eyeLevel !== undefined ? !!opts.eyeLevel : false,
      eyeLevelCm: A.canvas ? A.canvas.getEyeLevelCm() : 105,
      labels: hasLabels,
      rulers: hasRulers,
      selection: [],
      hud: false,
      guides: [],
      marquee: null,
      theme: 'export',
      uiScale,
      dpr: 1,
      background: bg,
      photo: hasPhoto,
      wall: opts.wall !== undefined ? !!opts.wall : true,
      floor: opts.floor !== undefined ? !!opts.floor : true,
    });

    return canvas;
  }

  function downloadPNG(opts = {}) {
    const canvas = renderCanvas(opts);
    const state = A.store.getState();
    const name = (state.name || 'elevation')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-|-$/g, '') || 'elevation';
    const tag = (opts.measurements === false || opts.annotations === false) ? 'clean' : 'cad';
    const bgTag = (opts.bgType === 'transparent' || opts.background === null) ? '-transparent' : '';
    const filename = `${name}-${tag}${bgTag}-${canvas.width}x${canvas.height}.png`;

    canvas.toBlob((blob) => {
      if (blob) {
        U.downloadBlob(blob, filename);
        if (A.ui) A.ui.toast(`Downloaded ${filename}`, 'success');
      }
    }, 'image/png');
  }

  function downloadReferencePNG(opts = {}) {
    // Clean elevation export for AI image-to-image / Gemini / ControlNet: no CAD lines, no rulers
    downloadPNG({
      widthPx: opts.widthPx || 2400,
      measurements: false,
      annotations: false,
      labels: false,
      rulers: false,
      grid: false,
      background: opts.background || '#ffffff',
    });
  }

  function referenceDataUrl(opts = {}) {
    // Generate clean reference image for AI image-to-image / ControlNet: no annotations, no rulers
    const canvas = renderCanvas({
      widthPx: opts.widthPx || 1536,
      measurements: false,
      annotations: false,
      labels: false,
      rulers: false,
      grid: false,
      background: opts.background || '#ffffff',
    });
    return canvas.toDataURL('image/png');
  }

  async function copyToClipboard(opts = {}) {
    try {
      const canvas = renderCanvas(opts);
      canvas.toBlob(async (blob) => {
        if (!blob) throw new Error('Blob creation failed');
        if (navigator.clipboard && navigator.clipboard.write) {
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
          if (A.ui) A.ui.toast('📋 Elevation copied to clipboard!', 'success');
        } else {
          if (A.ui) A.ui.toast('Clipboard API not supported in this browser.', 'error');
        }
      }, 'image/png');
    } catch (err) {
      console.error('[Arch2D] copy failed', err);
      if (A.ui) A.ui.toast('Could not copy image to clipboard.', 'error');
    }
  }

  /** Interactive Export Dialog with live preview, background choices, and measurement toggles. */
  function openModal() {
    const state = A.store.getState();
    const hasPhoto = !!(state.wallPhoto && A.photo && A.photo.has(state.wallPhoto.id));

    let opts = {
      measurements: true,
      annotations: true,
      rulers: true,
      labels: true,
      bgType: 'white',
      wall: true,
      photo: hasPhoto,
      floor: true,
      grid: false,
      eyeLevel: false,
      widthPx: 2400,
    };

    // Live preview elements
    const prevCanvas = U.h('canvas', { class: 'export-preview-canvas' });
    const checker = U.h('div', { class: 'export-checkerboard' }, prevCanvas);
    const dimPill = U.h('div', { class: 'export-dim-pill' }, 'Loading preview…');
    const previewPane = U.h('div', { class: 'export-preview-pane' }, checker, dimPill);

    // Form inputs
    const chkMeas = U.h('input', { type: 'checkbox', checked: opts.measurements });
    const chkAnnot = U.h('input', { type: 'checkbox', checked: opts.annotations });
    const chkRulers = U.h('input', { type: 'checkbox', checked: opts.rulers });
    const chkLabels = U.h('input', { type: 'checkbox', checked: opts.labels });

    const radWhite = U.h('input', { type: 'radio', name: 'export-bg', value: 'white', checked: true });
    const radTrans = U.h('input', { type: 'radio', name: 'export-bg', value: 'transparent' });
    const radDark = U.h('input', { type: 'radio', name: 'export-bg', value: 'dark' });

    const chkWall = U.h('input', { type: 'checkbox', checked: opts.wall });
    const chkPhoto = hasPhoto ? U.h('input', { type: 'checkbox', checked: opts.photo }) : null;
    const chkFloor = U.h('input', { type: 'checkbox', checked: opts.floor });
    const chkGrid = U.h('input', { type: 'checkbox', checked: opts.grid });
    const chkEye = U.h('input', { type: 'checkbox', checked: opts.eyeLevel });

    const selRes = U.h(
      'select',
      { class: 'select', style: { width: '100%' } },
      U.h('option', { value: '1600' }, '1600 px (Fast / Web)'),
      U.h('option', { value: '2400', selected: true }, '2400 px (Standard Print / Recommended)'),
      U.h('option', { value: '3840' }, '3840 px (4K Ultra-Res)')
    );

    function syncInputs() {
      chkMeas.checked = opts.measurements;
      chkAnnot.checked = opts.annotations;
      chkRulers.checked = opts.rulers;
      chkLabels.checked = opts.labels;

      radWhite.checked = opts.bgType === 'white';
      radTrans.checked = opts.bgType === 'transparent';
      radDark.checked = opts.bgType === 'dark';

      chkWall.checked = opts.wall;
      if (chkPhoto) chkPhoto.checked = opts.photo;
      chkFloor.checked = opts.floor;
      chkGrid.checked = opts.grid;
      chkEye.checked = opts.eyeLevel;

      selRes.value = String(opts.widthPx);
      renderPreview();
    }

    function renderPreview() {
      const previewOptions = Object.assign({}, opts, { widthPx: 800 });
      const c = renderCanvas(previewOptions);
      prevCanvas.width = c.width;
      prevCanvas.height = c.height;
      const ctx = prevCanvas.getContext('2d');
      ctx.drawImage(c, 0, 0);

      const fullW = opts.widthPx;
      const aspect = c.width / c.height;
      const fullH = Math.round(fullW / aspect);
      const photoLabel = (opts.photo && hasPhoto) ? 'w/ Background Photo' : 'w/o Background Photo';
      const measLabel = opts.measurements ? 'w/ Measurements' : 'w/o Measurements';
      const bgLabel = opts.bgType === 'transparent' ? 'Transparent' : (opts.bgType === 'white' ? 'White' : 'Dark');
      dimPill.textContent = `${fullW} × ${fullH} px • ${photoLabel} • ${measLabel} • ${bgLabel}`;
    }

    function applyPreset(name) {
      if (name === 'blueprint') {
        opts.measurements = true;
        opts.annotations = true;
        opts.rulers = true;
        opts.labels = true;
        opts.bgType = 'white';
        opts.wall = true;
        opts.photo = false;
        opts.floor = true;
        opts.grid = false;
      } else if (name === 'clean') {
        opts.measurements = false;
        opts.annotations = false;
        opts.rulers = false;
        opts.labels = false;
        opts.bgType = 'white';
        opts.wall = true;
        opts.photo = false;
        opts.floor = true;
        opts.grid = false;
      } else if (name === 'room') {
        opts.measurements = false;
        opts.annotations = false;
        opts.rulers = false;
        opts.labels = false;
        opts.bgType = 'white';
        opts.wall = true;
        opts.photo = true;
        opts.floor = true;
        opts.grid = false;
      } else if (name === 'cutout') {
        opts.measurements = false;
        opts.annotations = false;
        opts.rulers = false;
        opts.labels = false;
        opts.bgType = 'transparent';
        opts.wall = false;
        opts.photo = false;
        opts.floor = false;
        opts.grid = false;
      }
      syncInputs();
    }

    // Input event listeners
    chkMeas.onchange = () => {
      opts.measurements = chkMeas.checked;
      opts.annotations = opts.measurements;
      opts.rulers = opts.measurements;
      opts.labels = opts.measurements;
      syncInputs();
    };
    chkAnnot.onchange = () => { opts.annotations = chkAnnot.checked; renderPreview(); };
    chkRulers.onchange = () => { opts.rulers = chkRulers.checked; renderPreview(); };
    chkLabels.onchange = () => { opts.labels = chkLabels.checked; renderPreview(); };

    radWhite.onchange = () => { if (radWhite.checked) { opts.bgType = 'white'; renderPreview(); } };
    radTrans.onchange = () => { if (radTrans.checked) { opts.bgType = 'transparent'; renderPreview(); } };
    radDark.onchange = () => { if (radDark.checked) { opts.bgType = 'dark'; renderPreview(); } };

    chkWall.onchange = () => { opts.wall = chkWall.checked; renderPreview(); };
    if (chkPhoto) chkPhoto.onchange = () => { opts.photo = chkPhoto.checked; renderPreview(); };
    chkFloor.onchange = () => { opts.floor = chkFloor.checked; renderPreview(); };
    chkGrid.onchange = () => { opts.grid = chkGrid.checked; renderPreview(); };
    chkEye.onchange = () => { opts.eyeLevel = chkEye.checked; renderPreview(); };
    selRes.onchange = () => { opts.widthPx = parseInt(selRes.value) || 2400; renderPreview(); };

    // Preset buttons
    const btnPreClean = U.h('button', { class: 'btn sm ghost', onclick: () => applyPreset('clean') }, '🖼️ Clean (No Dims)');
    const btnPreCad = U.h('button', { class: 'btn sm ghost', onclick: () => applyPreset('blueprint') }, '📐 CAD (With Dims)');
    const presetsGrid = U.h('div', { class: 'export-presets-grid' }, btnPreClean, btnPreCad);
    if (hasPhoto) {
      const btnPreRoom = U.h('button', { class: 'btn sm ghost', onclick: () => applyPreset('room') }, '📸 Room Photo');
      presetsGrid.appendChild(btnPreRoom);
    }
    const btnPreCutout = U.h('button', { class: 'btn sm ghost', onclick: () => applyPreset('cutout') }, '✨ Transparent');
    presetsGrid.appendChild(btnPreCutout);

    // Option groups
    const grpMeas = U.h(
      'div',
      { class: 'export-opt-group' },
      U.h('div', { class: 'export-opt-title' }, 'Measurements'),
      U.h('label', { class: 'export-check-label', style: { fontWeight: '600' } }, chkMeas, 'Include Measurements'),
      U.h('div', { style: { display: 'flex', flexDirection: 'column', gap: '4px', paddingLeft: '22px' } },
        U.h('label', { class: 'export-check-label' }, chkAnnot, 'Dimension Callouts'),
        U.h('label', { class: 'export-check-label' }, chkRulers, 'Axis Rulers (Top & Left)'),
        U.h('label', { class: 'export-check-label' }, chkLabels, 'Element Labels')
      )
    );

    const bgOptions = [
      U.h('label', { class: 'export-check-label' }, radWhite, '⚪ White'),
      U.h('label', { class: 'export-check-label' }, radTrans, '🏁 Transparent'),
      U.h('label', { class: 'export-check-label' }, radDark, '⬛ Dark'),
    ];
    const grpBg = U.h(
      'div',
      { class: 'export-opt-group' },
      U.h('div', { class: 'export-opt-title' }, 'Background Photo & Layers'),
      chkPhoto
        ? U.h('label', { class: 'export-check-label', style: { fontWeight: '600' } }, chkPhoto, '📷 Include Background Photo')
        : U.h('div', { style: { fontSize: 'var(--fs-xs)', color: 'var(--text-2)' } }, 'No background photo loaded'),
      U.h('div', { style: { display: 'flex', gap: '12px', flexWrap: 'wrap', marginTop: '4px' } }, ...bgOptions),
      U.h('label', { class: 'export-check-label' }, chkWall, 'Include Wall Surface Texture'),
      U.h('label', { class: 'export-check-label' }, chkFloor, 'Include Floor Baseline (FFL ±0)')
    );

    const grpGuides = U.h(
      'div',
      { class: 'export-opt-group' },
      U.h('div', { class: 'export-opt-title' }, 'Guides & Resolution'),
      U.h('div', { style: { display: 'flex', gap: '12px', flexWrap: 'wrap' } },
        U.h('label', { class: 'export-check-label' }, chkGrid, 'Grid Lines'),
        U.h('label', { class: 'export-check-label' }, chkEye, 'TV Eye Level Datum')
      ),
      U.h('div', { style: { marginTop: '4px' } }, selRes)
    );

    const btnDownload = U.h(
      'button',
      {
        class: 'btn primary',
        style: { width: '100%', justifyContent: 'center' },
        onclick: () => {
          downloadPNG(opts);
          close();
        },
      },
      '⬇️ Download PNG'
    );

    const btnCopy = U.h(
      'button',
      {
        class: 'btn secondary',
        style: { width: '100%', justifyContent: 'center' },
        onclick: () => copyToClipboard(opts),
      },
      '📋 Copy to Clipboard'
    );

    const btnCancel = U.h(
      'button',
      { class: 'btn ghost sm', style: { width: '100%', justifyContent: 'center' }, onclick: () => close() },
      'Close'
    );

    const btnBar = U.h('div', { class: 'export-btn-bar' }, btnDownload, btnCopy, btnCancel);

    const side = U.h(
      'div',
      { class: 'export-side' },
      U.h('div', { class: 'section-heading' }, 'Export Presets'),
      presetsGrid,
      grpMeas,
      grpBg,
      grpGuides,
      btnBar
    );

    const modal = U.h(
      'div',
      { class: 'studio-modal export-modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Export Elevation Drawing' },
      U.h(
        'div',
        { class: 'studio-header' },
        U.h('div', { class: 'studio-title' }, U.h('span', null, '📐'), U.h('span', null, 'Export Elevation Drawing')),
        U.h('button', { class: 'icon-btn', title: 'Close (Esc)', onclick: () => close() }, '✕')
      ),
      U.h('div', { class: 'export-body' }, previewPane, side)
    );

    const backdrop = U.h('div', { class: 'modal-backdrop open', id: 'export-backdrop' }, modal);
    document.body.appendChild(backdrop);

    function onKey(e) {
      if (e.key === 'Escape') {
        e.preventDefault();
        close();
      }
    }
    document.addEventListener('keydown', onKey);

    function close() {
      document.removeEventListener('keydown', onKey);
      backdrop.remove();
    }

    renderPreview();
  }

  /** Generates side-by-side comparison sheet of CAD elevation vs AI render. */
  function comparisonSheet(renderImg) {
    return new Promise((resolve, reject) => {
      try {
        const cadCanvas = renderCanvas({ widthPx: 1600, annotations: true, rulers: true, grid: true });
        const sheetWidth = 3200;
        const targetHalfW = 1520;
        const pad = 40;
        const headerH = 100;

        // Calculate heights maintaining aspect ratios
        const cadAspect = cadCanvas.width / cadCanvas.height;
        const cadH = targetHalfW / cadAspect;

        const imgW = renderImg.naturalWidth || renderImg.width || targetHalfW;
        const imgH = renderImg.naturalHeight || renderImg.height || cadH;
        const imgAspect = imgW / imgH;
        const renderDrawH = targetHalfW / imgAspect;

        const contentH = Math.max(cadH, renderDrawH);
        const sheetHeight = Math.round(headerH + contentH + pad * 2);

        const sheet = document.createElement('canvas');
        sheet.width = sheetWidth;
        sheet.height = sheetHeight;
        const ctx = sheet.getContext('2d');

        // Background
        ctx.fillStyle = '#0f1217';
        ctx.fillRect(0, 0, sheetWidth, sheetHeight);

        // Header Title
        ctx.fillStyle = '#ffffff';
        ctx.font = '700 36px Inter, sans-serif';
        ctx.fillText('Arch2D Elevation Architect — CAD vs AI 3D Render', pad, 58);

        const state = A.store.getState();
        ctx.fillStyle = '#8a909c';
        ctx.font = '500 22px Inter, sans-serif';
        ctx.fillText(`Project: ${state.name} (${state.wallWidth}×${state.wallHeight} cm) · Mood: ${state.mood}`, pad, 92);

        // Draw Left: CAD
        const leftX = pad;
        const leftY = headerH + pad;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(leftX, leftY, targetHalfW, cadH);
        ctx.drawImage(cadCanvas, leftX, leftY, targetHalfW, cadH);

        // CAD label overlay
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(leftX + 20, leftY + 20, 220, 44);
        ctx.fillStyle = '#38bdf8';
        ctx.font = '600 20px Inter, sans-serif';
        ctx.fillText('2D CAD ELEVATION', leftX + 35, leftY + 49);

        // Draw Right: AI Render
        const rightX = pad + targetHalfW + pad;
        const rightY = headerH + pad;
        ctx.drawImage(renderImg, rightX, rightY, targetHalfW, renderDrawH);

        // Render label overlay
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(rightX + 20, rightY + 20, 220, 44);
        ctx.fillStyle = '#eab308';
        ctx.font = '600 20px Inter, sans-serif';
        ctx.fillText('AI 3D RENDER', rightX + 35, rightY + 49);

        resolve(sheet);
      } catch (err) {
        reject(err);
      }
    });
  }

  A.exporter = {
    renderCanvas,
    downloadPNG,
    downloadReferencePNG,
    referenceDataUrl,
    copyToClipboard,
    openModal,
    comparisonSheet,
  };
})();
</script>
<script>
/* === src/canvas.js === */
/* Arch2D — WS2: interactive canvas engine & pointer manipulation (project.md §3.3, §3.6).
   Handles Pointer Events API (mouse, touch, stylus), pinch-to-zoom, panning,
   drag/resize with 8 handles, magnetic grid/edge snapping, guides, marquee multi-select. */
(function () {
  'use strict';
  const A = window.Arch2D;
  const U = A.util;
  const V = A.vocab;

  let host, canvas, ctx;
  let animId = null;
  let redrawRequested = false;

  // Viewport / transform state
  let width = 800, height = 600, dpr = 1;
  let baseScale = 1; // px per cm to fit wall
  let zoom = 1;
  let panX = 0, panY = 0; // translation offset in px
  let annotations = false;
  let snapping = true;
  let eyeLevel = true; // Seated spectator eye level & ideal TV vertical center
  let eyeLevelCm = V.config.defaultEyeLevelCm || 105;
  let ghost = false; // draw elements translucent to see the wall photo behind them

  // Active pointers map for multitouch / pinch zoom
  const activePointers = new Map();
  let initialPinchDist = null;
  let initialPinchZoom = 1;

  // Interaction mode state
  let dragMode = null; // 'pan' | 'move' | 'resize' | 'marquee'
  let dragStart = null; // { x, y, cmX, cmY, elementsSnapshot, handle, marqueeStart }
  let activeGuides = []; // [{ axis: 'x'|'y', value: cm }]
  let currentMarquee = null; // { x, y, w, h }

  function getPxPerCm() {
    return baseScale * zoom;
  }

  function getTransform() {
    const s = getPxPerCm();
    const state = A.store.getState();
    let minCmX = 0, maxCmX = state.wallWidth;
    let minCmY = 0, maxCmY = state.wallHeight;

    if (state.wallPhoto && state.wallPhoto.visible && A.photo) {
      const b = (state.wallPhoto && state.wallPhoto.bounds) || A.photo.bounds(state.wallPhoto.id);
      if (b && b.wCm && b.hCm) {
        minCmX = Math.min(0, b.xCm);
        maxCmX = Math.max(state.wallWidth, b.xCm + b.wCm);
        minCmY = Math.min(0, b.yCm);
        maxCmY = Math.max(state.wallHeight, b.yCm + b.hCm);
      }
    }

    const ox = Math.round(width / 2 - ((minCmX + maxCmX) * s) / 2 + panX);
    const oy = Math.round(height / 2 + ((minCmY + maxCmY) * s) / 2 + panY);
    return A.render.makeTransform(s, ox, oy);
  }

  function resize() {
    if (!host || !canvas) return;
    const rect = host.getBoundingClientRect();
    width = Math.max(200, Math.floor(rect.width));
    height = Math.max(200, Math.floor(rect.height));
    dpr = window.devicePixelRatio || 1;

    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';

    ctx = canvas.getContext('2d');
    fitScale();
    requestRedraw();
  }

  function fitScale() {
    const state = A.store.getState();
    const padX = Math.max(80, width * 0.14);
    const padY = Math.max(90, height * 0.16);
    const availW = Math.max(100, width - padX * 2);
    const availH = Math.max(100, height - padY * 2);

    let contentW = state.wallWidth;
    let contentH = state.wallHeight;

    if (state.wallPhoto && state.wallPhoto.visible && A.photo) {
      const b = (state.wallPhoto && state.wallPhoto.bounds) || A.photo.bounds(state.wallPhoto.id);
      if (b && b.wCm && b.hCm) {
        const minCmX = Math.min(0, b.xCm);
        const maxCmX = Math.max(state.wallWidth, b.xCm + b.wCm);
        const minCmY = Math.min(0, b.yCm);
        const maxCmY = Math.max(state.wallHeight, b.yCm + b.hCm);
        contentW = maxCmX - minCmX;
        contentH = maxCmY - minCmY;
      } else {
        const ar = A.photo.aspect(state.wallPhoto.id);
        if (ar > 0) {
          const photoW = state.wallHeight * ar;
          contentW = Math.max(contentW, photoW);
        }
      }
    }

    baseScale = Math.min(availW / contentW, availH / contentH);
  }

  function fit() {
    zoom = 1;
    panX = 0;
    panY = 0;
    fitScale();
    requestRedraw();
    emitView();
  }

  function zoomBy(factor, clientX, clientY) {
    const prevZoom = zoom;
    const nextZoom = U.clamp(zoom * factor, 0.25, 6);
    if (Math.abs(prevZoom - nextZoom) < 0.001) return;

    if (clientX !== undefined && clientY !== undefined && host) {
      const rect = host.getBoundingClientRect();
      const mx = clientX - rect.left - width / 2 - panX;
      const my = clientY - rect.top - height / 2 - panY;
      const scaleRatio = nextZoom / prevZoom;
      panX -= mx * (scaleRatio - 1);
      panY -= my * (scaleRatio - 1);
    }
    zoom = nextZoom;
    requestRedraw();
    emitView();
  }

  function emitView() {
    A.bus.emit('view:changed', { pxPerCm: getPxPerCm(), zoom, originX: getTransform().x(0), originY: getTransform().y(0) });
  }

  /* ---------- Pointer coordinate helper ---------- */
  function getCanvasPoint(e) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const T = getTransform();
    return { x, y, cmX: T.cmX(x), cmY: T.cmY(y) };
  }

  /* ---------- Hit testing ---------- */
  function hitTest(x, y) {
    const state = A.store.getState();
    const selIds = A.store.getSelection();
    const T = getTransform();

    // 1. Check resize handles if single element selected
    if (selIds.length === 1) {
      const el = state.elements.find((e) => e.id === selIds[0]);
      if (el) {
        const r = T.rect(el);
        const handles = A.render.handleRects(r, 12);
        for (const h of handles) {
          if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) {
            return { type: 'handle', handle: h.key, element: el };
          }
        }
      }
    }

    // 2. Check elements in reverse z-index (front-to-back)
    for (let i = state.elements.length - 1; i >= 0; i--) {
      const el = state.elements[i];
      const r = T.rect(el);
      if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) {
        return { type: 'element', element: el };
      }
    }

    return { type: 'none' };
  }

  /* ---------- Snapping calculations ---------- */
  function calculateSnaps(el, proposedX, proposedY, state, excludeIds) {
    if (!snapping) return { x: proposedX, y: proposedY, guides: [] };

    const snapThresholdCm = V.config.snapPx / getPxPerCm();
    let bestX = proposedX;
    let bestDistX = snapThresholdCm;
    let guideX = null;

    let bestY = proposedY;
    let bestDistY = snapThresholdCm;
    let guideY = null;

    // A. Wall bounds snapping (X=0, X+width=wallWidth, Y=0, Y+height=wallHeight)
    const xTargets = [0, state.wallWidth - el.width, Math.round(state.wallWidth / 2 - el.width / 2)];
    for (const tx of xTargets) {
      const d = Math.abs(proposedX - tx);
      if (d < bestDistX) {
        bestDistX = d;
        bestX = tx;
        guideX = tx;
      }
    }

    // Floor line snap (Y=0) and ceiling snap
    const yTargets = [0, state.wallHeight - el.height];
    for (const ty of yTargets) {
      const d = Math.abs(proposedY - ty);
      if (d < bestDistY) {
        bestDistY = d;
        bestY = ty;
        guideY = ty;
      }
    }

    // Eye level ideal TV center snap (when el is a TV or eyeLevel guide is visible)
    if (eyeLevel || el.type === 'tv' || el.label.toLowerCase().includes('tv')) {
      const idealTvY = eyeLevelCm - el.height / 2;
      const dEye = Math.abs(proposedY - idealTvY);
      if (dEye < bestDistY) {
        bestDistY = dEye;
        bestY = idealTvY;
        guideY = eyeLevelCm;
      }
    }

    // B. Neighbor elements edge snapping
    const others = state.elements.filter((e) => !excludeIds.has(e.id));
    for (const o of others) {
      // X edges: left-to-left, left-to-right, right-to-left, right-to-right, centers
      const oxEdges = [
        { val: o.x, guide: o.x },
        { val: o.x + o.width, guide: o.x + o.width },
        { val: o.x - el.width, guide: o.x },
        { val: o.x + o.width - el.width, guide: o.x + o.width },
        { val: o.x + o.width / 2 - el.width / 2, guide: o.x + o.width / 2 },
      ];
      for (const edge of oxEdges) {
        const d = Math.abs(proposedX - edge.val);
        if (d < bestDistX) {
          bestDistX = d;
          bestX = edge.val;
          guideX = edge.guide;
        }
      }

      // Y edges: bottom-to-bottom, top-to-bottom, bottom-to-top, top-to-top
      const oyEdges = [
        { val: o.y, guide: o.y },
        { val: o.y + o.height, guide: o.y + o.height },
        { val: o.y - el.height, guide: o.y },
        { val: o.y + o.height - el.height, guide: o.y + o.height },
        { val: o.y + o.height / 2 - el.height / 2, guide: o.y + o.height / 2 },
      ];
      for (const edge of oyEdges) {
        const d = Math.abs(proposedY - edge.val);
        if (d < bestDistY) {
          bestDistY = d;
          bestY = edge.val;
          guideY = edge.guide;
        }
      }
    }

    // C. 5cm / 10cm Grid Snap fallback if no magnetic neighbor snap
    if (bestDistX === snapThresholdCm) {
      const snapGrid = 5;
      const nearest = Math.round(proposedX / snapGrid) * snapGrid;
      if (Math.abs(proposedX - nearest) < snapThresholdCm) {
        bestX = nearest;
      }
    }
    if (bestDistY === snapThresholdCm) {
      const snapGrid = 5;
      const nearest = Math.round(proposedY / snapGrid) * snapGrid;
      if (Math.abs(proposedY - nearest) < snapThresholdCm) {
        bestY = nearest;
      }
    }

    const guides = [];
    if (guideX !== null) guides.push({ axis: 'x', value: guideX });
    if (guideY !== null) guides.push({ axis: 'y', value: guideY });

    return { x: Math.round(bestX * 10) / 10, y: Math.round(bestY * 10) / 10, guides };
  }

  /* ---------- Pointer Event Handlers ---------- */
  function onPointerDown(e) {
    if (U.isTypingTarget(document.activeElement)) document.activeElement.blur();

    // Only respond to left button (0) or middle button (1)
    if (e.button !== 0 && e.button !== 1) return;

    try {
      if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
    } catch (_) {}

    // Multi-touch pinch-zoom setup (touch only, never mouse)
    if (e.pointerType === 'touch') {
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (activePointers.size === 2) {
        const pts = Array.from(activePointers.values());
        initialPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        initialPinchZoom = zoom;
        dragMode = 'pinch';
        return;
      }
    } else {
      activePointers.clear();
    }

    const pt = getCanvasPoint(e);
    const hit = hitTest(pt.x, pt.y);
    const sel = A.store.getSelection();

    // Middle click or Alt+click => pan
    if (e.button === 1 || (e.altKey && e.button === 0)) {
      dragMode = 'pan';
      dragStart = { x: pt.x, y: pt.y, panX, panY };
      canvas.style.cursor = 'grabbing';
      return;
    }

    if (hit.type === 'handle') {
      // Resize handle hit
      dragMode = 'resize';
      A.store.begin();
      dragStart = {
        handle: hit.handle,
        element: hit.element,
        startX: pt.cmX,
        startY: pt.cmY,
        origX: hit.element.x,
        origY: hit.element.y,
        origW: hit.element.width,
        origH: hit.element.height,
      };
      setCursorForHandle(hit.handle);
    } else if (hit.type === 'element') {
      // Element hit
      if (e.shiftKey) {
        A.store.select(hit.element.id, { toggle: true });
      } else if (!sel.includes(hit.element.id)) {
        A.store.select(hit.element.id);
      }

      const currentSelected = A.store.getSelectedElements();
      if (!currentSelected.length) {
        dragMode = null;
        dragStart = null;
        return;
      }

      dragMode = 'move';
      A.store.begin();
      dragStart = {
        startX: pt.cmX,
        startY: pt.cmY,
        snappedDeltaX: 0,
        snappedDeltaY: 0,
        elements: currentSelected.map((el) => ({ id: el.id, x: el.x, y: el.y, width: el.width, height: el.height })),
      };
      canvas.style.cursor = 'move';
    } else {
      // Clicked on empty canvas
      if (!e.shiftKey) {
        A.store.clearSelection();
      }
      dragMode = 'marquee';
      dragStart = { startX: pt.x, startY: pt.y };
      currentMarquee = { x: pt.x, y: pt.y, w: 0, h: 0 };
    }
  }

  function onPointerMove(e) {
    if (activePointers.has(e.pointerId)) {
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    }

    // Handle 2-finger pinch zoom
    if (dragMode === 'pinch' && activePointers.size === 2) {
      const pts = Array.from(activePointers.values());
      const currentDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (initialPinchDist > 0) {
        const factor = currentDist / initialPinchDist;
        const midX = (pts[0].x + pts[1].x) / 2;
        const midY = (pts[0].y + pts[1].y) / 2;
        zoom = U.clamp(initialPinchZoom * factor, 0.25, 6);
        requestRedraw();
        emitView();
      }
      return;
    }

    const pt = getCanvasPoint(e);

    if (!dragMode) {
      // Hover cursor updates
      const hit = hitTest(pt.x, pt.y);
      if (hit.type === 'handle') {
        setCursorForHandle(hit.handle);
      } else if (hit.type === 'element') {
        canvas.style.cursor = 'move';
      } else {
        canvas.style.cursor = 'default';
      }
      return;
    }

    if (dragMode === 'pan') {
      if (!dragStart) return;
      panX = dragStart.panX + (pt.x - dragStart.x);
      panY = dragStart.panY + (pt.y - dragStart.y);
      requestRedraw();
      emitView();
    } else if (dragMode === 'move') {
      if (!dragStart || !dragStart.elements || !dragStart.elements.length) {
        dragMode = null;
        return;
      }
      const primary = dragStart.elements[0];
      if (!primary) {
        dragMode = null;
        return;
      }

      const rawDeltaX = pt.cmX - dragStart.startX;
      const rawDeltaY = pt.cmY - dragStart.startY;
      const state = A.store.getState();
      const excludeIds = new Set(dragStart.elements.map((e) => e.id));

      const proposedX = primary.x + rawDeltaX;
      const proposedY = primary.y + rawDeltaY;
      const snapResult = calculateSnaps(primary, proposedX, proposedY, state, excludeIds);

      const deltaX = snapResult.x - primary.x;
      const deltaY = snapResult.y - primary.y;
      activeGuides = snapResult.guides;

      A.store.update(
        (draft) => {
          for (const item of dragStart.elements) {
            const target = draft.elements.find((el) => el.id === item.id);
            if (target) {
              target.x = Math.round((item.x + deltaX) * 10) / 10;
              target.y = Math.round((item.y + deltaY) * 10) / 10;
            }
          }
        },
        { record: false, reason: 'drag' }
      );
      requestRedraw();
    } else if (dragMode === 'resize') {
      if (!dragStart || !dragStart.element) {
        dragMode = null;
        return;
      }
      const hnd = dragStart.handle;
      const el = dragStart.element;
      const rawDx = pt.cmX - dragStart.startX;
      const rawDy = pt.cmY - dragStart.startY;

      let newX = dragStart.origX;
      let newY = dragStart.origY;
      let newW = dragStart.origW;
      let newH = dragStart.origH;

      if (hnd.includes('e')) newW = Math.max(V.config.minSizeCm, dragStart.origW + rawDx);
      if (hnd.includes('w')) {
        const potentialW = dragStart.origW - rawDx;
        if (potentialW >= V.config.minSizeCm) {
          newW = potentialW;
          newX = dragStart.origX + rawDx;
        }
      }
      if (hnd.includes('n')) newH = Math.max(V.config.minSizeCm, dragStart.origH + rawDy);
      if (hnd.includes('s')) {
        const potentialH = dragStart.origH - rawDy;
        if (potentialH >= V.config.minSizeCm) {
          newH = potentialH;
          newY = dragStart.origY + rawDy;
        }
      }

      // Snap resizing edges to 5cm grid
      const grid = 5;
      newW = Math.round(newW / grid) * grid;
      newH = Math.round(newH / grid) * grid;
      newX = Math.round(newX / grid) * grid;
      newY = Math.round(newY / grid) * grid;

      A.store.update(
        (draft) => {
          const target = draft.elements.find((item) => item.id === el.id);
          if (target) {
            target.x = newX;
            target.y = newY;
            target.width = Math.max(V.config.minSizeCm, newW);
            target.height = Math.max(V.config.minSizeCm, newH);
          }
        },
        { record: false, reason: 'resize' }
      );
      requestRedraw();
    } else if (dragMode === 'marquee') {
      if (!dragStart) return;
      const x1 = Math.min(dragStart.startX, pt.x);
      const y1 = Math.min(dragStart.startY, pt.y);
      const x2 = Math.max(dragStart.startX, pt.x);
      const y2 = Math.max(dragStart.startY, pt.y);
      currentMarquee = { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };

      // Live select elements inside marquee
      const state = A.store.getState();
      const T = getTransform();
      const insideIds = [];
      for (const el of state.elements) {
        const r = T.rect(el);
        if (r.x + r.w >= x1 && r.x <= x2 && r.y + r.h >= y1 && r.y <= y2) {
          insideIds.push(el.id);
        }
      }
      A.store.select(insideIds, { additive: e.shiftKey });
      requestRedraw();
    }
  }

  function onPointerUp(e) {
    if (e && e.pointerId !== undefined) {
      if (activePointers.has(e.pointerId)) {
        activePointers.delete(e.pointerId);
      }
      try {
        if (canvas && canvas.hasPointerCapture && canvas.hasPointerCapture(e.pointerId)) {
          canvas.releasePointerCapture(e.pointerId);
        }
      } catch (_) {}
    } else {
      activePointers.clear();
    }

    if (dragMode === 'move' || dragMode === 'resize') {
      A.store.commit();
    }

    dragMode = null;
    dragStart = null;
    activeGuides = [];
    currentMarquee = null;
    initialPinchDist = null;
    if (canvas) canvas.style.cursor = 'default';
    requestRedraw();
  }

  function onWheel(e) {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) {
      // Trackpad pinch or Ctrl+wheel zoom
      const zoomFactor = Math.exp(-e.deltaY * 0.01);
      zoomBy(zoomFactor, e.clientX, e.clientY);
    } else {
      // Pan
      panX -= e.deltaX;
      panY -= e.deltaY;
      requestRedraw();
      emitView();
    }
  }

  function setCursorForHandle(hnd) {
    const map = {
      n: 'ns-resize',
      s: 'ns-resize',
      e: 'ew-resize',
      w: 'ew-resize',
      nw: 'nwse-resize',
      se: 'nwse-resize',
      ne: 'nesw-resize',
      sw: 'nesw-resize',
    };
    canvas.style.cursor = map[hnd] || 'default';
  }

  /* ---------- Render Loop ---------- */
  function requestRedraw() {
    redrawRequested = true;
  }

  function loop(time) {
    const state = A.store.getState();
    const needsAnim = A.render.needsAnimation(state);

    if (redrawRequested || needsAnim) {
      redrawRequested = false;
      renderNow(time);
    }

    animId = requestAnimationFrame(loop);
  }

  function renderNow(time) {
    if (!ctx) return;
    ctx.save();
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, width, height);

    const s = getPxPerCm();
    const T = getTransform();
    const sel = A.store.getSelection();

    A.render.drawScene(ctx, A.store.getState(), {
      pxPerCm: s,
      originX: T.x(0),
      originY: T.y(0),
      width,
      height,
      time: time || performance.now(),
      grid: true,
      annotations,
      eyeLevel,
      eyeLevelCm,
      labels: true,
      rulers: true,
      selection: sel,
      hud: true,
      guides: activeGuides,
      marquee: currentMarquee,
      theme: 'screen',
      uiScale: 1,
      dpr,
      background: '#0b0d11',
      ghost,
    });

    ctx.restore();
  }

  /* ---------- Initialization ---------- */
  function init(hostEl) {
    host = hostEl;
    host.innerHTML = '';

    canvas = document.createElement('canvas');
    canvas.id = 'arch2d-canvas';
    canvas.setAttribute('tabindex', '0');
    canvas.style.display = 'block';
    canvas.style.touchAction = 'none'; // Essential for Pointer Events pinch/pan
    host.appendChild(canvas);

    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', onPointerUp);
    canvas.addEventListener('wheel', onWheel, { passive: false });

    // Safety: global pointerup & blur to prevent stuck drags when pointer leaves canvas or window
    window.addEventListener('pointerup', (e) => {
      if (dragMode) onPointerUp(e);
    });
    window.addEventListener('pointercancel', (e) => {
      if (dragMode) onPointerUp(e);
    });
    window.addEventListener('blur', () => {
      activePointers.clear();
      if (dragMode) onPointerUp();
    });

    // Double click to reset / fit zoom
    canvas.addEventListener('dblclick', () => fit());

    window.addEventListener('resize', U.debounce(resize, 80));

    // ResizeObserver on canvas host container so layout changes (sidebars open/close) resize immediately
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(() => {
        resize();
      });
      ro.observe(hostEl);
    }

    // Listen to store updates
    A.bus.on('state:changed', () => requestRedraw());
    A.bus.on('selection:changed', () => requestRedraw());
    A.bus.on('photo:ready', () => requestRedraw());

    resize();
    fit();

    if (animId) cancelAnimationFrame(animId);
    animId = requestAnimationFrame(loop);
  }

  A.canvas = {
    init,
    requestRedraw,
    fit,
    zoomBy,
    getView: () => ({ pxPerCm: getPxPerCm(), zoom, originX: getTransform().x(0), originY: getTransform().y(0) }),
    setAnnotations: (val) => {
      annotations = !!val;
      requestRedraw();
      A.bus.emit('annotations:toggled', { visible: annotations });
    },
    toggleAnnotations: () => {
      A.canvas.setAnnotations(!annotations);
    },
    annotationsVisible: () => annotations,
    setEyeLevel: (val) => {
      eyeLevel = !!val;
      requestRedraw();
      A.bus.emit('eyelevel:toggled', { visible: eyeLevel, cm: eyeLevelCm });
    },
    toggleEyeLevel: () => {
      A.canvas.setEyeLevel(!eyeLevel);
    },
    isEyeLevel: () => eyeLevel,
    getEyeLevelCm: () => eyeLevelCm,
    setEyeLevelCm: (val) => {
      eyeLevelCm = U.clamp(Number(val) || 105, 50, 250);
      requestRedraw();
      A.bus.emit('eyelevel:toggled', { visible: eyeLevel, cm: eyeLevelCm });
    },
    setSnapping: (val) => {
      snapping = !!val;
    },
    isSnapping: () => snapping,
    setGhost: (val) => {
      ghost = !!val;
      requestRedraw();
      A.bus.emit('ghost:toggled', { visible: ghost });
    },
    toggleGhost: () => A.canvas.setGhost(!ghost),
    isGhost: () => ghost,
  };
})();
</script>

/* Arch2D — WS2: global keyboard shortcuts and nudge interactions (project.md §3.4). */
(function () {
  'use strict';
  const A = window.Arch2D;
  const U = A.util;

  function onKeyDown(e) {
    // Never intercept shortcuts while user is typing in inputs or textareas
    if (U.isTypingTarget(e.target)) return;

    const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
    const cmdOrCtrl = isMac ? e.metaKey : e.ctrlKey;
    const shift = e.shiftKey;
    const key = e.key;

    // 1. Undo / Redo
    if (cmdOrCtrl && (key === 'z' || key === 'Z')) {
      e.preventDefault();
      if (shift) A.store.redo();
      else A.store.undo();
      return;
    }
    if (cmdOrCtrl && (key === 'y' || key === 'Y')) {
      e.preventDefault();
      A.store.redo();
      return;
    }

    // 2. Duplicate: Ctrl/Cmd + D
    if (cmdOrCtrl && (key === 'd' || key === 'D')) {
      e.preventDefault();
      const sel = A.store.getSelection();
      if (sel.length) A.store.duplicateElements(sel);
      return;
    }

    // 3. Save: Ctrl/Cmd + S
    if (cmdOrCtrl && (key === 's' || key === 'S')) {
      e.preventDefault();
      A.persistence.saveToFile();
      return;
    }

    // 4. Select All: Ctrl/Cmd + A
    if (cmdOrCtrl && (key === 'a' || key === 'A')) {
      e.preventDefault();
      A.store.selectAll();
      return;
    }

    // 5. Annotations Toggle: 'a' or 'A' without modifier
    if (!cmdOrCtrl && (key === 'a' || key === 'A')) {
      e.preventDefault();
      A.canvas.toggleAnnotations();
      return;
    }

    // 5b. Seated Eye Level / TV Center Toggle: 'e' or 'E' without modifier
    if (!cmdOrCtrl && (key === 'e' || key === 'E')) {
      e.preventDefault();
      A.canvas.toggleEyeLevel();
      return;
    }

    // 5c. Ghost Elements Toggle: 'g' or 'G' without modifier
    if (!cmdOrCtrl && (key === 'g' || key === 'G')) {
      e.preventDefault();
      A.canvas.toggleGhost();
      return;
    }

    // 6. Delete / Backspace
    if (key === 'Delete' || key === 'Backspace') {
      const sel = A.store.getSelection();
      if (sel.length) {
        e.preventDefault();
        A.store.removeElements(sel);
      }
      return;
    }

    // 7. Escape: Deselect all
    if (key === 'Escape') {
      e.preventDefault();
      A.store.clearSelection();
      return;
    }

    // 8. Arrow Keys Nudge: 1cm (normal) or 10cm (with Shift)
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) {
      const sel = A.store.getSelection();
      if (!sel.length) return;

      e.preventDefault();
      const step = shift ? 10 : 1;
      let dx = 0, dy = 0;
      if (key === 'ArrowLeft') dx = -step;
      if (key === 'ArrowRight') dx = step;
      if (key === 'ArrowUp') dy = step; // +Y is up AFF
      if (key === 'ArrowDown') dy = -step;

      A.store.update((draft) => {
        for (const id of sel) {
          const el = draft.elements.find((item) => item.id === id);
          if (el) {
            el.x = Math.round((el.x + dx) * 10) / 10;
            el.y = Math.round((el.y + dy) * 10) / 10;
          }
        }
      }, { reason: 'nudge' });
    }
  }

  function init() {
    window.addEventListener('keydown', onKeyDown);
  }

  A.input = {
    init,
  };
})();
</script>
