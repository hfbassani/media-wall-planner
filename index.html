<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Arch2D Elevation Architect — Media Wall Planner &amp; AI Render Studio</title>
  <meta name="description" content="Draft true-to-scale 2D elevations of media walls, cabinetry and shelving, apply architectural textures, export 2000px+ reference PNGs and generate AI renders from structured prompts." />
  <meta name="theme-color" content="#0b0d11" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
/* === src/tokens.css === */
/* Arch2D — design tokens (Phase 0). */
:root {
  /* Surfaces */
  --bg-0: #0b0d11;
  --bg-1: #12151b;
  --bg-2: #181c24;
  --bg-3: #20252f;
  --glass: rgba(22, 26, 34, 0.72);
  --glass-strong: rgba(18, 21, 28, 0.9);
  --line: rgba(255, 255, 255, 0.07);
  --line-strong: rgba(255, 255, 255, 0.14);

  /* Text */
  --text-0: #f3f1ec;
  --text-1: #c4c7ce;
  --text-2: #8a909c;
  --text-3: #5d636f;

  /* Accents */
  --brass: hsl(36, 58%, 62%);
  --brass-strong: hsl(34, 70%, 55%);
  --brass-soft: hsla(36, 58%, 62%, 0.14);
  --cyan: hsl(190, 85%, 60%);
  --cyan-soft: hsla(190, 85%, 60%, 0.16);
  --danger: hsl(4, 72%, 62%);
  --danger-soft: hsla(4, 72%, 62%, 0.14);
  --success: hsl(150, 50%, 55%);

  --grad-brand: linear-gradient(135deg, hsl(36, 70%, 64%) 0%, hsl(20, 65%, 56%) 100%);
  --grad-panel: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0) 100%);

  /* Type */
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --fs-xs: 11px;
  --fs-sm: 12px;
  --fs-md: 13px;
  --fs-lg: 15px;
  --fs-xl: 18px;

  /* Spacing & shape */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 20px;

  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
  --shadow-2: 0 10px 40px rgba(0, 0, 0, 0.45);
  --ring: 0 0 0 2px hsla(36, 58%, 62%, 0.45);

  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --t-fast: 120ms;
  --t-med: 220ms;

  --header-h: 56px;
  --sidebar-w: 280px;
  --inspector-w: 300px;
}
</style>
<style>
/* === src/ui.css === */
/* Arch2D — WS4: UI Shell, sidebars, forms, and inspector CSS */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg-0);
  color: var(--text-0);
  font-family: var(--font);
  font-size: var(--fs-md);
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}

/* App container */
.app {
  display: grid;
  grid-template-rows: var(--header-h) 1fr;
  grid-template-columns: var(--sidebar-w) 1fr var(--inspector-w);
  grid-template-areas:
    "header header header"
    "left   stage  right";
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

/* Header */
.app-header {
  grid-area: header;
  background: var(--bg-1);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--sp-4);
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
}
.brand-mark {
  width: 20px;
  height: 20px;
  border-radius: var(--r-sm);
  background: var(--grad-brand);
}
.brand-title {
  font-size: var(--fs-md);
  font-weight: 700;
  color: var(--text-0);
  letter-spacing: -0.01em;
}
.brand-title span {
  font-weight: 400;
  color: var(--text-2);
  margin-left: 4px;
}
.badge {
  font-size: var(--fs-xs);
  padding: 2px 8px;
  border-radius: 12px;
  background: var(--bg-3);
  color: var(--text-2);
  border: 1px solid var(--line);
}
.header-actions {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}

/* Buttons and Controls */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  color: var(--text-0);
  font-family: var(--font);
  font-size: var(--fs-sm);
  font-weight: 600;
  cursor: pointer;
  transition: all var(--t-fast) var(--ease);
  text-decoration: none;
  white-space: nowrap;
}
.btn:hover:not(:disabled) {
  background: var(--bg-3);
  border-color: var(--line-strong);
}
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.btn.primary {
  background: var(--grad-brand);
  color: #0d0f12;
  border: none;
  font-weight: 700;
}
.btn.primary:hover:not(:disabled) {
  filter: brightness(1.1);
  box-shadow: 0 0 16px hsla(36, 70%, 64%, 0.35);
}
.btn.ghost {
  background: none;
  border-color: transparent;
  color: var(--text-1);
}
.btn.ghost:hover:not(:disabled) {
  background: var(--bg-2);
  color: var(--text-0);
}
.btn.danger {
  color: var(--danger);
  border-color: var(--danger-soft);
}
.btn.danger:hover:not(:disabled) {
  background: var(--danger-soft);
}
.btn.sm {
  padding: 4px 8px;
  font-size: var(--fs-xs);
}
.btn-group {
  display: inline-flex;
  border-radius: var(--r-md);
  background: var(--bg-2);
  border: 1px solid var(--line);
}
.btn-group .btn {
  border: none;
  border-radius: 0;
}
.btn-group .btn:not(:last-child) {
  border-right: 1px solid var(--line);
}

.icon-btn {
  background: none;
  border: none;
  color: var(--text-2);
  padding: 6px;
  border-radius: var(--r-sm);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.icon-btn:hover {
  color: var(--text-0);
  background: var(--bg-3);
}

/* Inputs & Selects */
.input, .select {
  width: 100%;
  padding: 6px 10px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  color: var(--text-0);
  font-family: var(--font);
  font-size: var(--fs-sm);
  transition: border-color var(--t-fast);
}
.input:focus, .select:focus {
  outline: none;
  border-color: var(--brass);
  box-shadow: var(--ring);
}
.select-wrap {
  position: relative;
  display: inline-block;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* Sidebars */
.sidebar {
  background: var(--bg-1);
  border-color: var(--line);
  overflow-y: auto;
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-5);
}
.sidebar-left {
  grid-area: left;
  border-right: 1px solid var(--line);
}
.sidebar-right {
  grid-area: right;
  border-left: 1px solid var(--line);
}

.sidebar-section {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}
.section-heading {
  font-size: var(--fs-xs);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-2);
}

/* Form layouts */
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-2);
}
.form-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.form-label {
  font-size: var(--fs-xs);
  color: var(--text-2);
}

/* Presets Library Buttons */
.presets-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
}
.preset-item-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  color: var(--text-0);
  font-size: var(--fs-sm);
  font-weight: 500;
  cursor: pointer;
  transition: all var(--t-fast);
  text-align: left;
}
.preset-item-btn:hover {
  background: var(--bg-3);
  border-color: var(--brass);
}
.preset-dims {
  font-size: var(--fs-xs);
  color: var(--text-2);
  font-family: var(--font-mono);
}

/* Texture Selector Grid */
.texture-picker-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.texture-tile {
  padding: 8px 4px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  color: var(--text-1);
  font-size: var(--fs-xs);
  text-align: center;
  cursor: pointer;
  transition: all var(--t-fast);
}
.texture-tile:hover {
  border-color: var(--brass);
  color: var(--text-0);
}
.texture-tile.active {
  border-color: var(--brass-strong);
  background: var(--brass-soft);
  color: var(--brass-strong);
  font-weight: 600;
}

/* Stage Area & Canvas */
.stage {
  grid-area: stage;
  position: relative;
  background: var(--bg-0);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.stage-toolbar {
  position: absolute;
  top: var(--sp-3);
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  background: var(--glass);
  backdrop-filter: blur(8px);
  padding: 4px 8px;
  border-radius: var(--r-xl);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-1);
}
.canvas-host {
  width: 100%;
  height: 100%;
  position: relative;
}
.stage-hint {
  position: absolute;
  bottom: var(--sp-3);
  left: 50%;
  transform: translateX(-50%);
  font-size: var(--fs-xs);
  color: var(--text-3);
  pointer-events: none;
}

/* Toast notifications */
.toast-stack {
  position: fixed;
  bottom: var(--sp-5);
  right: var(--sp-5);
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  z-index: 2000;
  pointer-events: none;
}
.toast {
  padding: 10px 16px;
  background: var(--bg-2);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-2);
  font-size: var(--fs-sm);
  color: var(--text-0);
  pointer-events: auto;
  animation: toastIn var(--t-fast) var(--ease);
}
.toast.success { border-color: var(--success); color: var(--success); }
.toast.error { border-color: var(--danger); color: var(--danger); }
.toast.info { border-color: var(--cyan); }
@keyframes toastIn {
  from { transform: translateY(12px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

/* Responsive collapse for mobile & tablets */
.only-mobile { display: none; }
@media (max-width: 900px) {
  .app {
    grid-template-columns: var(--sidebar-w) 1fr;
    grid-template-areas:
      "header header"
      "left   stage";
  }
  .sidebar-right {
    position: fixed;
    right: 0;
    top: var(--header-h);
    bottom: 0;
    width: 320px;
    z-index: 90;
    box-shadow: var(--shadow-2);
    transform: translateX(100%);
    transition: transform var(--t-med) var(--ease);
  }
  .sidebar-right.open {
    transform: translateX(0);
  }
  .hide-sm { display: none; }
}
@media (max-width: 680px) {
  .only-mobile { display: inline-flex; }
  .app {
    grid-template-columns: 1fr;
    grid-template-areas:
      "header"
      "stage";
  }
  .sidebar-left {
    position: fixed;
    left: 0;
    top: var(--header-h);
    bottom: 0;
    width: 290px;
    z-index: 95;
    box-shadow: var(--shadow-2);
    transform: translateX(-100%);
    transition: transform var(--t-med) var(--ease);
  }
  .sidebar-left.open {
    transform: translateX(0);
  }
}

/* Calibration modal & photo controls */
.calib-modal {
  width: 95vw;
  max-width: 1100px;
  height: 88vh;
  max-height: 800px;
}
.calib-body {
  flex: 1;
  display: flex;
  overflow: hidden;
}
.calib-stage {
  flex: 1;
  position: relative;
  background: #07090c;
  overflow: hidden;
}
.calib-canvas {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}
.calib-side {
  width: 320px;
  background: var(--bg-1);
  border-left: 1px solid var(--line);
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
  overflow-y: auto;
}
.calib-steps {
  margin: 0;
  padding-left: 18px;
  font-size: var(--fs-xs);
  color: var(--text-1);
  line-height: 1.5;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.calib-note {
  font-size: var(--fs-xs);
  color: var(--text-2);
  line-height: 1.4;
}
.calib-actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--sp-2);
  margin-top: auto;
  padding-top: var(--sp-3);
  border-top: 1px solid var(--line);
}
.photo-card {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
}
.photo-thumb-wrap {
  position: relative;
  width: 100%;
  height: 90px;
  border-radius: var(--r-sm);
  overflow: hidden;
  background: #000;
}
.photo-thumb {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Export Dialog / Modal */
.export-modal {
  width: 95vw;
  max-width: 1040px;
  height: 86vh;
  max-height: 760px;
}
.export-body {
  flex: 1;
  display: flex;
  overflow: hidden;
}
.export-preview-pane {
  flex: 1;
  position: relative;
  background: #07090c;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--sp-4);
  overflow: hidden;
  gap: var(--sp-2);
}
.export-checkerboard {
  position: relative;
  max-width: 100%;
  max-height: calc(100% - 32px);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
  border-radius: var(--r-sm);
  overflow: hidden;
  background-image: linear-gradient(45deg, #181c24 25%, transparent 25%),
    linear-gradient(-45deg, #181c24 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #181c24 75%),
    linear-gradient(-45deg, transparent 75%, #181c24 75%);
  background-size: 16px 16px;
  background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
  background-color: #0d1015;
  display: flex;
  align-items: center;
  justify-content: center;
}
.export-preview-canvas {
  display: block;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}
.export-dim-pill {
  font-size: var(--fs-xs);
  color: var(--text-2);
  background: rgba(255, 255, 255, 0.05);
  padding: 3px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
}
.export-side {
  width: 340px;
  background: var(--bg-1);
  border-left: 1px solid var(--line);
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
  overflow-y: auto;
}
.export-presets-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.export-opt-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  background: var(--bg-2);
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
}
.export-opt-title {
  font-size: var(--fs-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-2);
  margin-bottom: 2px;
}
.export-check-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: var(--fs-sm);
  color: var(--text-0);
  cursor: pointer;
  user-select: none;
}
.export-check-label input[type="checkbox"],
.export-check-label input[type="radio"] {
  cursor: pointer;
  accent-color: var(--brass-strong);
}
.export-btn-bar {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: auto;
  padding-top: var(--sp-3);
  border-top: 1px solid var(--line);
}

#export-backdrop {
  z-index: 1200;
}


</style>
<style>
/* === src/studio.css === */
/* Arch2D — WS6: AI Render & Prompt Studio modal styles */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(4, 6, 9, 0.82);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--sp-4);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--t-med) var(--ease);
}
.modal-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}

.studio-modal {
  width: 100%;
  max-width: 1140px;
  height: 90vh;
  max-height: 820px;
  background: var(--bg-1);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: modalPop var(--t-med) var(--ease);
}
@keyframes modalPop {
  from { transform: scale(0.97) translateY(10px); }
  to { transform: scale(1) translateY(0); }
}

.studio-header {
  height: 60px;
  padding: 0 var(--sp-5);
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  background: var(--bg-2);
}
.studio-title {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  font-size: var(--fs-lg);
  font-weight: 700;
  color: var(--text-0);
}
.studio-tabs {
  display: flex;
  gap: var(--sp-2);
}
.studio-tab {
  background: none;
  border: none;
  color: var(--text-2);
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--r-md);
  font-size: var(--fs-md);
  font-weight: 600;
  cursor: pointer;
  transition: all var(--t-fast);
}
.studio-tab:hover {
  color: var(--text-0);
  background: var(--bg-3);
}
.studio-tab.active {
  color: var(--brass-strong);
  background: var(--brass-soft);
}

.studio-body {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* Two-column layout in Studio */
.studio-col-left {
  flex: 1.1;
  padding: var(--sp-5);
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  overflow-y: auto;
  border-right: 1px solid var(--line);
}
.studio-col-right {
  flex: 0.9;
  padding: var(--sp-5);
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  overflow-y: auto;
  background: var(--bg-0);
}

.studio-section-title {
  font-size: var(--fs-xs);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 700;
  color: var(--text-2);
  margin-bottom: var(--sp-1);
}

.prompt-textarea {
  width: 100%;
  height: 180px;
  padding: var(--sp-3);
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  color: var(--text-0);
  font-family: var(--font);
  font-size: var(--fs-md);
  line-height: 1.5;
  resize: vertical;
  transition: border-color var(--t-fast);
}
.prompt-textarea:focus {
  outline: none;
  border-color: var(--brass);
  box-shadow: var(--ring);
}

.studio-tip-banner {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-2);
  padding: 10px 14px;
  background: rgba(200, 161, 101, 0.08);
  border: 1px solid rgba(200, 161, 101, 0.25);
  border-radius: var(--r-md);
  font-size: var(--fs-xs);
  color: var(--text-1);

/* === src/00-namespace.js === */
/* Arch2D — shared namespace and utilities (Phase 0). See CONTRACTS.md. */
(function () {
  'use strict';
  const A = (window.Arch2D = window.Arch2D || {});
  A.version = '2.0.0';

  const util = {
    uid() {
      return 'el_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
    },
    clamp(v, a, b) {
      return Math.min(b, Math.max(a, v));
    },
    round(v, step = 1) {
      return Math.round(v / step) * step;
    },
    clone(o) {
      return JSON.parse(JSON.stringify(o));
    },
    /** Tiny DOM builder: h('div', {class:'x', onclick: fn}, 'text', childNode) */
    h(tag, attrs, ...children) {
      const node = document.createElement(tag);
      if (attrs) {
        for (const [k, v] of Object.entries(attrs)) {
          if (v === undefined || v === null || v === false) continue;
          if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
          else if (k === 'class') node.className = v;
          else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
          else if (k === 'html') node.innerHTML = v;
          else if (k in node && typeof v !== 'string') node[k] = v;
          else node.setAttribute(k, v === true ? '' : v);
        }
      }
      for (const c of children.flat()) {
        if (c === null || c === undefined || c === false) continue;
        node.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
      }
      return node;
    },
    downloadBlob(blob, name) {
      const url = URL.createObjectURL(blob);
      util.downloadDataUrl(url, name);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    },
    downloadDataUrl(url, name) {
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
    },
    debounce(fn, ms) {
      let t;
      return function (...args) {
        clearTimeout(t);
        t = setTimeout(() => fn.apply(this, args), ms);
      };
    },
    hashString(s) {
      let h = 2166136261 >>> 0;
      for (let i = 0; i < s.length; i++) {
        h ^= s.charCodeAt(i);
        h = Math.imul(h, 16777619) >>> 0;
      }
      return h >>> 0;
    },
    /** Deterministic PRNG (mulberry32). */
    rng(seed) {
      let a = seed >>> 0;
      return function () {
        a = (a + 0x6d2b79f5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    },
    hexToRgb(hex) {
      let h = String(hex || '#000000').replace('#', '');
      if (h.length === 3) h = h.split('').map((c) => c + c).join('');
      const n = parseInt(h, 16) || 0;
      return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
    },
    rgba(hex, a) {
      const { r, g, b } = util.hexToRgb(hex);
      return `rgba(${r},${g},${b},${a})`;
    },
    /** amt in [-1, 1]: negative darkens, positive lightens. */
    shade(hex, amt) {
      const { r, g, b } = util.hexToRgb(hex);
      const f = (c) => Math.round(amt < 0 ? c * (1 + amt) : c + (255 - c) * amt);
      return '#' + [f(r), f(g), f(b)].map((c) => util.clamp(c, 0, 255).toString(16).padStart(2, '0')).join('');
    },
    luminance(hex) {
      const { r, g, b } = util.hexToRgb(hex);
      return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
    },
    isTypingTarget(el) {
      if (!el) return false;
      const tag = el.tagName;
      return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
    },
  };

  A.util = util;
})();

<script>
/* === src/01-bus.js === */
/* Arch2D — event bus (Phase 0). */
(function () {
  'use strict';
  const A = window.Arch2D;
  const handlers = new Map();

  A.bus = {
    on(evt, fn) {
      if (!handlers.has(evt)) handlers.set(evt, new Set());
      handlers.get(evt).add(fn);
      return () => A.bus.off(evt, fn);
    },
    off(evt, fn) {
      const set = handlers.get(evt);
      if (set) set.delete(fn);
    },
    emit(evt, payload) {
      const set = handlers.get(evt);
      if (!set) return;
      for (const fn of [...set]) {
        try {
          fn(payload);
        } catch (err) {
          console.error(`[Arch2D bus] handler for "${evt}" failed:`, err);
        }
      }
    },
  };
})();
</script>

      schemaVersion: SCHEMA_VERSION,
      name: typeof obj.name === 'string' && obj.name.trim() ? obj.name.slice(0, 120) : 'Untitled media wall',
      wallWidth: clamp(num(obj.wallWidth, 400), 50, 5000),
      wallHeight: clamp(num(obj.wallHeight, 280), 50, 2000),
      mood: V.moods[obj.mood] ? obj.mood : 'japandi',
      wallPhoto: normalizeWallPhoto(obj.wallPhoto),
      elements: [],
    };
    const sorted = obj.elements
      .map((e, i) => ({ e, i }))
      .sort((a, b) => num(a.e && a.e.zIndex, a.i) - num(b.e && b.e.zIndex, b.i) || a.i - b.i);
    const seen = new Set();
    sorted.forEach(({ e }, i) => {
      const el = normalizeElement(e, i, errors);
      if (!el) return;
      if (seen.has(el.id)) el.id = uid();
      seen.add(el.id);
      value.elements.push(el);
    });
    value.elements.forEach((el, i) => (el.zIndex = i));
    return { ok: true, errors, value };
  }

  /* ---------- core ---------- */
  const snap = () => JSON.stringify(state);

  function emitState(reason) {
    A.bus.emit('state:changed', { state, reason });
  }
  function emitHistory() {
    A.bus.emit('history:changed', { canUndo: undoStack.length > 0, canRedo: redoStack.length > 0 });
  }
  function pushUndo(snapshot) {
    undoStack.push(snapshot);
    if (undoStack.length > LIMIT) undoStack.shift();
    redoStack.length = 0;
    emitHistory();
  }
  function pruneSelection() {
    const ids = new Set(state.elements.map((e) => e.id));
    const next = selection.filter((id) => ids.has(id));
    if (next.length !== selection.length) {
      selection = next;
      A.bus.emit('selection:changed', { ids: selection.slice() });
    }
  }

  function update(fn, opts = {}) {
    const record = opts.record !== false && !txnSnapshot;
    const before = record ? snap() : null;
    const draft = clone(state);
    fn(draft);
    draft.elements.forEach((el, i) => (el.zIndex = i));
    state = draft;
    if (record && before !== snap()) pushUndo(before);
    pruneSelection();
    emitState(opts.reason || 'update');
  }

  const store = {
    SCHEMA_VERSION,
    getState: () => state,
    validate,
    update,

    begin() {
      if (!txnSnapshot) txnSnapshot = snap();
    },
    commit() {
      if (!txnSnapshot) return;
      const before = txnSnapshot;
      txnSnapshot = null;
      if (before !== snap()) pushUndo(before);
    },
    cancel() {
      if (!txnSnapshot) return;
      state = JSON.parse(txnSnapshot);
      txnSnapshot = null;
      pruneSelection();
      emitState('cancel');
    },
    inTransaction: () => !!txnSnapshot,

    /* selection */
    getSelection: () => selection.slice(),
    getSelectedElements: () => state.elements.filter((e) => selection.includes(e.id)),
    select(ids, opts = {}) {
      ids = (Array.isArray(ids) ? ids : [ids]).filter(Boolean);
      let next;
      if (opts.toggle) {
        next = selection.slice();
        for (const id of ids) {
          const i = next.indexOf(id);
          if (i >= 0) next.splice(i, 1);
          else next.push(id);
        }
      } else if (opts.additive) {
        next = [...new Set([...selection, ...ids])];
      } else next = ids.slice();
      const changed = next.length !== selection.length || next.some((id, i) => id !== selection[i]);
      selection = next;
      if (changed) A.bus.emit('selection:changed', { ids: selection.slice() });
    },
    selectAll() {
      store.select(state.elements.map((e) => e.id));
    },
    clearSelection() {
      store.select([]);
    },

    /* element helpers */
    addElement(partial = {}) {
      const type = V.presets[partial.type] ? partial.type : 'custom';
      const p = V.presets[type];
      const el = normalizeElement(
        Object.assign(
          {
            type,
            label: p.label,
            width: p.width,
            height: p.height,
            texture: p.texture,
            color: p.color,
            x: Math.round((state.wallWidth - (partial.width || p.width)) / 2),
            y: p.y,
            ledHalo: !!p.ledHalo,
            ledUnderglow: !!p.ledUnderglow,
          },
          partial,
          { id: uid() }
        ),
        state.elements.length,
        []
      );
      update((d) => d.elements.push(el), { reason: 'add' });
      store.select([el.id]);
      return el.id;
    },
    addPreset(key) {
      return store.addElement({ type: key });
    },
    removeElements(ids) {
      if (!ids || !ids.length) return;
      const set = new Set(ids);
      update((d) => (d.elements = d.elements.filter((e) => !set.has(e.id))), { reason: 'remove' });
    },
    duplicateElements(ids) {
      const set = new Set(ids || []);
      if (!set.size) return [];
      const newIds = [];
      update(
        (d) => {
          const copies = d.elements
            .filter((e) => set.has(e.id))
            .map((e) => {
              const c = Object.assign(clone(e), { id: uid(), x: e.x + 10, y: e.y + 10 });
              newIds.push(c.id);
              return c;
            });
          d.elements.push(...copies);
        },
        { reason: 'duplicate' }
      );
      store.select(newIds);
      return newIds;
    },
    bringForward(ids) {
      const set = new Set(ids || []);
      update(
        (d) => {
          const a = d.elements;
          for (let i = a.length - 2; i >= 0; i--) {
            if (set.has(a[i].id) && !set.has(a[i + 1].id)) [a[i], a[i + 1]] = [a[i + 1], a[i]];
          }
        },
        { reason: 'layer' }
      );
    },
    sendBackward(ids) {
      const set = new Set(ids || []);
      update(
        (d) => {
          const a = d.elements;
          for (let i = 1; i < a.length; i++) {
            if (set.has(a[i].id) && !set.has(a[i - 1].id)) [a[i], a[i - 1]] = [a[i - 1], a[i]];
          }
        },
        { reason: 'layer' }
      );
    },
    setWall({ wallWidth, wallHeight }) {
      update(
        (d) => {
          if (wallWidth !== undefined) d.wallWidth = clamp(Number(wallWidth) || d.wallWidth, 50, 5000);
          if (wallHeight !== undefined) d.wallHeight = clamp(Number(wallHeight) || d.wallHeight, 50, 2000);
        },
        { reason: 'wall' }
      );
    },
    setMood(id) {
      if (!V.moods[id]) return;
      update((d) => (d.mood = id), { reason: 'mood' });
    },
    /** Replace (or clear with null) the wall photo reference. */
    setWallPhoto(ref) {
      update((d) => (d.wallPhoto = normalizeWallPhoto(ref)), { reason: 'photo' });
    },
    /** Toggle photo flags, e.g. { visible: false }. No-op without a photo. */
    patchWallPhoto(partial) {
      if (!state.wallPhoto) return;
      update((d) => (d.wallPhoto = normalizeWallPhoto(Object.assign({}, d.wallPhoto, partial))), { reason: 'photo' });
    },

    /* history */
    canUndo: () => undoStack.length > 0,
    canRedo: () => redoStack.length > 0,
    undo() {
      if (txnSnapshot) store.commit();
      if (!undoStack.length) return false;
      redoStack.push(snap());
      state = JSON.parse(undoStack.pop());
      pruneSelection();
      emitHistory();
      emitState('undo');
      return true;
    },
    redo() {
      if (!redoStack.length) return false;
      undoStack.push(snap());
      state = JSON.parse(redoStack.pop());
      pruneSelection();
      emitHistory();
      emitState('redo');
      return true;
    },
    clearHistory() {
      undoStack.length = 0;
      redoStack.length = 0;
      emitHistory();
    },

    /* persistence primitives */
    serialize: () => JSON.stringify(state, null, 2),
    load(input, opts = {}) {
      let obj = input;
      if (typeof input === 'string') {
        try {
          obj = JSON.parse(input);
        } catch (e) {
          return { ok: false, errors: ['File is not valid JSON.'] };
        }
      }
      const res = validate(obj);
      if (!res.ok) return res;
      store.reset(res.value);
      A.bus.emit('project:loaded', { state, source: opts.source || 'load' });
      return { ok: true, errors: res.errors };
    },
    reset(next) {
      state = clone(next);
      txnSnapshot = null;
      store.clearHistory();
      selection = [];
      A.bus.emit('selection:changed', { ids: [] });
      emitState('reset');
    },
  };

  A.store = store;
})();
</script>
<script>
/* === src/persistence.js === */
/* Arch2D — WS1: JSON save/load, localStorage autosave and API-key storage (project.md §5). */
(function () {
  'use strict';
  const A = window.Arch2D;
  const AUTOSAVE_KEY = 'arch2d_autosave';
  const SECRET_PREFIX = 'arch2d_secret_';

  function safeStorage() {
    try {
      const k = '__arch2d_probe__';
      localStorage.setItem(k, '1');
      localStorage.removeItem(k);
      return localStorage;
    } catch (e) {
      return null; // private mode / blocked storage: app still works, just without autosave
    }
  }
  const storage = safeStorage();

  function fileName() {
    const name = (A.store.getState().name || 'arch2d')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-|-$/g, '')
      .slice(0, 40) || 'arch2d';
    const ts = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '');
    return `${name}-${ts}.arch2d.json`;
  }

  const persistence = {
    available: !!storage,

    /** Saves the project; the wall photo (if any) is embedded so the file is self-contained. */
    saveToFile() {
      const state = A.store.getState();
      let json = A.store.serialize();
      const dataUrl = state.wallPhoto && A.photo ? A.photo.dataUrl(state.wallPhoto.id) : null;
      if (dataUrl) {
        const obj = JSON.parse(json);
        obj.wallPhoto.dataUrl = dataUrl;
        json = JSON.stringify(obj, null, 2);
      }
      const blob = new Blob([json], { type: 'application/json' });
      A.util.downloadBlob(blob, fileName());
    },

    /** Opens a file picker and loads the chosen project. Resolves {ok, errors, cancelled}. */
    openFile(inputEl) {
      return new Promise((resolve) => {
        const input = inputEl || Object.assign(document.createElement('input'), { type: 'file', accept: '.json,application/json' });
        const onChange = () => {
          input.removeEventListener('change', onChange);
          const file = input.files && input.files[0];
          input.value = '';
          if (!file) return resolve({ ok: false, cancelled: true, errors: [] });
          if (file.size > 5 * 1024 * 1024) return resolve({ ok: false, errors: ['File is larger than 5 MB — not an Arch2D project.'] });
          const reader = new FileReader();
          reader.onload = () => {
            let obj;
            try {
              obj = JSON.parse(String(reader.result));
            } catch (e) {
              return resolve({ ok: false, errors: ['File is not valid JSON.'] });
            }
            // Move an embedded photo into the photo library; State keeps only the id.
            if (obj && obj.wallPhoto && obj.wallPhoto.dataUrl && A.photo) {
              const id = A.photo.register(obj.wallPhoto.dataUrl);
              obj.wallPhoto = id ? Object.assign({}, obj.wallPhoto, { id, dataUrl: undefined }) : null;
            }
            resolve(A.store.load(obj, { source: 'file' }));
          };
          reader.onerror = () => resolve({ ok: false, errors: ['Could not read the file.'] });
          reader.readAsText(file);
        };
        input.addEventListener('change', onChange);
        input.click();
      });
    },

    hasAutosave() {
      return !!(storage && storage.getItem(AUTOSAVE_KEY));
    },
    readAutosave() {
      if (!storage) return null;
      try {
        const res = A.store.validate(JSON.parse(storage.getItem(AUTOSAVE_KEY)));
        return res.ok ? res.value : null;
      } catch (e) {
        return null;
      }
    },
    clearAutosave() {
      if (storage) storage.removeItem(AUTOSAVE_KEY);
    },
    writeAutosave() {
      if (!storage) return false;
      try {
        storage.setItem(AUTOSAVE_KEY, JSON.stringify(A.store.getState()));
        if (A.photo) A.photo.syncStorage(A.store.getState());
        A.bus.emit('autosave:written', { at: Date.now() });
        return true;
      } catch (e) {
        console.warn('[Arch2D] autosave failed', e);
        return false;
      }
    },
    startAutosave() {
      const write = A.util.debounce(() => persistence.writeAutosave(), 400);
      A.bus.on('state:changed', write);
    },

    /* API keys — localStorage is NOT a secure vault (project.md §2 Security Note). */
    getSecret(k) {
      return storage ? storage.getItem(SECRET_PREFIX + k) || '' : '';
    },
    setSecret(k, v) {
      if (!storage) return;
      if (v) storage.setItem(SECRET_PREFIX + k, v);
      else storage.removeItem(SECRET_PREFIX + k);
    },
    getJSON(k, fallback) {
      if (!storage) return fallback;
      try {
        const v = storage.getItem('arch2d_' + k);
        return v ? JSON.parse(v) : fallback;
      } catch (e) {
        return fallback;
      }
    },
    setJSON(k, v) {
      if (storage) storage.setItem('arch2d_' + k, JSON.stringify(v));
    },
  };

  A.persistence = persistence;
})();
</script>
<script>
/* === src/photo.js === */
/* Arch2D — Wall photo library: decode, 4-corner perspective rectification, storage.
   The State only holds a small reference { id, visible, showOnExport }. Image bytes live
   here (in memory + one localStorage key), so undo snapshots stay small and drags stay fast.
   Photos come from <input type="file"> as data URLs, so they never taint the canvas. */
(function () {
  'use strict';
  const A = window.Arch2D;
  const U = A.util;

  const STORAGE_KEY = 'arch2d_wallphoto';
  const SOURCE_MAX = 2400; // longest side kept for the calibration step (memory only)
  const OUTPUT_MAX = 1600; // longest side of the rectified wall image (≈4 px/cm on a 4 m wall)
  const JPEG_QUALITY = 0.82;

  // id -> { dataUrl, img, ready, luminance, source?: HTMLCanvasElement, corners?: [{x,y}×4] }
  const library = new Map();

  /* ---------- decoding & ingestion ---------- */
  function pickFile() {
    return new Promise((resolve) => {
      const input = Object.assign(document.createElement('input'), {
        type: 'file',
        accept: 'image/jpeg,image/png,image/webp,image/heic,image/heif,image/*',
      });
      input.addEventListener('change', () => resolve((input.files && input.files[0]) || null));
      input.addEventListener('cancel', () => resolve(null));
      input.click();
    });
  }

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('decode'));
      img.src = src;
    });
  }

  /** File → downscaled source canvas. Browsers apply EXIF orientation. */
  async function ingest(file) {
    if (!file || !/^image\//.test(file.type || 'image/')) throw new Error('not-image');
    const url = URL.createObjectURL(file);
    try {
      const img = await loadImage(url);
      const scale = Math.min(1, SOURCE_MAX / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * scale));
      c.height = Math.max(1, Math.round(img.naturalHeight * scale));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return c;
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  /** Direct upload flow: shows full uncropped photo in the black workspace immediately. */
  async function upload() {
    try {
      const file = await pickFile();
      if (!file) return null;
      const source = await ingest(file);
      const dataUrl = source.toDataURL('image/jpeg', JPEG_QUALITY);
      const id = register(dataUrl, {
        source,
        aspect: source.width / source.height,
        luminance: measureLuminanceCanvas(source),
      });
      if (!id) throw new Error('register-failed');
      A.store.setWallPhoto({ id, visible: true, showOnExport: false });
      if (A.ui) A.ui.toast('📷 Wall photo loaded as background', 'success');
      if (A.canvas) A.canvas.fit();
      return id;
    } catch (err) {
      console.error('[Arch2D] photo upload failed', err);
      if (A.ui) A.ui.toast('Could not load photo. Please choose a JPEG or PNG.', 'error');
      return null;
    }
  }

  /* ---------- perspective math ---------- */
  /** Homography mapping the unit square (u,v) → quad [TL, TR, BR, BL] (Heckbert's square-to-quad). */
  function squareToQuad(q) {
    const [p0, p1, p2, p3] = q;
    const dx1 = p1.x - p2.x, dx2 = p3.x - p2.x, dx3 = p0.x - p1.x + p2.x - p3.x;
    const dy1 = p1.y - p2.y, dy2 = p3.y - p2.y, dy3 = p0.y - p1.y + p2.y - p3.y;
    let g = 0, h = 0;
    if (Math.abs(dx3) > 1e-9 || Math.abs(dy3) > 1e-9) {
      const den = dx1 * dy2 - dx2 * dy1;
      g = (dx3 * dy2 - dx2 * dy3) / den;
      h = (dx1 * dy3 - dx3 * dy1) / den;
    }
    const a = p1.x - p0.x + g * p1.x, b = p3.x - p0.x + h * p3.x, c = p0.x;
    const d = p1.y - p0.y + g * p1.y, e = p3.y - p0.y + h * p3.y, f = p0.y;
    return (u, v) => {
      const w = g * u + h * v + 1;
      return { x: (a * u + b * v + c) / w, y: (d * u + e * v + f) / w };
    };
  }

  /** True when the quad [TL, TR, BR, BL] is convex and not self-intersecting. */
  function isConvexQuad(q) {
    let sign = 0;
    for (let i = 0; i < 4; i++) {
      const a = q[i], b = q[(i + 1) % 4], c = q[(i + 2) % 4];
      const cross = (b.x - a.x) * (c.y - b.y) - (b.y - a.y) * (c.x - b.x);
      if (Math.abs(cross) < 1e-6) return false;
      const s = Math.sign(cross);
      if (sign && s !== sign) return false;
      sign = s;
    }
    return true;
  }

  /**
   * Warps the entire source photo using the perspective homography defined by `corners` -> wall rectangle.
   * Unlike a naive crop, the wall quad aligns to [0, 1]x[0, 1], while the ENTIRE rest of the room
   * (ceiling, floor, adjacent walls) remains 100% visible around the wall!
   */
  function rectify(source, corners, wallW, wallH) {
    const sw = source.width, sh = source.height;
    const [p0, p1, p2, p3] = corners;

    // 1. Forward homography H: (u, v) -> (x, y)
    const dx1 = p1.x - p2.x, dx2 = p3.x - p2.x, dx3 = p0.x - p1.x + p2.x - p3.x;
    const dy1 = p1.y - p2.y, dy2 = p3.y - p2.y, dy3 = p0.y - p1.y + p2.y - p3.y;
    let g = 0, h = 0;
    if (Math.abs(dx3) > 1e-9 || Math.abs(dy3) > 1e-9) {
      const den = dx1 * dy2 - dx2 * dy1;
      g = (dx3 * dy2 - dx2 * dy3) / den;
      h = (dx1 * dy3 - dx3 * dy1) / den;
    }
    const a = p1.x - p0.x + g * p1.x, b = p3.x - p0.x + h * p3.x, c = p0.x;
    const d = p1.y - p0.y + g * p1.y, e = p3.y - p0.y + h * p3.y, f = p0.y;

    // 2. Inverse homography Hinv: (x, y) -> (u, v)
    const m00 = e - f * h, m01 = c * h - b, m02 = b * f - c * e;
    const m10 = f * g - d, m11 = a - c * g, m12 = c * d - a * f;
    const m20 = d * h - e * g, m21 = b * g - a * h, m22 = a * e - b * d;
    const det = a * m00 + b * m10 + c * m20;

    function invertPoint(px, py) {
      if (Math.abs(det) < 1e-12) return { u: px / sw, v: py / sh };
      let w = m20 * px + m21 * py + m22;
      let u = m00 * px + m01 * py + m02;
      let v = m10 * px + m11 * py + m12;
      if (det < 0) { w = -w; u = -u; v = -v; }
      if (w <= 1e-6) w = 1e-6;
      return { u: u / w, v: v / w };
    }

    // 3. Find the maximal inner crop containing the wall [0, 1] x [0, 1]
    // that contains 100% valid photo pixels with ZERO empty / askewed areas.
    const pad = 1.0;
    const halfPlanes = [
      { A: a - pad * g, B: b - pad * h, C: c - pad }, // x >= pad
      { A: (sw - pad) * g - a, B: (sw - pad) * h - b, C: (sw - pad) - c }, // x <= sw - pad
      { A: d - pad * g, B: e - pad * h, C: f - pad }, // y >= pad
      { A: (sh - pad) * g - d, B: (sh - pad) * h - e, C: (sh - pad) - f }, // y <= sh - pad
      { A: g, B: h, C: 1 - 0.05 } // w >= 0.05
    ];

    function getLimits(u0, u1, v0, v1) {
      let uMinLim = -10, uMaxLim = 10, vMinLim = -10, vMaxLim = 10;
      for (let k = 0; k < halfPlanes.length; k++) {
        const hp = halfPlanes[k];
        const vTerm = Math.min(hp.B * v0, hp.B * v1);
        const uTerm = Math.min(hp.A * u0, hp.A * u1);
        if (hp.A > 1e-7) {
          const bound = -(vTerm + hp.C) / hp.A;
          if (bound > uMinLim) uMinLim = bound;
        } else if (hp.A < -1e-7) {
          const bound = (vTerm + hp.C) / (-hp.A);
          if (bound < uMaxLim) uMaxLim = bound;
        }
        if (hp.B > 1e-7) {
          const bound = -(uTerm + hp.C) / hp.B;
          if (bound > vMinLim) vMinLim = bound;
        } else if (hp.B < -1e-7) {
          const bound = (uTerm + hp.C) / (-hp.B);
          if (bound < vMaxLim) vMaxLim = bound;
        }
      }
      return { uMinLim, uMaxLim, vMinLim, vMaxLim };
    }

    let uMin = 0, uMax = 1, vMin = 0, vMax = 1;
    for (let iter = 0; iter < 40; iter++) {
      const lim = getLimits(uMin, uMax, vMin, vMax);
      if (lim.uMinLim < uMin) uMin += (lim.uMinLim - uMin) * 0.25;
      if (lim.uMaxLim > uMax) uMax += (lim.uMaxLim - uMax) * 0.25;
      if (lim.vMinLim < vMin) vMin += (lim.vMinLim - vMin) * 0.25;
      if (lim.vMaxLim > vMax) vMax += (lim.vMaxLim - vMax) * 0.25;
    }

    const finalLim = getLimits(uMin, uMax, vMin, vMax);
    if (uMin < finalLim.uMinLim) uMin = finalLim.uMinLim;
    if (uMax > finalLim.uMaxLim) uMax = finalLim.uMaxLim;
    if (vMin < finalLim.vMinLim) vMin = finalLim.vMinLim;
    if (vMax > finalLim.vMaxLim) vMax = finalLim.vMaxLim;

    const spanU = uMax - uMin;
    const spanV = vMax - vMin;

    const aspect = (spanU * wallW) / (spanV * wallH);
    const outW = aspect >= 1 ? OUTPUT_MAX : Math.max(300, Math.round(OUTPUT_MAX * aspect));
    const outH = aspect >= 1 ? Math.max(300, Math.round(OUTPUT_MAX / aspect)) : OUTPUT_MAX;

    const src = source.getContext('2d').getImageData(0, 0, sw, sh).data;
    const out = document.createElement('canvas');
    out.width = outW;
    out.height = outH;
    const octx = out.getContext('2d');
    const img = octx.createImageData(outW, outH);
    const dst = img.data;

    let lumSum = 0, lumN = 0;

    for (let j = 0; j < outH; j++) {
      const v = vMin + ((j + 0.5) / outH) * spanV;
      for (let i = 0; i < outW; i++) {
        const u = uMin + ((i + 0.5) / outW) * spanU;
        const w = g * u + h * v + 1;
        const o = (j * outW + i) * 4;

        if (w <= 0.001) {
          // Beyond horizon: seamless workspace background #0b0d11
          dst[o] = 11; dst[o + 1] = 13; dst[o + 2] = 17; dst[o + 3] = 255;
          continue;
        }

        const px = (a * u + b * v + c) / w;
        const py = (d * u + e * v + f) / w;
        const x = px - 0.5, y = py - 0.5;
        const x0 = Math.floor(x), y0 = Math.floor(y);

        if (x0 < 0 || y0 < 0 || x0 + 1 >= sw || y0 + 1 >= sh) {
          // Outside source photo: seamless workspace background #0b0d11
          dst[o] = 11; dst[o + 1] = 13; dst[o + 2] = 17; dst[o + 3] = 255;
          continue;
        }

        const fx = x - x0, fy = y - y0;
        const i00 = (y0 * sw + x0) * 4, i10 = i00 + 4, i01 = i00 + sw * 4, i11 = i01 + 4;
        for (let ch = 0; ch < 3; ch++) {
          const top = src[i00 + ch] + (src[i10 + ch] - src[i00 + ch]) * fx;
          const bot = src[i01 + ch] + (src[i11 + ch] - src[i01 + ch]) * fx;
          dst[o + ch] = top + (bot - top) * fy;
        }
        dst[o + 3] = 255;

        // Luminance sampled within the wall envelope [0, 1]x[0, 1]
        if (u >= 0 && u <= 1 && v >= 0 && v <= 1 && (i & 15) === 0 && (j & 15) === 0) {
          lumSum += (0.2126 * dst[o] + 0.7152 * dst[o + 1] + 0.0722 * dst[o + 2]) / 255;
          lumN++;
        }
      }
    }

    octx.putImageData(img, 0, 0);

    const bounds = {
      uMin,
      uMax,
      vMin,
      vMax,
      xCm: uMin * wallW,
      yCm: (1 - vMax) * wallH,
      wCm: spanU * wallW,
      hCm: spanV * wallH,
    };

    return {
      dataUrl: out.toDataURL('image/jpeg', JPEG_QUALITY),
      luminance: lumN ? lumSum / lumN : 0.5,
      bounds,
    };
  }

  /* ---------- library ---------- */
  function idFor(dataUrl) {
    return 'ph_' + U.hashString(dataUrl).toString(36) + dataUrl.length.toString(36);
  }

  /** Adds a data URL to the library and returns its id. Safe to call repeatedly. */
  function register(dataUrl, extra = {}) {
    if (typeof dataUrl !== 'string' || !/^data:image\/(jpeg|png|webp);base64,/.test(dataUrl)) return null;
    const id = idFor(dataUrl);
    let entry = library.get(id);
    if (!entry) {
      entry = {
        dataUrl,
        img: null,
        ready: false,
        aspect: extra.aspect || 1,
        luminance: extra.luminance == null ? 0.5 : extra.luminance,
      };
      library.set(id, entry);
      loadImage(dataUrl)
        .then((img) => {
          entry.img = img;
          entry.ready = true;
          entry.aspect = img.naturalWidth / img.naturalHeight;
          if (extra.luminance == null) entry.luminance = measureLuminance(img);
          A.bus.emit('photo:ready', { id });
        })
        .catch(() => library.delete(id));
    }
    if (extra.source) {
      entry.source = extra.source;
      if (extra.source.width && extra.source.height) {
        entry.aspect = extra.source.width / extra.source.height;
      }
    }
    if (extra.aspect) entry.aspect = extra.aspect;
    if (extra.bounds) entry.bounds = extra.bounds;
    if (extra.corners) entry.corners = extra.corners.map((c) => ({ x: c.x, y: c.y }));
    return id;
  }

  function measureLuminance(img) {
    const c = document.createElement('canvas');
    c.width = c.height = 16;
    const x = c.getContext('2d');
    x.drawImage(img, 0, 0, 16, 16);
    const d = x.getImageData(0, 0, 16, 16).data;
    let s = 0;
    for (let i = 0; i < d.length; i += 4) s += (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255;
    return s / 256;
  }

  function measureLuminanceCanvas(canvas) {
    try {
      const sw = canvas.width, sh = canvas.height;
      const ctx = canvas.getContext('2d');
      const d = ctx.getImageData(0, 0, sw, sh).data;
      let s = 0, n = 0;
      const step = Math.max(1, Math.floor(d.length / 4 / 256));
      for (let i = 0; i < d.length; i += step * 4) {
        s += (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255;
        n++;
      }
      return n ? s / n : 0.5;
    } catch (e) {
      return 0.5;
    }
  }

  /* ---------- storage (one localStorage slot for the current photo) ---------- */
  function readStored() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  let storedId = (readStored() || {}).id || null;
  let quotaWarned = false;

  /** Keeps the single storage slot in sync with the photo referenced by the current state. */
  function syncStorage(state) {
    const id = state.wallPhoto ? state.wallPhoto.id : null;
    if (id === storedId) return true;
    try {
      if (!id) {
        localStorage.removeItem(STORAGE_KEY);
        storedId = null;
        return true;
      }
      const entry = library.get(id);
      if (!entry) return false; // not decoded yet; next autosave retries
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ id, dataUrl: entry.dataUrl }));
      storedId = id;
      return true;
    } catch (e) {
      if (!quotaWarned && A.ui) {
        quotaWarned = true;
        A.ui.toast('Browser storage is full: the wall photo will not survive a reload. Use 💾 Save to keep it.', 'error');
      }
      return false;
    }
  }

  /** Loads the stored photo into the library (called once at startup). */
  function restoreFromStorage() {
    const s = readStored();
    if (s && s.dataUrl) register(s.dataUrl);
  }

  A.photo = {
    pickFile,
    upload,
    ingest,
    rectify,
    isConvexQuad,
    squareToQuad,
    register,
    restoreFromStorage,
    syncStorage,
    has: (id) => library.has(id),
    /** Ready HTMLImageElement for drawing, or null while decoding / unknown id. */
    image: (id) => {
      const e = id && library.get(id);
      return e && e.ready ? e.img : null;
    },
    aspect: (id) => {
      const e = id && library.get(id);
      if (!e) return 1;
      if (e.img && e.img.naturalWidth && e.img.naturalHeight) return e.img.naturalWidth / e.img.naturalHeight;
      if (e.source && e.source.width && e.source.height) return e.source.width / e.source.height;
      return e.aspect || 1;
    },
    dataUrl: (id) => {
      const e = id && library.get(id);
      return e ? e.dataUrl : null;
    },
    luminance: (id) => {
      const e = id && library.get(id);
      return e ? e.luminance : 0.5;
    },
    bounds: (id) => {
      const e = id && library.get(id);
      return (e && e.bounds) || null;
    },
    /** Original photo + corners, available only in the session where it was uploaded. */
    calibration: (id) => {
      const e = id && library.get(id);
      return e && e.source ? { source: e.source, corners: e.corners } : null;
    },
  };

  restoreFromStorage();
})();
</script>
<script>
/* === src/photo-calibrate.js === */
/* Arch2D — Wall photo upload & 4-corner calibration modal.
   Flow: pick image → mark wall corners (perspective grid + magnifier) → rectify to the
   wall's W×H → store reference in State (one undo step). Owns its own modal DOM. */
(function () {
  'use strict';
  const A = window.Arch2D;
  const U = A.util;

  const HANDLE_R = 9;
  const HIT_R = 24; // generous for touch
  const MARGIN = 40; // lets handles go slightly past the photo edge
  const LOUPE = 132;
  const LOUPE_ZOOM = 3;
  const CORNER_LABELS = ['Top-left', 'Top-right', 'Bottom-right', 'Bottom-left'];

  function pickFile() {
    return new Promise((resolve) => {
      const input = Object.assign(document.createElement('input'), {
        type: 'file',
        accept: 'image/jpeg,image/png,image/webp,image/heic,image/heif,image/*',
      });
      input.addEventListener('change', () => resolve((input.files && input.files[0]) || null));
      input.addEventListener('cancel', () => resolve(null));
      input.click();
    });
  }

  /**
   * Opens the calibration modal.
   * Resolves { corners, wallWidth, wallHeight, dataUrl, luminance } or null when cancelled.
   */
  function open({ source, corners, wallWidth, wallHeight }) {
    return new Promise((resolve) => {
      const sw = source.width, sh = source.height;
      let pts = corners && corners.length === 4
        ? corners.map((c) => ({ x: c.x, y: c.y }))
        : [
            { x: 0, y: 0 },
            { x: sw, y: 0 },
            { x: sw, y: sh },
            { x: 0, y: sh },
          ];
      let active = -1; // handle being dragged
      let focusIdx = 0; // handle nudged by arrow keys
      let grabOffset = { x: 0, y: 0 };
      let view = { scale: 1, ox: 0, oy: 0, cw: 0, ch: 0, dpr: 1 };
      let busy = false;

      /* ----- DOM ----- */
      const canvas = U.h('canvas', { class: 'calib-canvas', id: 'calib-canvas' });
      const stage = U.h('div', { class: 'calib-stage' }, canvas);
      const inputW = U.h('input', { type: 'number', class: 'input', id: 'calib-wall-width', min: '50', max: '5000', value: Math.round(wallWidth) });
      const inputH = U.h('input', { type: 'number', class: 'input', id: 'calib-wall-height', min: '50', max: '2000', value: Math.round(wallHeight) });
      const btnApply = U.h('button', { class: 'btn primary', id: 'btn-calib-apply', onclick: apply }, '✓ Apply photo');
      const btnCancel = U.h('button', { class: 'btn ghost', id: 'btn-calib-cancel', onclick: () => close(null) }, 'Cancel');
      const btnReset = U.h('button', { class: 'btn ghost sm', id: 'btn-calib-reset', onclick: resetCorners }, '↺ Reset corners');

      const side = U.h(
        'div',
        { class: 'calib-side' },
        U.h('div', { class: 'section-heading' }, 'How to calibrate'),
        U.h(
          'ol',
          { class: 'calib-steps' },
          U.h('li', null, 'Drag each handle onto a corner of the wall: where it meets the ceiling and the floor.'),
          U.h('li', null, 'If a corner is hidden (furniture, curtains), place it where the corner would be. Handles can go slightly past the photo edge.'),
          U.h('li', null, 'Check that the blue grid follows the wall lines (skirting board, ceiling edge).')
        ),
        U.h('div', { class: 'section-heading', style: { marginTop: '6px' } }, 'Real wall size (cm)'),
        U.h(
          'div',
          { class: 'form-row' },
          U.h('div', { class: 'form-field' }, U.h('label', { class: 'form-label', for: 'calib-wall-width' }, 'Width'), inputW),
          U.h('div', { class: 'form-field' }, U.h('label', { class: 'form-label', for: 'calib-wall-height' }, 'Height'), inputH)
        ),
        U.h('div', { class: 'calib-note' }, 'Measure the wall: the cm grid and every dimension depend on these two numbers.'),
        btnReset,
        U.h('div', { class: 'calib-note' }, 'Tip: arrow keys move the last handle by 1 px (Shift = 10 px).'),
        U.h('div', { class: 'calib-actions' }, btnCancel, btnApply)
      );

      const modal = U.h(
        'div',
        { class: 'studio-modal calib-modal', id: 'calib-modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Mark the wall corners' },
        U.h(
          'div',
          { class: 'studio-header' },
          U.h('div', { class: 'studio-title' }, U.h('span', null, '📷'), U.h('span', null, 'Mark the wall corners')),
          U.h('button', { class: 'icon-btn', title: 'Cancel (Esc)', 'aria-label': 'Cancel', onclick: () => close(null) }, '✕')
        ),
        U.h('div', { class: 'calib-body' }, stage, side)
      );
      const backdrop = U.h('div', { class: 'modal-backdrop open', id: 'calib-backdrop' }, modal);
      document.body.appendChild(backdrop);

      const ctx = canvas.getContext('2d');
      const ro = new ResizeObserver(layout);
      ro.observe(stage);
      document.addEventListener('keydown', onKey, true);
      canvas.addEventListener('pointerdown', onDown);
      canvas.addEventListener('pointermove', onMove);
      canvas.addEventListener('pointerup', onUp);
      canvas.addEventListener('pointercancel', onUp);

      /* ----- geometry ----- */
      function layout() {
        const r = stage.getBoundingClientRect();
        view.dpr = window.devicePixelRatio || 1;
        view.cw = Math.max(100, Math.floor(r.width));
        view.ch = Math.max(100, Math.floor(r.height));
        canvas.width = Math.round(view.cw * view.dpr);
        canvas.height = Math.round(view.ch * view.dpr);
        canvas.style.width = view.cw + 'px';
        canvas.style.height = view.ch + 'px';
        view.scale = Math.min((view.cw - MARGIN * 2) / sw, (view.ch - MARGIN * 2) / sh);
        view.ox = (view.cw - sw * view.scale) / 2;
        view.oy = (view.ch - sh * view.scale) / 2;
        draw();
      }
      const toScreen = (p) => ({ x: view.ox + p.x * view.scale, y: view.oy + p.y * view.scale });
      const toImage = (x, y) => ({ x: (x - view.ox) / view.scale, y: (y - view.oy) / view.scale });
      function clampImage(p) {
        const m = MARGIN / view.scale;
        return { x: U.clamp(p.x, -m, sw + m), y: U.clamp(p.y, -m, sh + m) };
      }
      function localPoint(e) {
        const r = canvas.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      }

      /* ----- drawing ----- */
      function draw() {
        const { cw, ch, dpr } = view;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = '#07090c';
        ctx.fillRect(0, 0, cw, ch);
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(source, view.ox, view.oy, sw * view.scale, sh * view.scale);

        const s = pts.map(toScreen);
        const convex = A.photo.isConvexQuad(pts);

        // Dim everything outside the wall quad.
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, cw, ch);
        ctx.moveTo(s[0].x, s[0].y);
        for (let i = 1; i < 4; i++) ctx.lineTo(s[i].x, s[i].y);
        ctx.closePath();
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fill('evenodd');
        ctx.restore();

        // Perspective grid: shows how the photo will be straightened.
        if (convex) {
          const map = A.photo.squareToQuad(pts);
          ctx.save();
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.55)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          for (let k = 1; k < 8; k++) {
            const t = k / 8;
            const a = toScreen(map(t, 0)), b = toScreen(map(t, 1));
            const c = toScreen(map(0, t)), d = toScreen(map(1, t));
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.moveTo(c.x, c.y);
            ctx.lineTo(d.x, d.y);
          }
          ctx.stroke();
          ctx.restore();
        }

        // Quad outline
        ctx.save();
        ctx.strokeStyle = convex ? 'hsl(190, 85%, 60%)' : 'hsl(4, 72%, 62%)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(s[0].x, s[0].y);
        for (let i = 1; i < 4; i++) ctx.lineTo(s[i].x, s[i].y);
        ctx.closePath();
        ctx.stroke();
        ctx.restore();

        // Handles + labels
        s.forEach((p, i) => {
          const hot = i === active || (active < 0 && i === focusIdx);
          ctx.save();
          ctx.beginPath();
          ctx.arc(p.x, p.y, HANDLE_R, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(11, 15, 23, 0.9)';
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = hot ? 'hsl(36, 70%, 62%)' : 'hsl(190, 85%, 60%)';
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(p.x - 4, p.y);
          ctx.lineTo(p.x + 4, p.y);
          ctx.moveTo(p.x, p.y - 4);
          ctx.lineTo(p.x, p.y + 4);
          ctx.stroke();
          // label pill, pushed outward from the quad centre
          const cx = (s[0].x + s[1].x + s[2].x + s[3].x) / 4, cy = (s[0].y + s[1].y + s[2].y + s[3].y) / 4;
          const dx = p.x - cx, dy = p.y - cy, len = Math.hypot(dx, dy) || 1;
          const lx = p.x + (dx / len) * 26, ly = p.y + (dy / len) * 22;
          ctx.font = "600 11px Inter, sans-serif";
          const tw = ctx.measureText(CORNER_LABELS[i]).width;
          ctx.fillStyle = 'rgba(11, 15, 23, 0.9)';
          A.render.roundRect(ctx, lx - tw / 2 - 6, ly - 9, tw + 12, 18, 5);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(CORNER_LABELS[i], lx, ly + 0.5);
          ctx.restore();
        });

        if (active >= 0) drawLoupe(pts[active], s[active]);

        btnApply.disabled = busy || !convex;
        btnApply.title = convex ? '' : 'The corners cross over. Put them in order: top-left, top-right, bottom-right, bottom-left.';
      }

      function drawLoupe(p, sp) {
        // Sit in the top corner away from the handle, so the finger/cursor never covers it.
        const pad = 12;
        const lx = sp.x < view.cw / 2 ? view.cw - LOUPE - pad : pad;
        const ly = pad;
        const span = LOUPE / (view.scale * LOUPE_ZOOM); // image px shown
        ctx.save();
        ctx.beginPath();
        ctx.arc(lx + LOUPE / 2, ly + LOUPE / 2, LOUPE / 2, 0, Math.PI * 2);
        ctx.fillStyle = '#07090c';
        ctx.fill();
        ctx.clip();
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(source, p.x - span / 2, p.y - span / 2, span, span, lx, ly, LOUPE, LOUPE);
        ctx.strokeStyle = 'hsl(36, 70%, 62%)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(lx + LOUPE / 2, ly);
        ctx.lineTo(lx + LOUPE / 2, ly + LOUPE);
        ctx.moveTo(lx, ly + LOUPE / 2);
        ctx.lineTo(lx + LOUPE, ly + LOUPE / 2);
        ctx.stroke();
        ctx.restore();
        ctx.save();
        ctx.beginPath();
        ctx.arc(lx + LOUPE / 2, ly + LOUPE / 2, LOUPE / 2, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,0.85)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      }

      /* ----- interaction ----- */
      function nearestHandle(x, y) {
        let best = -1, bestD = HIT_R;
        pts.forEach((p, i) => {
          const s = toScreen(p);
          const d = Math.hypot(s.x - x, s.y - y);
          if (d < bestD) {
            bestD = d;
            best = i;
          }
        });
        return best;
      }
      function onDown(e) {
        const lp = localPoint(e);
        const i = nearestHandle(lp.x, lp.y);
        if (i < 0) return;
        active = focusIdx = i;
        const s = toScreen(pts[i]);
        grabOffset = { x: s.x - lp.x, y: s.y - lp.y };
        canvas.setPointerCapture(e.pointerId);
        canvas.style.cursor = 'grabbing';
        draw();
      }
      function onMove(e) {
        const lp = localPoint(e);
        if (active < 0) {
          canvas.style.cursor = nearestHandle(lp.x, lp.y) >= 0 ? 'grab' : 'crosshair';
          return;
        }
        pts[active] = clampImage(toImage(lp.x + grabOffset.x, lp.y + grabOffset.y));
        draw();
      }
      function onUp(e) {
        if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
        active = -1;
        canvas.style.cursor = 'crosshair';
        draw();
      }
      function onKey(e) {
        if (e.key === 'Escape') {
          e.preventDefault();
          e.stopPropagation();
          close(null);
          return;
        }
        if (e.key === 'Enter') {
          e.preventDefault();
          e.stopPropagation();
          apply();
          return;
        }
        if (U.isTypingTarget(e.target)) return;
        const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
        if (!d) return;
        e.preventDefault();
        e.stopPropagation(); // keep the main canvas from nudging elements
        const step = e.shiftKey ? 10 : 1;
        pts[focusIdx] = clampImage({ x: pts[focusIdx].x + d[0] * step, y: pts[focusIdx].y + d[1] * step });
        draw();
      }
      function resetCorners() {
        pts = [
          { x: 0, y: 0 },
          { x: sw, y: 0 },
          { x: sw, y: sh },
          { x: 0, y: sh },
        ];
        draw();
      }

      function apply() {
        if (busy) return;
        if (!A.photo.isConvexQuad(pts)) {
          A.ui.toast('The corners cross over. Put them in order: top-left, top-right, bottom-right, bottom-left.', 'error');
          return;
        }
        const w = U.clamp(parseFloat(inputW.value) || 0, 50, 5000);
        const h = U.clamp(parseFloat(inputH.value) || 0, 50, 2000);
        if (!w || !h) {
          A.ui.toast('Enter the real wall width and height in cm.', 'error');
          return;
        }
        busy = true;
        btnApply.textContent = '⏳ Straightening…';
        draw();
        // Let the button repaint before the synchronous warp.
        setTimeout(() => {
          try {
            const out = A.photo.rectify(source, pts, w, h);
            close({
              corners: pts.map((p) => ({ x: p.x, y: p.y })),
              wallWidth: w,
              wallHeight: h,
              dataUrl: out.dataUrl,
              luminance: out.luminance,
              bounds: out.bounds,
            });
          } catch (err) {
            console.error('[Arch2D] rectify failed', err);
            busy = false;
            btnApply.textContent = '✓ Apply photo';
            draw();
            A.ui.toast('Could not process this photo. Try a smaller image.', 'error');
          }
        }, 30);
      }

      function close(result) {
        ro.disconnect();
        document.removeEventListener('keydown', onKey, true);
        backdrop.remove();
        resolve(result);
      }
    });
  }

  /* ---------- flows used by the sidebar ---------- */
  async function calibrateAndApply(source, corners) {
    const st = A.store.getState();
    const res = await open({ source, corners, wallWidth: st.wallWidth, wallHeight: st.wallHeight });
    if (!res) return false;
    const id = A.photo.register(res.dataUrl, {
      luminance: res.luminance,
      source,
      corners: res.corners,
      bounds: res.bounds,
      aspect: res.bounds ? res.bounds.wCm / res.bounds.hCm : res.wallWidth / res.wallHeight,
    });
    if (!id) {
      A.ui.toast('Could not store the processed photo.', 'error');
      return false;
    }
    const prev = st.wallPhoto;
    A.store.begin(); // wall size + photo = one undo step
    if (res.wallWidth !== st.wallWidth || res.wallHeight !== st.wallHeight) {
      A.store.setWall({ wallWidth: res.wallWidth, wallHeight: res.wallHeight });
    }
    A.store.setWallPhoto({ id, visible: true, showOnExport: prev ? prev.showOnExport : false, bounds: res.bounds });
    A.store.commit();
    A.canvas.fit();
    A.ui.toast('Wall photo calibrated. Entire room photo is visible.', 'success');
    return true;
  }

  async function upload() {
    const file = await pickFile();
    if (!file) return false;
    let source;
    try {
      source = await A.photo.ingest(file);
    } catch (e) {
      const heic = /hei[cf]/i.test(file.type) || /\.hei[cf]$/i.test(file.name || '');
      A.ui.toast(
        heic
          ? 'This browser cannot read HEIC photos. Export the photo as JPG (on iPhone: Settings → Camera → Formats → Most Compatible).'
          : 'Could not read this image. Use a JPG, PNG or WebP photo.',
        'error'
      );
      return false;
    }
    return calibrateAndApply(source, null);
  }

  /** Re-open calibration for the current photo. */
  async function adjust() {
    const p = A.store.getState().wallPhoto;
    if (!p) return upload();
    const cal = A.photo.calibration(p.id);
    let source = cal && cal.source;
    if (!source) {
      const img = A.photo.image(p.id);
      if (!img) {
        A.ui.toast('Photo is still loading…', 'info');
        return false;
      }
      source = document.createElement('canvas');
      source.width = img.naturalWidth || img.width;
      source.height = img.naturalHeight || img.height;
      source.getContext('2d').drawImage(img, 0, 0);
    }
    return calibrateAndApply(source, cal && cal.corners);
  }

  A.photoCalibrate = { open, upload, adjust, pickFile };
})();
</script>
<script>
/* === src/textures.js === */
/* Arch2D — WS3: procedural Canvas 2D textures (project.md §3.7). No SVG, no external
   images, so export via toDataURL() can never be tainted. Deterministic per element id. */
(function () {
  'use strict';
  const A = window.Arch2D;
  const U = A.util;

  const cache = new Map(); // LRU of pre-rendered static textures
  const CACHE_MAX = 96;

  /* ---------- helpers ---------- */
  function seeded(el, salt) {
    return U.rng(U.hashString(el.id + '|' + (salt || '')));
  }
  function doorSplits(ctx, w, h, s, color) {
    const doorCm = 60;
    if (w / s < 90 || h / s < 30) return;
    const n = Math.max(2, Math.round(w / s / doorCm));
    ctx.save();
    for (let i = 1; i < n; i++) {
      const x = Math.round((w / n) * i) + 0.5;
      ctx.strokeStyle = U.rgba(U.shade(color, -0.55), 0.55);
      ctx.lineWidth = Math.max(1, 0.25 * s);
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, h);
      ctx.stroke();
      ctx.strokeStyle = U.rgba('#ffffff', 0.12);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x + 1, 0);
      ctx.lineTo(x + 1, h);
      ctx.stroke();
    }
    ctx.restore();
  }
  function edgeShading(ctx, w, h, s) {
    // top highlight + bottom shadow lip gives every box a sense of depth
    const lip = Math.max(1, Math.min(h * 0.12, 1.2 * s));
    let g = ctx.createLinearGradient(0, 0, 0, lip * 2);
    g.addColorStop(0, 'rgba(255,255,255,0.16)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, lip * 2);
    g = ctx.createLinearGradient(0, h - lip * 2, 0, h);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.22)');
    ctx.fillStyle = g;
    ctx.fillRect(0, h - lip * 2, w, lip * 2);
  }
  function noise(ctx, w, h, rand, density, alpha) {
    const count = Math.min(2200, Math.floor(w * h * density));
    for (let i = 0; i < count; i++) {
      ctx.fillStyle = rand() < 0.5 ? `rgba(0,0,0,${alpha})` : `rgba(255,255,255,${alpha})`;
      ctx.fillRect(rand() * w, rand() * h, 1, 1);
    }
  }

  /* ---------- texture painters: draw into (0,0,w,h) ---------- */
  const painters = {
    slats(ctx, el, w, h, s) {
      const c = el.color;
      const rand = seeded(el, 'slats');
      ctx.fillStyle = U.shade(c, -0.55); // shadow gaps
      ctx.fillRect(0, 0, w, h);
      let slat = 3 * s;
      let gap = 1.2 * s;
      const minPitch = 4; // px — keep slats readable when zoomed out
      if (slat + gap < minPitch) {
        const k = minPitch / (slat + gap);
        slat *= k;
        gap *= k;
      }
      const pitch = slat + gap;
      const count = Math.ceil(w / pitch);
      const offset = (w - count * pitch + gap) / 2;
      for (let i = 0; i < count; i++) {
        const x = offset + i * pitch;
        const tone = U.shade(c, (rand() - 0.5) * 0.1);
        const g = ctx.createLinearGradient(x, 0, x + slat, 0);
        g.addColorStop(0, U.shade(tone, 0.18));
        g.addColorStop(0.35, tone);
        g.addColorStop(1, U.shade(tone, -0.28));
        ctx.fillStyle = g;
        ctx.fillRect(x, 0, slat, h);
        // subtle vertical grain
        if (slat > 5) {
          ctx.strokeStyle = U.rgba(U.shade(tone, -0.4), 0.12);
          ctx.lineWidth = 0.6;
          for (let k = 0; k < 2; k++) {
            const gx = x + slat * (0.2 + rand() * 0.6);
            ctx.beginPath();
            ctx.moveTo(gx, 0);
            ctx.bezierCurveTo(gx + rand() * 2 - 1, h * 0.33, gx + rand() * 2 - 1, h * 0.66, gx, h);
            ctx.stroke();
          }
        }
      }
      // floor/ceiling shadow falloff
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, 'rgba(0,0,0,0.12)');
      g.addColorStop(0.15, 'rgba(0,0,0,0)');
      g.addColorStop(0.9, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(0,0,0,0.16)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    },

    woodgrain(ctx, el, w, h, s) {
      const c = el.color;
      const rand = seeded(el, 'grain');
      const base = ctx.createLinearGradient(0, 0, w, h);
      base.addColorStop(0, U.shade(c, 0.06));
      base.addColorStop(1, U.shade(c, -0.06));
      ctx.fillStyle = base;
      ctx.fillRect(0, 0, w, h);
      const spacing = Math.max(2.5, 1.1 * s);
      const lines = Math.ceil(h / spacing) + 2;
      ctx.lineWidth = Math.max(0.6, 0.12 * s);
      for (let i = 0; i < lines; i++) {
        const y0 = i * spacing + (rand() - 0.5) * spacing;
        const amp = (0.3 + rand() * 0.9) * spacing;
        const freq = (0.6 + rand() * 1.4) * (Math.PI * 2) / Math.max(w, 1);
        const phase = rand() * Math.PI * 2;
        ctx.strokeStyle = U.rgba(U.shade(c, -0.45), 0.08 + rand() * 0.14);
        ctx.beginPath();
        for (let x = 0; x <= w; x += Math.max(4, w / 60)) {
          const y = y0 + Math.sin(x * freq + phase) * amp;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      // cathedral arches / knots
      const knots = Math.min(6, Math.floor((w * h) / (90 * s * 40 * s)) + 1);
      for (let k = 0; k < knots; k++) {
        const cx = rand() * w;
        const cy = rand() * h;
        const rx = (8 + rand() * 14) * s;
        const ry = (1.2 + rand() * 2) * s;
        for (let r = 1; r <= 4; r++) {
          ctx.strokeStyle = U.rgba(U.shade(c, -0.5), 0.07);
          ctx.beginPath();
          ctx.ellipse(cx, cy, rx * (r / 4), ry * (r / 4), 0, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
      doorSplits(ctx, w, h, s, c);
      // recessed handle groove along the top
      if (h / s >= 25 && w / s >= 60) {
        const gy = Math.max(2, 2.5 * s);
        ctx.fillStyle = U.rgba(U.shade(c, -0.7), 0.55);
        ctx.fillRect(0, gy, w, Math.max(1, 0.6 * s));
      }
      edgeShading(ctx, w, h, s);
    },

    matte(ctx, el, w, h, s) {
      const c = el.color;
      const rand = seeded(el, 'matte');
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, U.shade(c, 0.05));
      g.addColorStop(1, U.shade(c, -0.05));
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
      noise(ctx, w, h, rand, 0.12, 0.035);
      doorSplits(ctx, w, h, s, c);
      edgeShading(ctx, w, h, s);
    },

    glass(ctx, el, w, h, s) {
      const c = el.color;
      const bezel = Math.max(1.5, 0.7 * s);
      ctx.fillStyle = U.shade(c, -0.35);
      ctx.fillRect(0, 0, w, h);
      const ix = bezel, iy = bezel, iw = w - bezel * 2, ih = h - bezel * 2;
      const g = ctx.createLinearGradient(0, iy, 0, iy + ih);
      g.addColorStop(0, U.shade(c, 0.1));
      g.addColorStop(1, U.shade(c, -0.1));
      ctx.fillStyle = g;
      ctx.fillRect(ix, iy, iw, ih);
      // soft inner glow (panel backlight)
      const rg = ctx.createRadialGradient(ix + iw * 0.3, iy + ih * 0.25, 0, ix + iw * 0.3, iy + ih * 0.25, Math.max(iw, ih) * 0.9);
      rg.addColorStop(0, 'rgba(120,150,190,0.16)');
      rg.addColorStop(1, 'rgba(120,150,190,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(ix, iy, iw, ih);
      // diagonal sheen band
      ctx.save();
      ctx.beginPath();
      ctx.rect(ix, iy, iw, ih);
      ctx.clip();
      const sheen = ctx.createLinearGradient(ix, iy, ix + iw, iy + ih);
      sheen.addColorStop(0.0, 'rgba(255,255,255,0)');
      sheen.addColorStop(0.28, 'rgba(255,255,255,0.10)');
      sheen.addColorStop(0.36, 'rgba(255,255,255,0.02)');
      sheen.addColorStop(0.5, 'rgba(255,255,255,0)');
      ctx.fillStyle = sheen;
      ctx.fillRect(ix, iy, iw, ih);
      ctx.restore();
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.lineWidth = 1;
      ctx.strokeRect(ix + 0.5, iy + 0.5, iw - 1, ih - 1);
    },

    mesh(ctx, el, w, h, s) {
      const c = el.color;
      ctx.fillStyle = c;
      ctx.fillRect(0, 0, w, h);
      const pitch = Math.max(3, 0.7 * s);
      const tile = document.createElement('canvas');
      const tp = Math.max(2, Math.round(pitch));
      tile.width = tile.height = tp;
      const t = tile.getContext('2d');
      t.fillStyle = U.rgba(U.shade(c, 0.35), 0.5);
      t.beginPath();
      t.arc(tp / 2, tp / 2, Math.max(0.5, tp * 0.2), 0, Math.PI * 2);
      t.fill();
      t.fillStyle = U.rgba(U.shade(c, -0.5), 0.35);
      t.fillRect(0, 0, tp, Math.max(0.5, tp * 0.12));
      ctx.fillStyle = ctx.createPattern(tile, 'repeat');
      ctx.fillRect(0, 0, w, h);
      edgeShading(ctx, w, h, s);
      // rounded end caps feel
      const g = ctx.createLinearGradient(0, 0, w, 0);
      g.addColorStop(0, 'rgba(0,0,0,0.25)');
      g.addColorStop(0.04, 'rgba(0,0,0,0)');
      g.addColorStop(0.96, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(0,0,0,0.25)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    },

    niche(ctx, el, w, h, s) {
      const c = el.color;
      const rand = seeded(el, 'niche');
      const frame = Math.max(2, 2 * s);
      ctx.fillStyle = U.shade(c, 0.04);
      ctx.fillRect(0, 0, w, h);
      const ix = frame, iy = frame, iw = Math.max(0, w - frame * 2), ih = Math.max(0, h - frame * 2);
      // recess with inset shadow
      ctx.fillStyle = U.shade(c, -0.22);
      ctx.fillRect(ix, iy, iw, ih);
      let g = ctx.createLinearGradient(0, iy, 0, iy + Math.min(ih, 12 * s));
      g.addColorStop(0, 'rgba(0,0,0,0.35)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(ix, iy, iw, Math.min(ih, 12 * s));
      g = ctx.createLinearGradient(ix, 0, ix + Math.min(iw, 6 * s), 0);
      g.addColorStop(0, 'rgba(0,0,0,0.22)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(ix, iy, Math.min(iw, 6 * s), ih);

      // shelves every ~35cm with objects
      const shelfCm = 35;
      const nShelves = Math.max(0, Math.floor(ih / s / shelfCm) - 1);
      const levels = [];
      for (let i = 1; i <= nShelves; i++) levels.push(iy + (ih / (nShelves + 1)) * i);
      levels.push(iy + ih); // base
      const thick = Math.max(1.5, 2.5 * s);
      const palette = ['#7d6b5d', '#a79584', '#5d6a72', '#b9a88f', '#8b5e4a', '#3f4a52', '#d8cfc0'];
      let prev = iy;
      for (const ly of levels) {
        const bay = ly - prev - thick;
        if (bay / s >= 22 && iw / s >= 20) {
          let x = ix + iw * (0.08 + rand() * 0.2);
          const end = ix + iw * (0.55 + rand() * 0.3);
          while (x < end) {
            const bw = (2 + rand() * 2.5) * s;
            const bh = Math.min(bay * 0.9, (17 + rand() * 9) * s);
            ctx.fillStyle = palette[Math.floor(rand() * palette.length)];
            const lean = rand() < 0.08;
            if (lean) {
              ctx.save();
              ctx.translate(x, ly);
              ctx.rotate(-0.25);
              ctx.fillRect(0, -bh, bw, bh);
              ctx.restore();
              x += bw * 2.2;
            } else {
              ctx.fillRect(x, ly - bh, bw, bh);
              x += bw + 0.25 * s;
            }
          }
          if (rand() < 0.65 && end + 14 * s < ix + iw) {
            // vase
            const vx = end + (5 + rand() * 6) * s;
            const vh = Math.min(bay * 0.7, (12 + rand() * 10) * s);
