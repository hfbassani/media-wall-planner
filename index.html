/* === src/prompt.js === */
/* Arch2D — WS5: Natural language decomposition algorithm & prompt builder (project.md §4.1, §4.2).
   Translates 2D coordinates, materials, and lighting into structured spatial prompts. */
(function () {
  'use strict';
  const A = window.Arch2D;
  const V = A.vocab;

  const standardRatios = [
    { ratio: 16 / 9, str: '16:9' },
    { ratio: 21 / 9, str: '21:9' },
    { ratio: 4 / 3, str: '4:3' },
    { ratio: 3 / 2, str: '3:2' },
    { ratio: 1 / 1, str: '1:1' },
    { ratio: 3 / 4, str: '3:4' },
    { ratio: 9 / 16, str: '9:16' },
  ];

  function nearestStandardRatio(ratioVal) {
    let best = standardRatios[0];
    let minDiff = Math.abs(ratioVal - best.ratio);
    for (const r of standardRatios) {
      const diff = Math.abs(ratioVal - r.ratio);
      if (diff < minDiff) {
        minDiff = diff;
        best = r;
      }
    }
    return best.str;
  }

  function gcd(a, b) {
    return b === 0 ? a : gcd(b, a % b);
  }

  function simplifyRatio(w, h) {
    const rw = Math.round(w);
    const rh = Math.round(h);
    const d = gcd(rw, rh);
    const sw = Math.round(rw / d);
    const sh = Math.round(rh / d);
    if (sw > 30 || sh > 30) {
      // Approximation for non-integer reductions
      return nearestStandardRatio(w / h);
    }
    return `${sw}:${sh}`;
  }

  /* ---------- Spatial positioning classification ---------- */
  function getVerticalZone(el, wallH) {
    if (el.y <= 25) return 'base';
    if (el.y + el.height >= wallH - 30 || el.y >= wallH * 0.65) return 'upper';
    return 'mid';
  }

  function getHorizontalZone(el, wallW) {
    const cx = el.x + el.width / 2;
    if (cx < wallW * 0.35) return 'left';
    if (cx > wallW * 0.65) return 'right';
    return 'center';
  }

  function describeElement(el, state) {
    const m = V.moods[state.mood] || V.moods.japandi;
    const materialPhrase = (m.materials && m.materials[el.texture]) || (V.textures[el.texture] && V.textures[el.texture].phrase) || 'architectural finish';

    let spatialPrefix = '';
    const vZone = getVerticalZone(el, state.wallHeight);
    const hZone = getHorizontalZone(el, state.wallWidth);

    if (vZone === 'base') {
      spatialPrefix = hZone === 'center' ? 'Anchoring the base along the floor level in the central zone,' : `Along the base of the ${hZone} wing at floor level,`;
    } else if (vZone === 'mid') {
      spatialPrefix = hZone === 'center' ? 'Mounted at eye-level in the primary central focal area,' : `Positioned along the ${hZone} section at eye-level,`;
    } else {
      spatialPrefix = hZone === 'center' ? 'Crowning the upper wall in the central zone,' : `Mounted along the upper ${hZone} elevation,`;
    }

    let ledDesc = '';
    if (el.ledHalo && el.ledUnderglow) {
      const tempPhrase = el.ledTemp === 4000 ? '4000K neutral daylight' : '3000K warm ambient';
      ledDesc = ` with integrated concealed ${tempPhrase} LED halo backlighting and downward under-cabinet glow`;
    } else if (el.ledHalo) {
      const tempPhrase = el.ledTemp === 4000 ? '4000K daylight' : '3000K warm white';
      ledDesc = ` featuring a soft recessed ${tempPhrase} LED halo backlight illuminating the wall surface behind`;
    } else if (el.ledUnderglow) {
      const tempPhrase = el.ledTemp === 4000 ? '4000K' : 'warm 3000K';
      ledDesc = ` with concealed ${tempPhrase} under-cabinet downward wash illumination`;
    }

    const w = Math.round(el.width);
    const h = Math.round(el.height);
    const noun = (V.presets[el.type] && V.presets[el.type].noun) || el.label.toLowerCase();

    return `${spatialPrefix} a ${w}cm wide by ${h}cm high ${noun} finished in ${materialPhrase}${ledDesc}.`;
  }

  function describeElements(state) {
    // Sort elements vertically: base units first -> mid focal -> upper storage
    const sorted = [...state.elements].sort((a, b) => {
      const va = getVerticalZone(a, state.wallHeight);
      const vb = getVerticalZone(b, state.wallHeight);
      const rank = { base: 0, mid: 1, upper: 2 };
      return rank[va] - rank[vb] || a.x - b.x;
    });

    return sorted.map((el) => describeElement(el, state));
  }

  /* ---------- Multimodal Vision Prompt (Gemini / GPT-4o / Image-to-Image) ---------- */
  function buildVisionPrompt(state, opts = {}) {
    const m = V.moods[state.mood] || V.moods.japandi;
    const modifiers = opts.modifiers || [];

    const hasSlats = state.elements.some((e) => e.texture === 'slats');
    const hasCredenza = state.elements.some((e) => e.type === 'credenza');
    const hasTv = state.elements.some((e) => e.type === 'tv' || e.texture === 'glass');
    const hasSoundbar = state.elements.some((e) => e.type === 'soundbar' || e.texture === 'mesh');
    const hasFireplace = state.elements.some((e) => e.type === 'fireplace');
    const hasShelves = state.elements.some((e) => e.type === 'bookshelf' || e.texture === 'niche');
    const hasUpper = state.elements.some((e) => e.type === 'upper');
    const hasLeds = state.elements.some((e) => e.ledHalo || e.ledUnderglow);
    const warmLed = state.elements.some((e) => (e.ledHalo || e.ledUnderglow) && e.ledTemp !== 4000);

    const craftBulletPoints = [];

    if (hasSlats) {
      const slatMat = (m.materials && m.materials.slats) || 'three-dimensional fluted white oak timber slats';
      craftBulletPoints.push(`- Feature Wall Backdrop: Three-dimensional ${slatMat} with deep tactile shadow reveals backed by matte black acoustic felt. Authentic wood grain with natural timber color variations and realistic depth.`);
    }

    if (hasCredenza) {
      const woodMat = (m.materials && m.materials.woodgrain) || 'warm natural oak veneer';
      craftBulletPoints.push(`- Floating Low Credenza: Continuous-grain ${woodMat} wrapping seamlessly across the top surface and drawer faces with 45-degree mitered waterfall edges and recessed shadowline finger pulls. Solidly cantilevered above the floor.`);
    }

    if (hasTv) {
      craftBulletPoints.push(`- Television: Flush-mounted ultra-slim OLED display with razor-thin bezels, showing deep pitch-black screen depth and subtle, realistic ambient window reflections on the dark glass panel.`);
    }

    if (hasSoundbar) {
      craftBulletPoints.push(`- Audio: Slim architectural soundbar wrapped in tactile acoustic mesh fabric, mounted flush directly below the television.`);
    }

    if (hasShelves) {
      const nicheMat = (m.materials && m.materials.niche) || 'limewashed open display niche';
      craftBulletPoints.push(`- Display Shelving / Niches: Deep architectural ${nicheMat}, minimally styled with curated ceramic vessels, art monographs, and sculptural objects with natural ambient occlusion.`);
    }

    if (hasFireplace) {
      const fireMat = (m.materials && m.materials.fireplace) || 'frameless linear electric fireplace';
      craftBulletPoints.push(`- Fireplace: Flush integrated ${fireMat} with warm glowing ember bed and realistic soft flame ribbons.`);
    }

    if (hasUpper) {
      const upperMat = (m.materials && m.materials.matte) || 'ultra-matte lacquer';
      craftBulletPoints.push(`- Upper Cabinetry: Minimalist handleless push-to-open upper cupboards finished in ${upperMat} with precise hairline reveals.`);
    }

    const customEls = state.elements.filter((e) => !['tv', 'soundbar', 'fireplace', 'credenza', 'slats', 'bookshelf', 'upper'].includes(e.type));
    if (customEls.length) {
      craftBulletPoints.push(`- Architectural Millwork: Custom built-in cabinetry modules finished with seamless architectural joinery.`);
    }

    let lightingBullet = '';
    if (hasLeds) {
      const tempDesc = warmLed ? 'warm 2700K-3000K' : 'neutral 4000K daylight';
      lightingBullet = `- Architectural Lighting: Concealed ${tempDesc} LED channels casting smooth indirect wash down the wall surfaces and under the floating cabinetry onto the floor. Soft diffuse light dispersion with zero harsh hotspots or visible diode glare.`;
    } else {
      lightingBullet = `- Architectural Lighting: Sophisticated layered ambient illumination with soft indirect cove lighting and realistic shadow falloff.`;
    }

    const extraMods = modifiers.length ? `\n• Stylistic Enhancements: ${modifiers.join(', ')}.` : '';

    const hasPhoto = opts.photo !== undefined ? !!opts.photo : !!(state.wallPhoto && state.wallPhoto.visible);
    const settingPara = hasPhoto
      ? `2. Real Room Architectural Setting: The design in the attached reference image is mapped directly onto an actual photograph of the client's living room. Preserve the real architectural room context, surrounding walls, existing floor finish, ambient room lighting, ceiling geometry, and environment visible in the reference photo, seamlessly installing the bespoke media wall cabinetry onto this physical wall.`
      : `2. Architectural Setting & Atmosphere: Set inside a luxury contemporary residence (${m.phrase} aesthetic). The main wall is finished in ${m.wallMaterial}. In the foreground, the floor is ${m.flooring || 'wide-plank European white oak hardwood with a subtle matte satin finish'}. The ceiling features a flush architectural shadowline reveal. ${m.atmosphere || 'Soft, diffused natural daylight enters through off-camera floor-to-ceiling sheer linen curtains, casting gentle directional window shadows across the wall.'}`;

    return [
      `The attached image is a 2D architectural CAD elevation schematic of a bespoke media wall. Render a hyper-realistic, photograph of this exact layout in a luxury residential interior:`,
      ``,
      `1. Layout & Reference Fidelity: Strictly follow the layout, proportions, and placement of all cabinetry, wall panels, TV, and shelving shown in the attached schematic. Crucial: Do NOT render any blue dimension lines, measurement numbers, arrows, bounding boxes, or CAD text labels from the reference image. Interpret all markings solely as physical architectural cabinetry and wall geometry.`,
      ``,
      settingPara,
      ``,
      `3. Materials & Craftsmanship:`,
      ...craftBulletPoints,
      lightingBullet,
      ``,
      `4. Photography & Camera Optics: Professional interior architectural photograph captured on a Hasselblad H6D-100c with a 35mm tilt-shift architectural lens at f/8. Perfectly plumb, straight vertical lines with zero barrel distortion or keystoning. Rich dynamic range, true-to-life surface textures, soft natural ambient occlusion, and an editorial finish worthy of Architectural Digest.` + extraMods,
      ``,
      `Omit: 2D drawing, blueprint lines, CAD dimensions, measurement text, watermarks, distorted angles, cartoonish rendering, plastic surfaces, oversaturated colors, clutter.`
    ].join('\n');
  }

  function build(state, opts = {}) {
    const format = opts.format || 'vision'; // 'vision' | 'prose' | 'midjourney' | 'sd'
    const modifiers = opts.modifiers || [];
    const m = V.moods[state.mood] || V.moods.japandi;

    const wallW = Math.round(state.wallWidth);
    const wallH = Math.round(state.wallHeight);
    const ratioVal = state.wallWidth / state.wallHeight;
    const aspectStr = simplifyRatio(state.wallWidth, state.wallHeight);
    const nearestStandard = nearestStandardRatio(ratioVal);

    if (format === 'vision') {
      const fullPrompt = buildVisionPrompt(state, opts);
      return {
        prompt: fullPrompt.trim(),
        negative: '2D blueprint, CAD dimensions, measurement arrows, cyan lines, text labels, drawing, CGI cartoon, warped perspective, blurry, low resolution, plastic textures',
        aspectRatio: aspectStr,
        nearestRatio: nearestStandard,
        ratio: ratioVal,
        mode: 'vision',
      };
    }

    // 1. Scene envelope context
    const sceneContext = `Architectural interior design elevation, custom built-in media wall measuring ${wallW}cm wide by ${wallH}cm high, featuring a ${m.wallMaterial}, ${m.phrase} aesthetic, ${m.lighting}. Foreground features ${m.flooring || 'wide-plank hardwood flooring'}.`;

    // 2. Element descriptions
    const elementSentences = describeElements(state);

    // 3. Modifiers (Lighting, Camera, Detailing, Render Engine)
    const extraModifiers = modifiers.length ? modifiers.join(', ') + '.' : '';

    let fullPrompt = '';
    let negativePrompt = '';

    if (format === 'midjourney') {
      const elementList = elementSentences.join(' ');
      const mods = modifiers.length ? modifiers.join(', ') : '35mm tilt-shift architectural photograph, f/8, octane render, 8k resolution, architectural digest photography';
      fullPrompt = `${sceneContext} ${elementList} ${mods} --ar ${aspectStr} --v ${V.config.midjourneyVersion} --style raw`;
      negativePrompt = 'blueprint, dimensions, wireframe, text, lowres, warped';
    } else if (format === 'sd') {
      // Stable Diffusion tag-based weighting
      const tags = [
        `architectural photography of custom media wall`,
        `${m.phrase} style`,
        `${m.wallMaterial}`,
        `${m.flooring || 'hardwood flooring'}`,
        ...state.elements.map((e) => `${e.label.toLowerCase()}`),
        ...(m.materials ? Object.values(m.materials) : []),
        ...modifiers,
        `photorealistic, highly detailed, 35mm architectural lens, architectural digest`,
      ];
      fullPrompt = tags.join(', ');
      negativePrompt = 'blurry, distorted, crooked, low resolution, bad proportions, watermark, text, signature, people, blueprint, CAD lines';
    } else {
      // Natural prose format for standalone text-to-image
      const elementList = elementSentences.join(' ');
      const polish = extraModifiers ? ` ${extraModifiers}` : ' Professional interior architectural photography, 35mm tilt-shift lens, perfectly plumb vertical lines, authentic photographic lighting, Architectural Digest.';
      fullPrompt = `${sceneContext} ${elementList}${polish}`;
      negativePrompt = 'blueprint, drawing, 2D diagram, cartoon, low resolution';
    }

    return {
      prompt: fullPrompt.trim(),
      negative: negativePrompt,
      aspectRatio: aspectStr,
      nearestRatio: nearestStandard,
      ratio: ratioVal,
      mode: format,
    };
  }

  function stripParams(prompt) {
    return prompt.replace(/\s*--ar\s+[0-9:]+/gi, '').replace(/\s*--v\s+[0-9.]+/gi, '').replace(/\s*--style\s+\w+/gi, '').trim();
  }

  A.prompt = {
    build,
    describeElements,
    chips: () => V.chips,
    standardRatios,
    nearestStandardRatio,
    stripParams,
  };
})();
</script>
<script>
/* === src/providers.js === */
/* Arch2D — WS6: Multi-provider AI image generation clients (project.md §4.3).
   Supports Pollinations (Flux - default), Google Nano Banana (Gemini API),
   OpenAI GPT-Image, and Custom OpenAI-compatible endpoints. */
(function () {
  'use strict';
  const A = window.Arch2D;
  const P = A.persistence;

  class ProviderError extends Error {
    constructor(code, message, hint = '') {
      super(message);
      this.name = 'ProviderError';
      this.code = code;
      this.hint = hint;
    }
  }

  const providers = [
    {
      id: 'pollinations',
      label: 'Pollinations AI (Flux)',
      needsKey: false,
      keyOptional: true,
      defaultModel: 'flux',
      models: ['flux', 'turbo', 'flux-realism'],
      keyUrl: 'https://enter.pollinations.ai',
      notes: 'Default provider. Zero-key instant free preview. (Community service; no SLA).',
    },
    {
      id: 'google',
      label: 'Google Nano Banana (Gemini)',
      needsKey: true,
      keyOptional: false,
      defaultModel: 'gemini-3.1-flash-image',
      models: ['gemini-3.1-flash-image', 'gemini-3.1-flash-lite-image', 'gemini-3-pro-image', 'gemini-2.5-flash-image'],
      keyUrl: 'https://aistudio.google.com/apikey',
      notes: 'Browser-safe Gemini REST API. High text adherence and architectural accuracy.',
    },
    {
      id: 'openai',
      label: 'OpenAI GPT-Image',
      needsKey: true,
      keyOptional: false,
      defaultModel: 'gpt-image-2.5-flare',
      models: ['gpt-image-2.5-flare', 'gpt-image-2.5-sunburst'],
      keyUrl: 'https://platform.openai.com/api-keys',
      notes: 'State-of-the-art photorealism. Paid API. Browser CORS may require a proxy.',
    },
    {
      id: 'custom',
      label: 'Custom (OpenAI-Compatible)',
      needsKey: false,
      keyOptional: true,
      defaultModel: 'flux-schnell',
      models: [],
      keyUrl: '',
      notes: 'Self-hosted or cloud proxy (e.g., LocalAI, Ollama, Together AI, Fal).',
    },
  ];

  let activeProviderId = P.getJSON('active_provider', 'pollinations');

  function getConfig(id) {
    const defaults = {
      apiKey: P.getSecret(id),
      model: (providers.find((p) => p.id === id) || {}).defaultModel || '',
      baseUrl: id === 'custom' ? 'http://localhost:8080/v1' : '',
      size: '1792x1024',
    };
    return Object.assign(defaults, P.getJSON(`provider_cfg_${id}`, {}));
  }

  function setConfig(id, partial) {
    if (partial.apiKey !== undefined) {
      P.setSecret(id, partial.apiKey);
      delete partial.apiKey;
    }
    const cur = P.getJSON(`provider_cfg_${id}`, {});
    P.setJSON(`provider_cfg_${id}`, Object.assign(cur, partial));
  }

  /* ---------- Provider-specific fetchers ---------- */

  // 1. Pollinations AI
  async function generatePollinations(opts, cfg, signal) {
    const cleanPrompt = A.prompt.stripParams(opts.prompt);
    const encPrompt = encodeURIComponent(cleanPrompt);
    const model = cfg.model || 'flux';
    const width = opts.ratio >= 1 ? 1344 : 768;
    const height = opts.ratio >= 1 ? Math.round(1344 / opts.ratio) : 1344;

    const keyParam = cfg.apiKey ? `&key=${encodeURIComponent(cfg.apiKey)}` : '';
    const seed = Math.floor(Math.random() * 1000000);
    // gen.pollinations.ai primary URL
    const url = `https://gen.pollinations.ai/image/${encPrompt}?model=${model}&width=${width}&height=${height}&seed=${seed}&nologo=true${keyParam}`;

    try {
      // Test fetch to confirm no 401/402 payment wall
      const res = await fetch(url, { signal, method: 'GET' });
      if (!res.ok) {
        if (res.status === 401 || res.status === 402) {
          throw new ProviderError('auth', 'Pollinations rate limit or authorization required.', 'Get a free community key at enter.pollinations.ai and paste it in settings.');
        }
        throw new ProviderError('server', `Pollinations returned HTTP ${res.status}: ${res.statusText}`);
      }
      const blob = await res.blob();
      const objectUrl = URL.createObjectURL(blob);
      return {
        src: objectUrl,
        kind: 'objecturl',
        canvasSafe: true, // blob from successful fetch is fully canvas safe
        provider: 'pollinations',
        model,
        prompt: opts.prompt,
        createdAt: Date.now(),
      };
    } catch (err) {
      if (err.name === 'AbortError') throw new ProviderError('aborted', 'Request was cancelled.');
      if (err instanceof ProviderError) throw err;
      // If direct fetch had CORS issues, fallback to direct img URL with caveat
      return {
        src: url,
        kind: 'url',
        canvasSafe: false,
        provider: 'pollinations',
        model,
        prompt: opts.prompt,
        createdAt: Date.now(),
      };
    }
  }

  // 2. Google Nano Banana (Gemini)
  async function generateGoogle(opts, cfg, signal) {
    const key = cfg.apiKey || P.getSecret('google');
    if (!key) {
      throw new ProviderError('auth', 'Google AI Studio API key required.', 'Get a free API key at aistudio.google.com and enter it in settings.');
    }

    const model = cfg.model || 'gemini-3.1-flash-image';
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;

    // Map nearest ratio to Gemini's accepted aspect ratios (16:9, 4:3, 1:1, 3:4, 9:16)
    const validRatios = ['16:9', '4:3', '1:1', '3:4', '9:16', '21:9', '3:2'];
    const ar = validRatios.includes(opts.nearestRatio) ? opts.nearestRatio : '16:9';

    const payload = {
      contents: [
        {
          parts: [{ text: opts.prompt }],
        },
      ],
      generationConfig: {
        responseModalities: ['IMAGE', 'TEXT'],
        imageConfig: {
          aspectRatio: ar,
        },
      },
    };

    let res;
    try {
      res = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-goog-api-key': key,
        },
        body: JSON.stringify(payload),
        signal,
      });
    } catch (err) {
      if (err.name === 'AbortError') throw new ProviderError('aborted', 'Request was cancelled.');
      throw new ProviderError('network', `Network request failed: ${err.message}`);
    }

    if (!res.ok) {
      let errText = '';
      try {
        const errJson = await res.json();
        errText = errJson.error ? errJson.error.message : JSON.stringify(errJson);
      } catch (e) {
        errText = await res.text();
      }
      if (res.status === 400 && errText.includes('API_KEY')) {
        throw new ProviderError('auth', 'Invalid Google API Key.', 'Please verify your API key in Google AI Studio.');
      }
      throw new ProviderError('server', `Google API Error (${res.status}): ${errText}`);
    }

    const data = await res.json();
    const candidate = data.candidates && data.candidates[0];
    if (!candidate || !candidate.content || !candidate.content.parts) {
      throw new ProviderError('bad_response', 'Google API returned no candidates or content parts.');
    }

    const imgPart = candidate.content.parts.find((p) => p.inlineData && p.inlineData.data);
    if (!imgPart) {
      const textPart = candidate.content.parts.find((p) => p.text);
      const textMsg = textPart ? textPart.text : 'No image produced.';
      throw new ProviderError('blocked', `Model returned text instead of image: "${textMsg}"`, 'The prompt may have triggered a safety filter or model refusal.');
    }

    const mime = imgPart.inlineData.mimeType || 'image/png';
    const dataUrl = `data:${mime};base64,${imgPart.inlineData.data}`;

    return {
      src: dataUrl,
      kind: 'dataurl',
      canvasSafe: true,
      provider: 'google',
      model,
      prompt: opts.prompt,
      createdAt: Date.now(),
    };
  }

  // 3. OpenAI GPT-Image
  async function generateOpenAI(opts, cfg, signal) {
    const key = cfg.apiKey || P.getSecret('openai');
    if (!key) {
      throw new ProviderError('auth', 'OpenAI API key required.', 'Enter your OpenAI API key in settings.');
    }

    const model = cfg.model || 'gpt-image-2.5-flare';
    const url = 'https://api.openai.com/v1/images/generations';
    const size = opts.ratio >= 1.3 ? '1792x1024' : opts.ratio <= 0.8 ? '1024x1792' : '1024x1024';

    const payload = {
      model,
      prompt: opts.prompt,
      n: 1,
      size,
      response_format: 'b64_json',
    };

    let res;
    try {
      res = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${key}`,
        },
        body: JSON.stringify(payload),
        signal,
      });
    } catch (err) {
      if (err.name === 'AbortError') throw new ProviderError('aborted', 'Request was cancelled.');
      // Direct browser requests to OpenAI often fail due to CORS
      throw new ProviderError(
        'cors',
        'OpenAI API request blocked by browser CORS policy.',
        'OpenAI restricts direct in-browser calls for key security. To use OpenAI in a browser, use the "Custom (OpenAI-Compatible)" provider configured with a local or self-hosted proxy.'
      );
    }

    if (!res.ok) {
      let errText = '';
      try {
        const j = await res.json();
        errText = j.error ? j.error.message : JSON.stringify(j);
      } catch (e) {
        errText = await res.text();
      }
      throw new ProviderError('server', `OpenAI Error (${res.status}): ${errText}`);
    }

    const data = await res.json();
    const item = data.data && data.data[0];
    if (!item) throw new ProviderError('bad_response', 'OpenAI returned empty data list.');

    if (item.b64_json) {
      return {
        src: `data:image/png;base64,${item.b64_json}`,
        kind: 'dataurl',
        canvasSafe: true,
        provider: 'openai',
        model,
        prompt: opts.prompt,
        createdAt: Date.now(),
      };
    } else if (item.url) {
      return {
        src: item.url,
        kind: 'url',
        canvasSafe: false,
        provider: 'openai',
        model,
        prompt: opts.prompt,
        createdAt: Date.now(),
      };
    }
    throw new ProviderError('bad_response', 'No image URL or b64_json in OpenAI response.');
  }

  // 4. Custom OpenAI-Compatible
  async function generateCustom(opts, cfg, signal) {
    let baseUrl = (cfg.baseUrl || 'http://localhost:8080/v1').replace(/\/+$/, '');
    const url = baseUrl.endsWith('/images/generations') ? baseUrl : `${baseUrl}/images/generations`;

    const headers = { 'Content-Type': 'application/json' };
    const key = cfg.apiKey || P.getSecret('custom');
    if (key) headers['Authorization'] = `Bearer ${key}`;

    const payload = {
      model: cfg.model || 'flux-schnell',
      prompt: opts.prompt,
      n: 1,
      size: cfg.size || '1024x1024',
      response_format: 'b64_json',
    };

    let res;
    try {
      res = await fetch(url, {
        method: 'POST',
        headers,
        body: JSON.stringify(payload),
        signal,
      });
    } catch (err) {
      if (err.name === 'AbortError') throw new ProviderError('aborted', 'Request was cancelled.');
      throw new ProviderError('network', `Failed to reach custom endpoint at ${url}: ${err.message}`);
    }

    if (!res.ok) {
      const txt = await res.text();
      throw new ProviderError('server', `Custom endpoint error (${res.status}): ${txt}`);
    }

    const data = await res.json();
    const item = data.data && data.data[0];
    if (!item) throw new ProviderError('bad_response', 'Endpoint returned empty data array.');

    if (item.b64_json) {
      return {
        src: `data:image/png;base64,${item.b64_json}`,
        kind: 'dataurl',
        canvasSafe: true,
        provider: 'custom',
        model: cfg.model,
        prompt: opts.prompt,
        createdAt: Date.now(),
      };
    }
    return {
      src: item.url,
      kind: 'url',
      canvasSafe: false,
      provider: 'custom',
      model: cfg.model,
      prompt: opts.prompt,
      createdAt: Date.now(),
    };
  }

  /* ---------- Main Generate Facade ---------- */
  async function generate(providerId, opts = {}) {
    const id = providerId || activeProviderId;
    const cfg = getConfig(id);
    const signal = opts.signal;

    switch (id) {
      case 'pollinations':
        return await generatePollinations(opts, cfg, signal);
      case 'google':
        return await generateGoogle(opts, cfg, signal);
      case 'openai':
        return await generateOpenAI(opts, cfg, signal);
      case 'custom':
        return await generateCustom(opts, cfg, signal);
      default:
        throw new ProviderError('config', `Unknown provider: ${id}`);
    }
  }

  A.providers = {
    ProviderError,
    list: () => providers,
    getConfig,
    setConfig,
    getActive: () => activeProviderId,
    setActive: (id) => {
      activeProviderId = id;
      P.setJSON('active_provider', id);
    },
    generate,
  };
})();
</script>
<script>
/* === src/studio.js === */
/* Arch2D — WS6: AI Render & Prompt Studio controller (project.md §4).
   Handles prompt tuning, live rendering feedback, provider settings, gallery,
   interactive CAD vs 3D split-slider comparison, and downloads. */
(function () {
  'use strict';
  const A = window.Arch2D;
  const U = A.util;

  let modalBackdrop, modalEl;
  let activeTab = 'generate'; // 'generate' | 'compare'
  let selectedFormat = 'vision'; // default to high-realism vision reference prompt
  let activeModifiers = new Set();
  let latestRender = null;
  let isGenerating = false;
  let abortController = null;
  let splitPercent = 50;
  let galleryHistory = [];

  function init() {
    createModalDOM();
    bindEvents();
    loadGallery();
  }

  function createModalDOM() {
    modalBackdrop = U.h('div', { class: 'modal-backdrop', id: 'studio-backdrop' });

    modalEl = U.h(
      'div',
      { class: 'studio-modal', id: 'studio-modal' },
      // Header
      U.h(
        'div',
        { class: 'studio-header' },
        U.h(
          'div',
          { class: 'studio-title' },
          U.h('span', null, '✨'),
          U.h('span', null, 'AI Render & Prompt Studio')
        ),
        U.h(
          'div',
          { class: 'studio-tabs' },
          U.h('button', { class: 'studio-tab active', id: 'tab-generate', onclick: () => switchTab('generate') }, 'Prompt & Render'),
          U.h('button', { class: 'studio-tab', id: 'tab-compare', onclick: () => switchTab('compare') }, 'Side-by-Side Compare')
        ),
        U.h('button', { class: 'icon-btn', id: 'btn-close-studio', title: 'Close (Esc)', onclick: close }, '✕')
      ),
      // Body Container
      U.h('div', { class: 'studio-body', id: 'studio-body' })
    );

    modalBackdrop.appendChild(modalEl);
    document.body.appendChild(modalBackdrop);

    // Close on backdrop click
    modalBackdrop.addEventListener('click', (e) => {
      if (e.target === modalBackdrop) close();
    });
  }

  function switchTab(tab) {
    activeTab = tab;
    modalEl.querySelector('#tab-generate').classList.toggle('active', tab === 'generate');
    modalEl.querySelector('#tab-compare').classList.toggle('active', tab === 'compare');
    renderBody();
  }

  function loadGallery() {
    galleryHistory = A.persistence.getJSON('render_gallery', []);
    if (galleryHistory.length > 0) latestRender = galleryHistory[0];
  }

  function saveToGallery(item) {
    galleryHistory.unshift(item);
    if (galleryHistory.length > 12) galleryHistory.pop();
    A.persistence.setJSON('render_gallery', galleryHistory);
  }

  function renderBody() {
    const body = modalEl.querySelector('#studio-body');
    body.innerHTML = '';

    if (activeTab === 'generate') {
      renderGenerateTab(body);
    } else {
      renderCompareTab(body);
    }
  }

  /* ---------- Generate Tab ---------- */
  function renderGenerateTab(container) {
    const leftCol = U.h('div', { class: 'studio-col-left' });
    const rightCol = U.h('div', { class: 'studio-col-right' });

    // 1. Format selector
    const formatRow = U.h(
      'div',
      { style: { display: 'flex', gap: '8px', alignItems: 'center', flexWrap: 'wrap' } },
      U.h('span', { class: 'studio-section-title', style: { margin: '0 8px 0 0' } }, 'Syntax:'),
      createFormatBtn('vision', '🖼️ Vision Reference (Gemini / Multimodal)'),
      createFormatBtn('prose', '📝 Natural Prose (Text-to-Image)'),
      createFormatBtn('midjourney', 'Midjourney v6.1'),
      createFormatBtn('sd', 'Stable Diffusion')
    );

    // Tip Banner for Vision Mode
    let tipBanner = null;
    if (selectedFormat === 'vision') {
      tipBanner = U.h(
        'div',
        { class: 'studio-tip-banner' },
        U.h('span', { style: { fontSize: '15px' } }, '💡'),
        U.h(
          'div',
          null,
          U.h('strong', null, 'Gemini Vision Workflow: '),
          'Download the Clean Reference PNG below and paste it together with this prompt into Gemini. All measurement numbers are replaced with photorealistic material craftsmanship, lighting physics, and strict CAD-suppression directives.'
        )
      );
    }

    // 2. Prompt Textarea
    const promptData = A.prompt.build(A.store.getState(), { format: selectedFormat, modifiers: Array.from(activeModifiers) });
    const textarea = U.h('textarea', { class: 'prompt-textarea', id: 'studio-prompt-input' }, promptData.prompt);

    // Reference Image Export State for AI
    const st = A.store.getState();
    const hasPhotoLoaded = !!(st.wallPhoto && A.photo && A.photo.has(st.wallPhoto.id));
    let studioIncludePhoto = hasPhotoLoaded && st.wallPhoto.visible;
    let studioIncludeMeas = false; // clean reference by default for AI

    function updateStudioPrompt() {
      const pData = A.prompt.build(A.store.getState(), {
        format: selectedFormat,
        modifiers: Array.from(activeModifiers),
        photo: studioIncludePhoto,
      });
      textarea.value = pData.prompt;
    }

    // Quick Action Bar
    const promptActions = U.h(
      'div',
      { style: { display: 'flex', flexDirection: 'column', gap: '8px' } },
      U.h(
        'div',
        { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '8px' } },

        U.h(
          'button',
          {
            class: 'btn secondary sm',
            id: 'btn-copy-studio-prompt',
            onclick: () => {
              navigator.clipboard.writeText(textarea.value);

            },

          selectedFormat === 'vision' ? '📋 Copy Vision Prompt' : '📋 Copy Prompt'

      U.h(
        'div',
        {
          style: {
            display: 'flex',
            justifyContent: 'space-between',
            alignItems: 'center',
            flexWrap: 'wrap',
            gap: '8px',
            background: 'var(--bg-2)',
            padding: '8px 12px',
            borderRadius: 'var(--r-md)',
            border: '1px solid var(--line)',
          },
        },
        U.h(
          'div',
          { style: { display: 'flex', alignItems: 'center', gap: '14px', flexWrap: 'wrap' } },
          U.h('span', { style: { fontSize: 'var(--fs-xs)', fontWeight: '600', color: 'var(--text-1)' } }, 'Reference Image:'),
          hasPhotoLoaded
            ? U.h(
                'label',
                { class: 'export-check-label', style: { fontSize: 'var(--fs-xs)', color: 'var(--text-0)', cursor: 'pointer' } },
                U.h('input', {
                  type: 'checkbox',
                  checked: studioIncludePhoto,
                  id: 'chk-studio-photo',
                  onchange: (e) => {
                    studioIncludePhoto = e.target.checked;
                    updateStudioPrompt();
                    A.ui.toast(studioIncludePhoto ? '📷 Background photo included in AI reference' : '📷 Background photo excluded from AI reference', 'info');
                  },
                }),
                '📷 Background Photo'
              )
            : U.h(
                'span',
                { style: { fontSize: 'var(--fs-xs)', color: 'var(--text-2)', display: 'inline-flex', alignItems: 'center', gap: '4px' } },
                '📷 Background Photo:',
                U.h('span', { style: { color: 'var(--text-3)' } }, 'none loaded ·'),
                U.h(
                  'a',
                  {
                    href: '#',
                    style: { color: 'var(--brass-strong)', textDecoration: 'underline', cursor: 'pointer' },
                    onclick: async (e) => {
                      e.preventDefault();
                      if (A.photo && A.photo.pickFile) {
                        const file = await A.photo.pickFile();
                        if (file) {
                          await A.photo.upload(file);
                          renderBody();
                        }
                      }
                    },
                  },
                  'Upload'
                )
              ),
          U.h(
            'label',
            { class: 'export-check-label', style: { fontSize: 'var(--fs-xs)', color: 'var(--text-0)', cursor: 'pointer' } },
            U.h('input', {
              type: 'checkbox',
              checked: studioIncludeMeas,
              id: 'chk-studio-meas',
              onchange: (e) => {
                studioIncludeMeas = e.target.checked;
                A.ui.toast(studioIncludeMeas ? '📐 Measurements included in reference' : '📐 Clean reference (measurements excluded)', 'info');
              },
            }),
            '📐 Measurements'
          )
        ),
        U.h(
          'div',
          { style: { display: 'flex', gap: '6px', alignItems: 'center' } },
          U.h(
            'button',
            {
              class: 'btn ghost sm',
              id: 'btn-copy-ref-image',
              title: 'Copy reference image to clipboard to paste directly into Gemini (Cmd+V)',
              onclick: () => {
                A.exporter.copyToClipboard({
                  widthPx: 2400,
                  measurements: studioIncludeMeas,
                  photo: studioIncludePhoto,
                  background: '#ffffff',
                });
              },
            },
            '📋 Copy Image'
          ),
          U.h(
            'button',
            {
              class: 'btn ghost sm',
              id: 'btn-download-clean-ref',
              title: 'Download reference image for Gemini or Midjourney',
              onclick: () => {
                A.exporter.downloadPNG({
                  widthPx: 2400,
                  measurements: studioIncludeMeas,
                  photo: studioIncludePhoto,
                  background: '#ffffff',
                });
              },
            },
            '⬇️ Download PNG'
          ),
          U.h(
            'button',
            {
              class: 'btn ghost sm',
              id: 'btn-more-export-opts',
              title: 'Open full Export Elevation dialog with live preview and custom options',
              onclick: () => {
                A.exporter.openModal();
              },
            },
            '⚙️ More...'
          )
        )
      )
    );

    // 3. Modifier Chips
    const chipsSection = U.h('div', { class: 'chip-group' });
    chipsSection.appendChild(U.h('div', { class: 'studio-section-title' }, 'Architectural Tuning Modifiers:'));

    const chipCategories = A.prompt.chips();
    for (const [catName, chipList] of Object.entries(chipCategories)) {
      const row = U.h('div', { class: 'chip-row' });
      for (const chip of chipList) {
        const isAct = activeModifiers.has(chip);
        const btn = U.h(
          'button',
          {
            class: `chip-btn ${isAct ? 'active' : ''}`,
            onclick: () => {
              if (activeModifiers.has(chip)) activeModifiers.delete(chip);
              else activeModifiers.add(chip);
              renderBody();
            },
          },
          chip
        );
        row.appendChild(btn);
      }
      chipsSection.appendChild(row);
    }

    leftCol.appendChild(formatRow);
    if (tipBanner) leftCol.appendChild(tipBanner);
    leftCol.appendChild(textarea);
    leftCol.appendChild(promptActions);
    leftCol.appendChild(chipsSection);

    // Right Column: Provider Selection & Live Generation
    const providerTitle = U.h('div', { class: 'studio-section-title' }, 'AI Render Provider:');
    const providerCards = U.h('div', { class: 'provider-cards' });

    const activeProvider = A.providers.getActive();
    for (const p of A.providers.list()) {
      const isAct = p.id === activeProvider;
      const card = U.h(
        'div',
        {
          class: `provider-card ${isAct ? 'active' : ''}`,
          onclick: () => {
            A.providers.setActive(p.id);
            renderBody();
          },
        },
        U.h('div', { class: 'provider-card-name' }, p.label),
        U.h('div', { class: 'provider-card-sub' }, p.needsKey ? 'API Key required' : 'Free / Instant')
      );
      providerCards.appendChild(card);
    }

    // Active Provider Config
    const curP = A.providers.list().find((p) => p.id === activeProvider);
    const curCfg = A.providers.getConfig(activeProvider);
    const configBox = U.h('div', { class: 'provider-config-box' });

    configBox.appendChild(U.h('div', { style: { fontSize: 'var(--fs-xs)', color: 'var(--text-1)' } }, curP.notes));

    if (curP.needsKey || curP.keyOptional) {
      const keyWrap = U.h('div', { style: { display: 'flex', flexDirection: 'column', gap: '4px' } });
      keyWrap.appendChild(
        U.h(
          'div',
          { style: { display: 'flex', justifyContent: 'space-between', fontSize: 'var(--fs-xs)' } },
          U.h('span', null, 'API Key:'),
          curP.keyUrl ? U.h('a', { href: curP.keyUrl, target: '_blank', style: { color: 'var(--brass)' } }, 'Get Key ↗') : null
        )
      );
      const keyInput = U.h('input', {
        type: 'password',
        class: 'input',
        placeholder: curP.keyOptional ? 'Optional key' : 'Paste API key here…',
        value: curCfg.apiKey || '',
        onchange: (e) => A.providers.setConfig(activeProvider, { apiKey: e.target.value }),
      });
      keyWrap.appendChild(keyInput);
      configBox.appendChild(keyWrap);
    }

    if (curP.models && curP.models.length > 0) {
      const modelWrap = U.h('div', { style: { display: 'flex', flexDirection: 'column', gap: '4px' } });
      modelWrap.appendChild(U.h('span', { style: { fontSize: 'var(--fs-xs)' } }, 'Model:'));
      const select = U.h(
        'select',
        {
          class: 'select',
          onchange: (e) => A.providers.setConfig(activeProvider, { model: e.target.value }),
        },
        ...curP.models.map((m) => U.h('option', { value: m, selected: m === curCfg.model }, m))
      );
      modelWrap.appendChild(select);
      configBox.appendChild(modelWrap);
    }

    if (activeProvider === 'custom') {
      const baseWrap = U.h('div', { style: { display: 'flex', flexDirection: 'column', gap: '4px' } });
      baseWrap.appendChild(U.h('span', { style: { fontSize: 'var(--fs-xs)' } }, 'Base URL:'));
      const baseInput = U.h('input', {
        class: 'input',
        value: curCfg.baseUrl || 'http://localhost:8080/v1',
        onchange: (e) => A.providers.setConfig(activeProvider, { baseUrl: e.target.value }),
      });
      baseWrap.appendChild(baseInput);
      configBox.appendChild(baseWrap);
    }

    // Security note
    const secNote = U.h(
      'div',
      { class: 'security-note' },
      '🔒 Security Notice: API keys are stored only in your browser (localStorage) and sent directly to the selected AI provider. Never use shared public computers.'
    );
    configBox.appendChild(secNote);

    // Generate CTA Button
    const generateBtn = U.h(
      'button',
      {
        class: `btn primary lg ${isGenerating ? 'loading' : ''}`,
        style: { width: '100%', justifyContent: 'center', padding: '14px', fontSize: 'var(--fs-md)' },
        onclick: () => triggerGeneration(textarea.value),
      },
      isGenerating ? '⏳ Generating Render…' : '✨ Generate 3D Render'
    );

    // Result Preview or Status
    const previewBox = U.h('div', { class: 'render-preview-box', id: 'studio-preview-box' });
    if (latestRender) {
      previewBox.appendChild(U.h('img', { src: latestRender.src, class: 'render-preview-img' }));
    } else {
      previewBox.appendChild(U.h('div', { style: { color: 'var(--text-3)', fontSize: 'var(--fs-sm)' } }, 'Rendered AI images will appear here'));
    }

    rightCol.appendChild(providerTitle);
    rightCol.appendChild(providerCards);
    rightCol.appendChild(configBox);
    rightCol.appendChild(generateBtn);
    rightCol.appendChild(previewBox);

    container.appendChild(leftCol);
    container.appendChild(rightCol);
  }

  function createFormatBtn(fmt, label) {
    const isAct = selectedFormat === fmt;
    return U.h(
      'button',
      {
        class: `btn sm ${isAct ? 'secondary' : 'ghost'}`,
        onclick: () => {
          selectedFormat = fmt;
          renderBody();
        },
      },
      label
    );
  }

  /* ---------- Generation Action ---------- */
  async function triggerGeneration(promptText) {
    if (isGenerating) return;
    isGenerating = true;
    abortController = new AbortController();
    renderBody();

    const activeProvider = A.providers.getActive();
    const promptData = A.prompt.build(A.store.getState());

    try {
      A.ui.toast(`Requesting render from ${activeProvider}…`, 'info');
      const result = await A.providers.generate(activeProvider, {
        prompt: promptText,
        nearestRatio: promptData.nearestRatio,
        ratio: promptData.ratio,
        signal: abortController.signal,
      });

      latestRender = result;
      saveToGallery(result);
      A.ui.toast('Render generated successfully!', 'success');
      activeTab = 'compare'; // Jump directly to comparison
    } catch (err) {
      console.error('[Arch2D Render Error]', err);
      let errMsg = err.message || 'Generation failed.';
      if (err.hint) errMsg += `\nHint: ${err.hint}`;
      A.ui.toast(errMsg, 'error');
    } finally {
      isGenerating = false;
      renderBody();
    }
  }

  /* ---------- Compare Tab (Split Slider & Downloads) ---------- */
  function renderCompareTab(container) {
    const leftCol = U.h('div', { class: 'studio-col-left', style: { flex: '1.4' } });
    const rightCol = U.h('div', { class: 'studio-col-right', style: { flex: '0.6' } });

    if (!latestRender) {
      leftCol.appendChild(
        U.h(
          'div',
          { style: { display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100%', gap: '16px' } },
          U.h('div', { style: { fontSize: '40px' } }, '🖼️'),
          U.h('div', { style: { color: 'var(--text-2)' } }, 'No AI renders generated yet.'),
          U.h('button', { class: 'btn primary', onclick: () => switchTab('generate') }, 'Generate Your First Render')
        )
      );
      container.appendChild(leftCol);
      container.appendChild(rightCol);
      return;
    }

    // Interactive Split Slider Viewer
    const viewer = U.h('div', { class: 'split-viewer', id: 'split-viewer' });

    // CAD canvas render
    const cadCanvas = A.exporter.renderCanvas({ widthPx: 1400, annotations: true, rulers: true, grid: true });
    cadCanvas.className = 'split-img-cad';

    // 3D Render Image
    const renderImg = U.h('img', { src: latestRender.src, class: 'split-img-render' });

    // Overlay containing the render, clipped by splitPercent
    const overlay = U.h('div', { class: 'split-overlay', style: { width: `${splitPercent}%` } });
    overlay.appendChild(renderImg);

    // Drag Handle
    const handle = U.h('div', { class: 'split-handle', style: { left: `${splitPercent}%` } });

    viewer.appendChild(cadCanvas);
    viewer.appendChild(overlay);
    viewer.appendChild(handle);

    // Mouse / touch drag for split slider
    let isDraggingSplit = false;
    const updateSplit = (clientX) => {
      const rect = viewer.getBoundingClientRect();
      const p = U.clamp(((clientX - rect.left) / rect.width) * 100, 2, 98);
      splitPercent = p;
      overlay.style.width = `${p}%`;
      handle.style.left = `${p}%`;
    };

    viewer.addEventListener('pointerdown', (e) => {
      isDraggingSplit = true;
      viewer.setPointerCapture(e.pointerId);
      updateSplit(e.clientX);
    });
    viewer.addEventListener('pointermove', (e) => {
      if (isDraggingSplit) updateSplit(e.clientX);
    });
    viewer.addEventListener('pointerup', () => {
      isDraggingSplit = false;
    });

    leftCol.appendChild(viewer);

    // Right Column: Download Actions & History
    rightCol.appendChild(U.h('div', { class: 'studio-section-title' }, 'Export & Downloads:'));

    const btnDownload3D = U.h(
      'button',
      {
        class: 'btn primary',
        style: { width: '100%', justifyContent: 'center' },
        onclick: () => {
          if (latestRender.kind === 'dataurl' || latestRender.kind === 'objecturl') {
            U.downloadDataUrl(latestRender.src, `arch2d-render-${Date.now()}.png`);
          } else {
            window.open(latestRender.src, '_blank');
          }
        },
      },
      '💾 Download 3D Render'
    );

    const btnDownloadCAD = U.h(
      'button',
      {
        class: 'btn',
        style: { width: '100%', justifyContent: 'center' },
        onclick: () => A.exporter.downloadPNG({ widthPx: 2400 }),
      },
      '📷 Download CAD PNG (2400px)'
    );

    const btnDownloadSheet = U.h(
      'button',
      {
        class: 'btn',
        style: { width: '100%', justifyContent: 'center' },
        onclick: async () => {
          if (!latestRender.canvasSafe) {
            A.ui.toast('Cannot create comparison sheet: external URL image cannot be rasterized safely without CORS.', 'error');
            return;
          }
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = async () => {
            try {
              const sheet = await A.exporter.comparisonSheet(img);
              sheet.toBlob((blob) => {
                if (blob) U.downloadBlob(blob, `arch2d-comparison-sheet-${Date.now()}.png`);
              });
            } catch (e) {
              A.ui.toast('Export sheet failed: ' + e.message, 'error');
            }
          };
          img.src = latestRender.src;
        },
      },
      '📑 Download Comparison Sheet'
    );

    rightCol.appendChild(btnDownload3D);
    rightCol.appendChild(btnDownloadCAD);
    rightCol.appendChild(btnDownloadSheet);

    // Gallery history
    rightCol.appendChild(U.h('div', { class: 'studio-section-title', style: { marginTop: '16px' } }, 'Render History:'));
    const galleryGrid = U.h('div', { class: 'gallery-grid' });
    for (const item of galleryHistory) {
      const thumb = U.h(
        'div',
        {
          class: 'gallery-thumb',
          onclick: () => {
            latestRender = item;
            renderBody();
          },
        },
        U.h('img', { src: item.src })
      );
      galleryGrid.appendChild(thumb);
    }
    rightCol.appendChild(galleryGrid);

    container.appendChild(leftCol);
    container.appendChild(rightCol);
  }

  /* ---------- Public API ---------- */
  function open() {
    modalBackdrop.classList.add('open');
    renderBody();
  }

  function close() {
    modalBackdrop.classList.remove('open');
    if (abortController) {
      abortController.abort();
      abortController = null;
    }
  }

  function bindEvents() {
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modalBackdrop.classList.contains('open')) {
        close();
      }
    });
  }

  A.studio = {
    init,
    open,
    close,
  };
})();
</script>
<script>
/* === src/ui.js === */
/* Arch2D — WS4: UI Shell, sidebars, and inspector controller (project.md §3, §3.1, §3.2, §3.7). */
(function () {
  'use strict';
  const A = window.Arch2D;
  const U = A.util;
  const V = A.vocab;

  let leftSidebar, rightSidebar, stageToolbar;

  function init() {
    leftSidebar = document.getElementById('sidebar-left');
    rightSidebar = document.getElementById('sidebar-right');
    stageToolbar = document.getElementById('stage-toolbar');

    initHeader();
    initStageToolbar();
    renderLeftSidebar();
    renderInspector();

    // Listen to changes to re-render inspector or update buttons
    A.bus.on('state:changed', (e) => {
      const r = e && e.reason;
      if (r !== 'drag') {
        renderInspector();
      }
      updateHeaderState();
      if (r === 'photo' || r === 'wall' || r === 'mood' || r === 'reset' || r === 'undo' || r === 'redo') {
        renderLeftSidebar();
      }
    });
    A.bus.on('selection:changed', () => {
      renderInspector();
    });
    A.bus.on('history:changed', () => {
      updateHeaderState();
    });
    A.bus.on('annotations:toggled', () => {
      updateToolbarState();
    });
    A.bus.on('eyelevel:toggled', () => {
      updateToolbarState();
    });
    A.bus.on('ghost:toggled', () => {
      updateToolbarState();
    });
    A.bus.on('photo:ready', () => {
      renderLeftSidebar();
    });
    A.bus.on('autosave:written', () => {
      const badge = document.getElementById('badge-dirty');
      if (badge) {
        badge.textContent = 'Autosaved';
        badge.style.color = 'var(--success)';
        setTimeout(() => {
          if (badge) badge.style.color = '';
        }, 1200);
      }
    });

    // Mobile sidebar toggles
    const btnToggleLeft = document.getElementById('btn-toggle-left');
    if (btnToggleLeft) {
      btnToggleLeft.addEventListener('click', () => leftSidebar.classList.toggle('open'));
    }
  }

  /* ---------- Header Bindings ---------- */
  function initHeader() {
    const btnUndo = document.getElementById('btn-undo');
    const btnRedo = document.getElementById('btn-redo');
    const selectTpl = document.getElementById('select-template');
    const btnSave = document.getElementById('btn-save');
    const btnLoad = document.getElementById('btn-load');
    const inputLoad = document.getElementById('input-load');
    const btnExport = document.getElementById('btn-export');
    const btnStudio = document.getElementById('btn-studio');

    if (btnUndo) btnUndo.addEventListener('click', () => A.store.undo());
    if (btnRedo) btnRedo.addEventListener('click', () => A.store.redo());

    // Populate templates dropdown
    if (selectTpl) {
      for (const tpl of A.templates.list()) {
        const opt = document.createElement('option');
        opt.value = tpl.id;
        opt.textContent = tpl.label;
        selectTpl.appendChild(opt);
      }
      selectTpl.addEventListener('change', async (e) => {
        const id = e.target.value;
        if (!id) return;
        const confirmed = await confirmModal({
          title: 'Load Template?',
          message: 'Loading a template will replace your current canvas. Unsaved changes will be cleared.',
          okLabel: 'Load Template',
        });
        if (confirmed) {
          const tplState = A.templates.get(id);
          if (tplState) {
            A.store.load(tplState, { source: 'template' });
            A.canvas.fit();
            toast('Template loaded.', 'success');
          }
        }
        selectTpl.value = '';
      });
    }

    if (btnSave) btnSave.addEventListener('click', () => A.persistence.saveToFile());
    if (btnLoad) {
      btnLoad.addEventListener('click', async () => {
        const res = await A.persistence.openFile(inputLoad);
        if (res.ok) {
          A.canvas.fit();
          toast('Project loaded successfully!', 'success');
        } else if (res.errors && res.errors.length) {
          toast(res.errors[0], 'error');
        }
      });
    }

    if (btnExport) btnExport.addEventListener('click', () => A.exporter.openModal());
    if (btnStudio) btnStudio.addEventListener('click', () => A.studio.open());

    updateHeaderState();
  }

  function updateHeaderState() {
    const btnUndo = document.getElementById('btn-undo');
    const btnRedo = document.getElementById('btn-redo');
    if (btnUndo) btnUndo.disabled = !A.store.canUndo();
    if (btnRedo) btnRedo.disabled = !A.store.canRedo();
  }

  /* ---------- Stage Toolbar ---------- */
  function initStageToolbar() {
    if (!stageToolbar) return;
    stageToolbar.innerHTML = '';

    const btnZoomOut = U.h('button', { class: 'icon-btn', title: 'Zoom Out (-)', onclick: () => A.canvas.zoomBy(0.8) }, '−');
    const btnZoomIn = U.h('button', { class: 'icon-btn', title: 'Zoom In (+)', onclick: () => A.canvas.zoomBy(1.25) }, '+');
    const btnFit = U.h('button', { class: 'icon-btn', title: 'Fit to Viewport (Double-click)', onclick: () => A.canvas.fit() }, '⊡');

    const sep1 = U.h('div', { style: { width: '1px', height: '16px', background: 'var(--line)' } });

    const btnAnnot = U.h(
      'button',
      {
        class: 'btn ghost sm',
        id: 'btn-toggle-annot',
        title: 'Toggle Dimensions Overlay (A)',
        onclick: () => A.canvas.toggleAnnotations(),
      },
      '📐 Dimensions'
    );

    const btnEyeLevel = U.h(
      'button',
      {
        class: `btn sm ${A.canvas.isEyeLevel() ? 'secondary' : 'ghost'}`,
        id: 'btn-toggle-eyelevel',
        title: 'Toggle Seated Spectator Eye Level & Ideal TV Center (E)',
        onclick: () => A.canvas.toggleEyeLevel(),
      },
      '👁 TV Eye Level'
    );

    const btnSnap = U.h(
      'button',
      {
        class: `btn sm ${A.canvas.isSnapping() ? 'secondary' : 'ghost'}`,
        id: 'btn-toggle-snap',
        title: 'Toggle Magnetic Snapping',
        onclick: () => {
          A.canvas.setSnapping(!A.canvas.isSnapping());
          updateToolbarState();
        },
      },
      '🧲 Snap'
    );

    const btnGhost = U.h(
      'button',
      {
        class: `btn sm ${A.canvas.isGhost() ? 'secondary' : 'ghost'}`,
        id: 'btn-toggle-ghost',
        title: 'See-Through Ghost Mode (G) — View wall photo and outlets behind furniture',
        onclick: () => {
          A.canvas.toggleGhost();
          updateToolbarState();
        },
      },
      '👻 Ghost'
    );

    stageToolbar.appendChild(btnZoomOut);
    stageToolbar.appendChild(btnZoomIn);
    stageToolbar.appendChild(btnFit);
    stageToolbar.appendChild(sep1);
    stageToolbar.appendChild(btnAnnot);
    stageToolbar.appendChild(btnEyeLevel);
    stageToolbar.appendChild(btnSnap);
    stageToolbar.appendChild(btnGhost);

    updateToolbarState();
  }

  function updateToolbarState() {
    const btnAnnot = document.getElementById('btn-toggle-annot');
    if (btnAnnot) {
      btnAnnot.classList.toggle('primary', A.canvas.annotationsVisible());
    }
    const btnEye = document.getElementById('btn-toggle-eyelevel');

  /* ---------- Right Sidebar (Element Inspector) ---------- */
  function renderInspector() {
    if (!rightSidebar) return;

    const selIds = A.store.getSelection();
    const selElements = A.store.getSelectedElements();

    if (!selElements.length) {
      rightSidebar.appendChild(
        U.h(
          'div',
          { style: { display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100%', color: 'var(--text-2)', textAlign: 'center', gap: '12px', padding: '24px' } },

          U.h('div', { style: { fontWeight: '600', color: 'var(--text-1)' } }, 'No Selection'),
          U.h('div', { style: { fontSize: 'var(--fs-xs)' } }, 'Select an element on canvas to adjust dimensions, materials, colors and LED backlighting.')
        )
      );
      return;
    }

    if (selElements.length > 1) {
      // Multi-selection summary
      renderMultiInspector(selElements);
      return;
    }

    // Single element inspector
    const el = selElements[0];
    const secHeader = U.h(
      'div',
      { class: 'sidebar-section' },
      U.h('div', { class: 'section-heading' }, 'Selected Component'),
      U.h('input', {
        class: 'input',
        value: el.label,
        onchange: (e) => mutateEl(el.id, { label: e.target.value.trim() || el.label }),
      })
    );

    // Dimensions: W, H
    const secDims = U.h('div', { class: 'sidebar-section' });
    secDims.appendChild(U.h('div', { class: 'section-heading' }, 'Dimensions & Position (cm)'));

    );
    rowDim.appendChild(
      makeNumField('Height', el.height, (v) => mutateEl(el.id, { height: Math.max(V.config.minSizeCm, v) }))
    );
    const rowPos = U.h('div', { class: 'form-row' });
    rowPos.appendChild(
      makeNumField('X (Left)', el.x, (v) => mutateEl(el.id, { x: v }))
    );
    rowPos.appendChild(
      makeNumField('Y (Floor AFF)', el.y, (v) => mutateEl(el.id, { y: v }))
    );
    secDims.appendChild(rowDim);
    secDims.appendChild(rowPos);

    // Ergonomic TV Center Alignment Card (if selected element is a TV)

      secTvErgo = U.h('div', {
        class: 'sidebar-section',
        style: {
          background: 'rgba(234, 179, 8, 0.08)',
          padding: '12px',
          borderRadius: 'var(--r-md)',
          border: '1px solid rgba(234, 179, 8, 0.28)',
          gap: '6px',
        },
      });
      const eyeCm = A.canvas.getEyeLevelCm();
      const tvCenterCm = Math.round((el.y + el.height / 2) * 10) / 10;
      const deltaCm = Math.round((tvCenterCm - eyeCm) * 10) / 10;
      const isAligned = Math.abs(deltaCm) <= 1.5;

      secTvErgo.appendChild(
        U.h('div', { class: 'section-heading', style: { color: 'var(--brass)', display: 'flex', justifyContent: 'space-between' } },
          U.h('span', null, '👁 Ergonomic TV Center'),
          U.h('span', { style: { color: isAligned ? 'var(--success)' : 'var(--text-1)' } }, isAligned ? '✓ Aligned' : `${deltaCm > 0 ? '+' : ''}${deltaCm} cm`)
        )
      );

      secTvErgo.appendChild(
        U.h('div', { style: { fontSize: 'var(--fs-xs)', color: 'var(--text-1)', lineHeight: '1.4' } },
          `Ideal Center: ${eyeCm} cm AFF · Current: ${tvCenterCm} cm AFF`
        )
      );

      const btnAlign = U.h(
        'button',
        {
          class: 'btn sm primary',
          style: { width: '100%', justifyContent: 'center', marginTop: '4px' },

            toast('TV center aligned to spectator eye level.', 'success');

      );

    rowColor.appendChild(
      U.h(
        'div',
        { class: 'form-field' },
        U.h('label', { class: 'form-label' }, 'Base Color'),
        U.h('input', {
          type: 'color',
          class: 'input',
          style: { height: '36px', padding: '2px', cursor: 'pointer' },
          value: el.color,
          oninput: (e) => mutateEl(el.id, { color: e.target.value }),
        })
      )
    );
    rowColor.appendChild(
      U.h(
        'div',
        { class: 'form-field' },
        U.h('label', { class: 'form-label' }, `Opacity (${Math.round(el.opacity * 100)}%)`),
        U.h('input', {
          type: 'range',
          min: '0.1',
          max: '1',
          step: '0.05',
          value: el.opacity,
          oninput: (e) => mutateEl(el.id, { opacity: parseFloat(e.target.value) }),
        })
      )
    );
    secMat.appendChild(rowColor);

    // LED Lighting Modifiers
    const secLed = U.h('div', { class: 'sidebar-section' });

    const chkHalo = U.h(

      rowTemp.appendChild(

          'button',
          {
            class: `btn sm ${el.ledTemp === 3000 ? 'secondary' : 'ghost'}`,

          'Warm 3000K'
        )
      );
      rowTemp.appendChild(
        U.h(
          'button',
          {
            class: `btn sm ${el.ledTemp === 4000 ? 'secondary' : 'ghost'}`,
            onclick: () => mutateEl(el.id, { ledTemp: 4000 }),
          },

        )
      );
      secLed.appendChild(rowTemp);

    // Underglow toggle
    const chkUnderglow = U.h(

      U.h('input', {
        type: 'checkbox',
        checked: el.ledUnderglow,
        onchange: (e) => mutateEl(el.id, { ledUnderglow: e.target.checked }),
      }),
      'Under-Cabinet Downward Glow'
    );
    secLed.appendChild(chkUnderglow);

    // Layer & Actions
    const secActions = U.h('div', { class: 'sidebar-section' });
    secActions.appendChild(U.h('div', { class: 'section-heading' }, 'Stacking & Actions'));

    const layerRow = U.h('div', { class: 'btn-group', style: { width: '100%' } });

      U.h(
        'button',
        {
          class: 'btn',
          style: { flex: '1', justifyContent: 'center' },

        },
        '▲ Bring Forward'
      )
    );
    layerRow.appendChild(
      U.h(
        'button',
        {
          class: 'btn',
          style: { flex: '1', justifyContent: 'center' },
          onclick: () => A.store.sendBackward([el.id]),
        },
        '▼ Send Backward'
      )
    );
    secActions.appendChild(layerRow);

    const actionRow = U.h('div', { class: 'form-row', style: { marginTop: '6px' } });
    actionRow.appendChild(
      U.h(
        'button',

          class: 'btn',

      )
    );
    secActions.appendChild(actionRow);

    rightSidebar.appendChild(secHeader);
    rightSidebar.appendChild(secDims);
    if (secTvErgo) rightSidebar.appendChild(secTvErgo);
    rightSidebar.appendChild(secMat);
    rightSidebar.appendChild(secLed);
    rightSidebar.appendChild(secActions);
  }

  function renderMultiInspector(elements) {
    const ids = elements.map((e) => e.id);
    const sec = U.h(
      'div',
      { class: 'sidebar-section' },
      U.h('div', { class: 'section-heading' }, 'Multiple Selection'),
      U.h('div', { style: { fontSize: 'var(--fs-sm)', color: 'var(--text-1)' } }, `${elements.length} components selected`),
      U.h('div', { class: 'form-row', style: { marginTop: '8px' } },
        U.h('button', { class: 'btn', onclick: () => A.store.duplicateElements(ids) }, '📋 Duplicate All'),
        U.h('button', { class: 'btn danger', onclick: () => A.store.removeElements(ids) }, '🗑 Delete All')
      ),
      U.h('button', { class: 'btn ghost sm', style: { marginTop: '8px' }, onclick: () => A.store.clearSelection() }, 'Deselect All')
    );
    rightSidebar.appendChild(sec);
  }

  function mutateEl(id, partial) {
    A.store.update((draft) => {
      const target = draft.elements.find((e) => e.id === id);
      if (target) Object.assign(target, partial);
    }, { reason: 'inspector' });
  }

  function makeNumField(label, val, onChange) {
    return U.h(
      'div',
      { class: 'form-field' },
      U.h('label', { class: 'form-label' }, label),
      U.h('input', {
        type: 'number',
        class: 'input',
        value: Math.round(val),
        onchange: (e) => onChange(parseFloat(e.target.value) || 0),
      })
    );
  }

  /* ---------- Toasts & Confirmations ---------- */
  function toast(msg, type = 'info') {
    const stack = document.getElementById('toast-stack');
    if (!stack) return;
    const t = U.h('div', { class: `toast ${type}` }, msg);
    stack.appendChild(t);
    setTimeout(() => {
      t.style.opacity = '0';
      t.style.transform = 'translateY(8px)';
      t.style.transition = 'all 200ms ease';
      setTimeout(() => t.remove(), 220);
    }, 3200);
  }

  function confirmModal({ title, message, okLabel = 'OK', cancelLabel = 'Cancel' }) {
    return new Promise((resolve) => {
      const backdrop = U.h('div', { class: 'modal-backdrop open' });
      const modal = U.h(
        'div',
        { class: 'studio-modal', style: { maxWidth: '420px', height: 'auto', padding: '24px', gap: '16px' } },
        U.h('div', { style: { fontSize: 'var(--fs-lg)', fontWeight: '700' } }, title),
        U.h('div', { style: { fontSize: 'var(--fs-sm)', color: 'var(--text-1)' } }, message),
        U.h(
          'div',
          { style: { display: 'flex', justifyContent: 'flex-end', gap: '8px', marginTop: '12px' } },
          U.h('button', { class: 'btn ghost', onclick: () => close(false) }, cancelLabel),
          U.h('button', { class: 'btn primary', onclick: () => close(true) }, okLabel)
        )
      );
      backdrop.appendChild(modal);
      document.body.appendChild(backdrop);

      function close(val) {
        backdrop.remove();
        resolve(val);
      }
    });
  }

  A.ui = {
    init,
    toast,
    confirm: confirmModal,
  };
})();
</script>
<script>
/* === src/main.js === */
/* Arch2D — Application bootstrap (Phase 2). */
(function () {
  'use strict';
  const A = window.Arch2D;

  async function bootstrap() {
    // 1. Initialize UI shell and event listeners
    A.ui.init();

    // 2. Initialize interactive canvas in host element
    const canvasHost = document.getElementById('canvas-host');
    A.canvas.init(canvasHost);

    // 3. Initialize global keyboard shortcuts
    A.input.init();

    // 4. Initialize AI Studio modal
    A.studio.init();

    // 5. Check autosave state vs default template (project.md §5.2)
    let restored = false;
    if (A.persistence.hasAutosave()) {
      const saved = A.persistence.readAutosave();
      if (saved && saved.elements && saved.elements.length > 0) {
        const doRestore = await A.ui.confirm({
          title: 'Restore Previous Session?',
          message: `Found an autosaved media wall ("${saved.name}" with ${saved.elements.length} components). Would you like to restore it?`,
          okLabel: 'Restore Session',
          cancelLabel: 'Start Fresh',
        });
        if (doRestore) {
          A.store.reset(saved);
          restored = true;
          A.ui.toast('Restored previous session.', 'success');
        }
      }
    }

    if (!restored) {
      // Load starter template (Japandi Slats) so user immediately gets a gorgeous elevation
      const defaultTpl = A.templates.get('japandi-slats');
      if (defaultTpl) {
        A.store.reset(defaultTpl);
      }
    }

    // Fit canvas view to current wall
    A.canvas.fit();

    // 6. Start autosave listener
    A.persistence.startAutosave();

    // Notify ready
    A.bus.emit('app:ready');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootstrap);
  } else {
    bootstrap();
  }
})();
</script>
</body>
</html>
